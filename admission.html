<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5 Brother's Fitness Club - Admission Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      padding: 20px 10px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #1a1a1a;
      border: 2px solid #ffcc00;
      border-radius: 12px;
      padding: 25px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px dashed #333;
      padding-bottom: 15px;
    }
    .header h1 {
      color: #ffcc00;
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .header p {
      color: #aaaaaa;
      font-size: 13px;
      margin-top: 5px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #dddddd;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #242424;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: border 0.30s;
    }
    input:focus, select:focus {
      border-color: #ffcc00;
    }
    /* DOB Pointer cursor */
    input[type="date"] {
      cursor: pointer;
    }
    .btn-submit {
      width: 100%;
      background: #ffcc00;
      color: #000000;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
    }
    .btn-submit:active {
      transform: scale(0.98);
    }
    .admin-link {
      text-align: center;
      margin-top: 20px;
    }
    .admin-link button {
      background: transparent;
      border: 1px solid #444;
      color: #888;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    /* MODAL STYLES */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px 10px;
    }
    .modal-content {
      max-width: 950px;
      margin: 30px auto;
      background: #181818;
      border: 2px solid #ffcc00;
      border-radius: 12px;
      padding: 20px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    .modal-header h2 {
      color: #ffcc00;
      font-size: 20px;
    }
    .close-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 24px;
      cursor: pointer;
    }
    .admin-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .btn-action {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-csv {
      background: #25D366;
      color: #000;
    }
    .btn-clear {
      background: #e50914;
      color: #fff;
    }
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid #2a2a2a;
    }
    th {
      color: #ffcc00;
      background: #202020;
    }
    .del-btn {
      background: #e50914;
      color: #ffffff;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>5 Brother's Fitness Club</h1>
      <p>Official Admission & Registration Form</p>
    </div>

    <form id="admissionForm">
      <div class="form-group">
        <label for="fullName">Full Name (पूरा नाम) *</label>
        <input type="text" id="fullName" required placeholder="अपना नाम दर्ज करें">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number (मोबाइल नंबर) *</label>
        <input type="tel" id="phone" required placeholder="10 अंकों का मोबाइल नंबर" pattern="[0-9]{10}">
      </div>

      <!-- DOB INPUT: टच करते ही तुरंत पूरा कैलेंडर खुलेगा -->
      <div class="form-group">
        <label for="dob">Date of Birth (जन्म तिथि) *</label>
        <input 
          type="date" 
          id="dob" 
          required 
          onclick="this.showPicker()" 
          onfocus="this.showPicker()"
        >
      </div>

      <div class="form-group">
        <label for="plan">Membership Plan (प्लान चुनें) *</label>
        <select id="plan" required onchange="updateFee()">
          <option value="Student 1 Month" data-fee="300">Student 1 Month (₹300)</option>
          <option value="Student 3 Months" data-fee="900">Student 3 Months (₹900)</option>
          <option value="Student 6 Months" data-fee="1800">Student 6 Months (₹1800)</option>
          <option value="General 1 Month" data-fee="500">General 1 Month (₹500)</option>
          <option value="General 3 Months" data-fee="1300">General 3 Months (₹1300)</option>
          <option value="General 6 Months" data-fee="2500">General 6 Months (₹2500)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="fee">Admission Fee (शुल्क)</label>
        <input type="text" id="fee" value="₹300" readonly style="background: #1e1e1e; color: #25D366; font-weight: bold;">
      </div>

      <div class="form-group">
        <label for="payMode">Payment Mode (भुगतान का तरीका) *</label>
        <select id="payMode" required>
          <option value="UPI">UPI / Online</option>
          <option value="Cash at Counter">Cash at Gym Counter</option>
        </select>
      </div>

      <div class="form-group">
        <label for="referral">Referral / जिम में किसका रिफरेंस है?</label>
        <input type="text" id="referral" placeholder="दोस्त का नाम या मोबाइल नंबर (वैकल्पिक)">
      </div>

      <button type="submit" class="btn-submit">Submit Admission</button>
    </form>

    <div class="admin-link">
      <button onclick="openAdminModal()">🔒 Admin Database Access</button>
    </div>
  </div>

  <!-- ADMIN DATABASE MODAL -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📋 5 Brother's Club Member Database</h2>
        <button class="close-btn" onclick="closeAdminModal()">✕</button>
      </div>

      <div class="admin-actions">
        <button class="btn-action btn-csv" onclick="downloadCSV()">📥 Download Excel / CSV</button>
        <button class="btn-action btn-clear" onclick="clearAllMembers()">🗑️ Clear All Test Data</button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Name / ID</th>
              <th>Phone</th>
              <th>DOB</th>
              <th>Plan</th>
              <th>Fee</th>
              <th>Pay Mode</th>
              <th>Referral</th>
              <th style="text-align: center;">Action</th>
            </tr>
          </thead>
          <tbody id="memberTableBody">
            <!-- Data yahan render hoga -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Fee auto update based on plan selection
    function updateFee() {
      const planSelect = document.getElementById("plan");
      const selectedOption = planSelect.options[planSelect.selectedIndex];
      const fee = selectedOption.getAttribute("data-fee");
      document.getElementById("fee").value = "₹" + fee;
    }

    // Form Submit Handler
    document.getElementById("admissionForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const newMember = {
        id: "5BFC-" + Math.floor(10000 + Math.random() * 90000),
        date: new Date().toLocaleDateString('en-GB'),
        name: document.getElementById("fullName").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        dob: document.getElementById("dob").value,
        plan: document.getElementById("plan").value,
        fee: document.getElementById("fee").value.replace('₹', ''),
        payMode: document.getElementById("payMode").value,
        referral: document.getElementById("referral").value.trim() || '-'
      };

      let members = JSON.parse(localStorage.getItem("gymMembers") || "[]");
      members.unshift(newMember); // Naya form sabse upar add hoga
      localStorage.setItem("gymMembers", JSON.stringify(members));

      alert("✅ Admission Form Successfully Submitted!\nMember ID: " + newMember.id);
      document.getElementById("admissionForm").reset();
      updateFee();
    });

    // Admin Modal Password Check
    function openAdminModal() {
      const pwd = prompt("कृपया एडमिन पासवर्ड दर्ज करें:");
      if (pwd === "1234") {
        document.getElementById("adminModal").style.display = "block";
        loadAdminTable();
      } else if (pwd !== null) {
        alert("गलत पासवर्ड!");
      }
    }

    function closeAdminModal() {
      document.getElementById("adminModal").style.display = "none";
    }

    // Load Members in Table
    function loadAdminTable() {
      const tbody = document.getElementById("memberTableBody");
      tbody.innerHTML = "";
      let members = JSON.parse(localStorage.getItem("gymMembers") || "[]");

      if (members.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding: 20px; color:#777;">कोई एडमिशन रिकॉर्ड नहीं मिला।</td></tr>`;
        return;
      }

      members.forEach((m, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${m.date || '-'}</td>
          <td><b>${m.name}</b><br><small style="color:#ffcc00;">${m.id}</small></td>
          <td>${m.phone}</td>
          <td>${m.dob || '-'}</td>
          <td>${m.plan}</td>
          <td style="color:#25D366; font-weight:bold;">₹${m.fee}</td>
          <td>${m.payMode}</td>
          <td>${m.referral}</td>
          <td style="text-align: center;">
            <button class="del-btn" onclick="deleteMember(${index})">🗑️ Del</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Delete Single Member Record
    function deleteMember(index) {
      if (confirm("क्या आप वाकई इस रिकॉर्ड को डिलीट करना चाहते हैं?")) {
        let members = JSON.parse(localStorage.getItem("gymMembers") || "[]");
        members.splice(index, 1);
        localStorage.setItem("gymMembers", JSON.stringify(members));
        loadAdminTable();
      }
    }

    // Clear All Test Records
    function clearAllMembers() {
      if (confirm("⚠️ क्या आप पूरा डेटाबेस खाली करना चाहते हैं? सारे टेस्ट रिकॉर्ड हमेशा के लिए डिलीट हो जाएंगे!")) {
        localStorage.removeItem("gymMembers");
        loadAdminTable();
      }
    }

    // Download CSV / Excel
    function downloadCSV() {
      let members = JSON.parse(localStorage.getItem("gymMembers") || "[]");
      if (members.length === 0) {
        alert("डाउनलोड करने के लिए कोई डेटा नहीं है!");
        return;
      }

      let csv = "Date,Member ID,Name,Phone,DOB,Plan,Fee,Pay Mode,Referral\n";
      members.forEach(m => {
        csv += `"${m.date}","${m.id}","${m.name}","${m.phone}","${m.dob}","${m.plan}","${m.fee}","${m.payMode}","${m.referral}"\n`;
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "5_Brothers_Members_" + new Date().toISOString().slice(0, 10) + ".csv";
      a.click();
    }
  </script>
</body>
  </html>
