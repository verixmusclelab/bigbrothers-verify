<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>5 Brother’s Fitness Club – Supplier Bill Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--g:#ffcc00;--c:#141414;--b:#2a2a2a;--m:#8d8d8d;--ok:#00e676;--bad:#ff5252;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Arial,sans-serif}
body{background:#070707;color:#fff;max-width:480px;margin:0 auto;padding:8px 8px 36px;font-size:13px}
.brand{background:radial-gradient(circle at top,#2a2208,#0d0d0d);border:1px solid var(--g);border-radius:10px;padding:8px;text-align:center;margin-bottom:8px}
.brand b{color:var(--g);font-size:14px;letter-spacing:.5px;text-transform:uppercase}.brand small{display:block;color:var(--m);font-size:9px;margin-top:1px}
.nav{display:flex;gap:5px;margin-bottom:8px;align-items:center}
button{cursor:pointer;border:0;border-radius:7px;font-weight:700;font-size:11px;padding:6px 9px;background:#232323;color:#fff;white-space:nowrap}
.p{background:var(--g);color:#000}.d{background:#3a1515;color:#ff8a80}.s{background:#10301c;color:var(--ok)}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:9px;margin-bottom:8px}
h3{font-size:12px;color:var(--g);margin-bottom:6px}
input,textarea{width:100%;background:#000;border:1px solid #444;border-radius:7px;padding:7px 8px;color:#fff;font-size:13px;margin-bottom:5px}
.row{display:flex;gap:5px;align-items:center}.row>*{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{background:#1d1a0b;border:1px solid var(--g);color:var(--g)}
.itm{border:1px solid #2f2f2f;border-radius:7px;padding:6px;margin-bottom:6px}.itm input{margin:0;padding:6px;font-size:12px}.itm .row{margin-bottom:5px}.itm .row:last-child{margin:0}
.tot{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}.big{font-size:15px;font-weight:900}
.m{color:var(--m);font-size:10px}.bad{color:var(--bad)}.ok{color:var(--ok)}
.hr{display:flex;gap:4px;align-items:center;border-bottom:1px solid #222;padding:5px 0;font-size:11px}.hr button{padding:5px 7px}
.li{display:flex;gap:5px;align-items:center;background:var(--c);border:1px solid var(--b);border-radius:9px;padding:8px;margin-bottom:6px;cursor:pointer}
.wide{width:100%;padding:11px;margin-bottom:8px;font-size:12px}
.q{font-size:12px;font-weight:700;margin-bottom:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}
.dg{background:#181818;border:1px solid var(--g);border-radius:12px;padding:14px;width:100%;max-width:340px;font-size:13px}
.wl{position:fixed;inset:0;background:radial-gradient(circle at center,#2a2208,#050505);z-index:200;display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .5s}
.wl.out{opacity:0}.wl div{animation:up 1s ease both}.wl i{display:block;font-style:normal;color:#bbb;letter-spacing:4px;font-size:12px;margin-bottom:8px}.wl b{color:var(--g);font-size:26px;text-transform:uppercase;text-shadow:0 0 18px rgba(255,204,0,.5)}.wl small{display:block;color:var(--m);margin-top:10px;font-size:11px}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wl" id="wl"><div><i>WELCOME TO</i><b>5 Brother’s<br>Fitness Club</b><small>Supplier Bill &amp; Bakaya Portal</small></div></div>
<div class="brand"><b>5 Brother’s Fitness Club</b><small>Supplier Bill &amp; Bakaya Portal</small></div>
<div id="app"></div>
<script>
const P=[{n:'1 kg Gainer'},{n:'Labrada Gainer 2.7 kg'},{n:'Whey Protein',a:'कौन सा brand? (जैसे MuscleBlaze, Optimum)'},{n:'Creatine'},{n:'BCAA'},{n:'Pre-Workout'},{n:'अन्य',a:'Product का नाम'}];
let S={sup:[],gst:''},cur=null,V='home',H=[],dr=null,pend=null,F={},RC=null,BL=null,cu=null;
const $=s=>document.getElementById(s),N=x=>Number(x)||0,M=x=>'₹'+N(x).toLocaleString('en-IN'),
E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
T=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
D=s=>s?s.split('-').reverse().join('-'):'',uid=()=>Date.now()*10+Math.floor(Math.random()*10);
try{const x=JSON.parse(localStorage.getItem('5bfc_sup')||'null');if(x)S={sup:x.sup||[],gst:x.gst||''}}catch(e){}
const sv=()=>{try{localStorage.setItem('5bfc_sup',JSON.stringify(S))}catch(e){}},
sup=()=>S.sup.find(s=>s.id===cur),nd=()=>({d:T(),it:[],pays:[],eid:null,note:''}),
sI=l=>l.reduce((a,i)=>a+N(i.q)*N(i.r),0),sP=l=>l.reduce((a,p)=>a+N(p.a),0),
tot=e=>e.t==='buy'?N(e.amt):e.t==='pay'?-N(e.amt):sI(e.items)-sP(e.pays),
bef=(s,e)=>s.ev.filter(x=>x.date<e.date||(x.date===e.date&&x.id<e.id)).reduce((a,x)=>a+tot(x),0),
bal=s=>s.ev.reduce((a,x)=>a+tot(x),0),
lastPay=l=>{let d='';l.forEach(e=>{(e.t==='pay'?[{d:e.date}]:e.t==='bill'?e.pays:[]).forEach(p=>{if(p.d>d)d=p.d})});return d},
srt=s=>[...s.ev].sort((a,c)=>a.date<c.date?-1:a.date>c.date?1:a.id-c.id),
key=()=>({date:dr.d,id:dr.eid||Infinity});

function dlg(m,o={}){return new Promise(r=>{const x=document.createElement('div');x.className='ov';
x.innerHTML=`<div class="dg"><div style="margin-bottom:10px;white-space:pre-line">${E(m)}</div>${o.i?`<input id="dgi" value="${E(o.v||'')}">`:''}<div class="row" style="justify-content:flex-end">${o.c===0?'':'<button id="dgc">रद्द</button>'}<button class="${o.d?'d':'p'}" id="dgo">${o.ok||'ठीक है'}</button></div></div>`;
document.body.appendChild(x);const f=v=>{x.remove();r(v)};$('dgo').onclick=()=>f(o.i?$('dgi').value:true);if($('dgc'))$('dgc').onclick=()=>f(o.i?null:false);if(o.i)$('dgi').focus()})}
const cf=m=>dlg(m,{d:1,ok:'हाँ, Delete'}),pr=(m,v)=>dlg(m,{i:1,v}),al=m=>dlg(m,{c:0});

function rs(){if(pend){const s=sup();if(s)s.ev.push(pend);pend=null;sv()}}
function go(v){rs();H.push([V,cur]);if(H.length>30)H.shift();V=v;R();scrollTo(0,0)}
function bk(){rs();const h=H.pop();if(h){V=h[0];cur=h[1]}else{V='home';cur=null}R();scrollTo(0,0)}
function hm(){rs();H=[];V='home';cur=null;R();scrollTo(0,0)}
const nv=()=>`<div class="nav"><button class="p" onclick="hm()">🏠 Home</button><button onclick="bk()">⬅ Back</button>${cur?`<span class="m" style="flex:1;overflow:hidden;text-overflow:ellipsis">${E(sup()?sup().name:'')}</span><button onclick="go('led')">📂 पुराना</button><button onclick="go('bill')">🧾 नया बिल</button>`:''}</div>`;
function R(){if(V!=='home'&&!sup()){V='home';cur=null}
$('app').innerHTML=(V==='home'?'':nv())+(V==='home'?home_():V==='sup'?sup_():V==='bill'?bill_():V==='bill2'?bill2_():V==='led'?led_():V==='cust'?cust_():rc_())}

/* ---------- HOME ---------- */
function home_(){return `<div class="card"><h3>➕ नया Supplier</h3><div class="row"><input id="sn" placeholder="नाम (जैसे Mohit)" style="margin:0"><input id="sp" type="tel" placeholder="मोबाइल" style="margin:0"><button class="p" onclick="addS()">जोड़ो</button></div></div>`+
(S.sup.length?S.sup.map(s=>{const b=bal(s);return `<div class="li" onclick="openS(${s.id})"><div style="flex:1;min-width:0"><b>${E(s.name)}</b><div class="m">📞 ${E(s.phone)||'—'}</div></div><b class="${b>0?'bad':'ok'}" style="font-size:11px">${b>0?'बाकी '+M(b):'✔ कोई बकाया नहीं'}</b><button onclick="event.stopPropagation();editS(${s.id})">✏</button><button class="d" onclick="event.stopPropagation();delS(${s.id})">🗑</button></div>`}).join(''):'<div class="card m">अभी कोई supplier नहीं है। ऊपर से जोड़ें।</div>')+
`<div class="card"><div class="m" style="margin-bottom:4px">GST No. (Customer bill पर छपेगा)</div><div class="row"><input id="gs" value="${E(S.gst)}" placeholder="GSTIN दर्ज करें" style="margin:0"><button onclick="svG()">Save</button></div></div>`}
async function addS(){const n=$('sn').value.trim(),p=$('sp').value.trim();if(!n)return al('Supplier का नाम डालें');S.sup.push({id:uid(),name:n,phone:p,ev:[]});sv();R()}
async function svG(){S.gst=$('gs').value.trim();sv();al('GST No. save हो गया ✅')}
async function editS(id){const s=S.sup.find(x=>x.id===id),n=await pr('Supplier का नाम',s.name);if(n===null)return;const p=await pr('मोबाइल नंबर',s.phone);if(n.trim())s.name=n.trim();if(p!==null)s.phone=p.trim();sv();R()}
async function delS(id){if(!await cf('इस supplier और उसका पूरा हिसाब हमेशा के लिए delete करें?'))return;S.sup=S.sup.filter(x=>x.id!==id);if(cur===id)cur=null;sv();R()}
function openS(id){cur=id;dr=nd();H=[['home',null]];V='sup';R();scrollTo(0,0)}

/* ---------- SUPPLIER LANDING ---------- */
function sup_(){const s=sup(),b=bal(s);
return `<div class="card"><div class="row"><div style="flex:1"><b style="font-size:15px">${E(s.name)}</b><div class="m">📞 ${E(s.phone)||'—'}</div></div><button onclick="editS(${s.id})">✏ Edit</button></div></div>
<div class="card"><div class="q">📂 क्या आप पुराने Product और Bill के बारे में जानना चाहते हैं?</div><div class="m" style="margin-bottom:8px">${b>0?`अभी बकाया: <b class="bad">${M(b)}</b>`:'अभी कोई बकाया नहीं ✅'} · पुराना माल, bill और payment यहाँ add / edit / delete कर सकते हैं</div><button class="p" onclick="go('led')">हाँ, देखें →</button></div>
<div class="card"><div class="q">🧾 क्या आप केवल नया बिल बनाना चाहते हैं?</div><div class="m" style="margin-bottom:8px">नया माल चुनें, payment डालें और Bill बनाएँ (Self / Customer)</div><button class="p" onclick="go('bill')">हाँ, नया बिल बनाओ →</button></div>`}

/* ---------- NEW BILL (PAGE 1) ---------- */
function sm_(){const s=sup(),pv=bef(s,key()),ni=sI(dr.it),pp=sP(dr.pays),fin=pv+ni-pp,lp=[lastPay(s.ev),...dr.pays.map(p=>p.d)].sort().pop();
return `${pv?`<div class="tot"><span>पिछला बकाया</span><b>${M(pv)}</b></div>`:''}<div class="tot"><span>नया माल</span><b>${M(ni)}</b></div><div class="tot"><span>कुल</span><b>${M(pv+ni)}</b></div><div class="tot"><span>इस बिल पर payment</span><b class="ok">− ${M(pp)}</b></div><div class="tot"><span>आखिरी payment</span><b>${lp?D(lp):'—'}</b></div><div class="tot" style="border-top:1px solid #333;margin-top:3px;padding-top:6px"><span>${fin>0?'अब बाकी':fin<0?'Advance':'हिसाब'}</span><b class="big ${fin>0?'bad':'ok'}">${fin>0?M(fin):fin<0?M(-fin):'कोई बकाया नहीं ✅'}</b></div>`}
function U(){dr.it.forEach((i,k)=>{const e=$('lt'+k);if(e)e.textContent=M(N(i.q)*N(i.r))});const e=$('sm');if(e)e.innerHTML=sm_()}
function bill_(){const s=sup(),pv=bef(s,key());
return `<div class="card"><div class="row"><div style="flex:1"><b>${E(s.name)}</b><div class="m">📞 ${E(s.phone)||'—'}</div></div><div><div class="m">बिल की तारीख</div><input type="date" value="${dr.d}" style="width:130px;margin:0" onchange="dr.d=this.value;U()"></div></div></div>
${dr.eid?'<div class="card" style="border-color:var(--g)"><b>✏ पुराना बिल edit हो रहा है</b> <button onclick="dr=nd();R()">रद्द</button></div>':''}
<div class="card">${pv>0?`<div class="tot"><span>📒 पुराना बकाया</span><b class="bad">${M(pv)}</b></div><button class="p" onclick="go('led')">बकाया का हिसाब देखो →</button>`:`<b class="ok">✅ कोई पुराना बकाया नहीं</b><div class="m" style="margin-top:3px">नीचे से product चुनकर नया माल जोड़ें 👇</div>`}</div>
<div class="card"><h3>🛒 नया माल चुनो</h3><div class="chips">${P.map((p,k)=>`<button class="chip" onclick="addIt(${k})">+ ${E(p.n)}</button>`).join('')}</div></div>
${dr.it.length?`<div class="card"><h3>📦 खरीदा हुआ माल</h3>${dr.it.map((i,k)=>`<div class="itm"><div class="row"><input value="${E(i.n)}" oninput="dr.it[${k}].n=this.value"><button class="d" onclick="dr.it.splice(${k},1);R()">✕</button></div><div class="row"><input type="number" inputmode="decimal" placeholder="Qty" value="${E(i.q)}" oninput="dr.it[${k}].q=this.value;U()"><span>×</span><input type="number" inputmode="decimal" placeholder="Rate ₹" value="${E(i.r)}" oninput="dr.it[${k}].r=this.value;U()"><b id="lt${k}" style="min-width:70px;text-align:right">${M(N(i.q)*N(i.r))}</b></div></div>`).join('')}</div>`:''}
<div class="card"><h3>💰 क्या इस बिल पर payment की?</h3><div class="row"><input id="pa" type="number" inputmode="decimal" placeholder="Amount ₹" style="margin:0"><input id="pd" type="date" value="${dr.d}" style="margin:0"><button class="s" onclick="apay()">जोड़ो</button></div>${dr.pays.map((p,k)=>`<div class="hr"><span style="flex:1">${D(p.d)} – Payment</span><b class="ok">${M(p.a)}</b><button class="d" onclick="dr.pays.splice(${k},1);R()">✕</button></div>`).join('')}</div>
<div class="card" id="sm">${sm_()}</div>
<button class="p wide" onclick="goToNextBillPage()">👉 Next Page (बाकी डिटेल्स भरें)</button>`}
async function addIt(k){const p=P[k];let n=p.n;if(p.a){const a=await pr(p.a);if(a===null)return;n=p.n==='अन्य'?a:`${p.n} - ${a}`}dr.it.push({n,q:1,r:''});R()}
async function apay(){const a=N($('pa').value);if(a<=0)return al('Payment amount डालें');dr.pays.push({d:$('pd').value||dr.d,a});R()}

function goToNextBillPage(){
  const it=dr.it.filter(i=>i.n.trim()&&N(i.q)>0&&N(i.r)>0);
  if(!it.length&&!dr.pays.length)return al('कम से कम एक product (qty + rate) या payment डालें');
  go('bill2');
}

/* ---------- NEW BILL (PAGE 2 - EXTRA DETAILS) ---------- */
function bill2_(){
  const s=sup(), it=dr.it.filter(i=>i.n.trim()&&N(i.q)>0&&N(i.r)>0);
  const ni=sI(it), pp=sP(dr.pays);
  return `<div class="card"><h3>📝 Page 2: अतिरिक्त विवरण (Extra Details)</h3><div class="m" style="margin-bottom:8px">सप्लायर: <b>${E(s.name)}</b> | कुल आइटम्स: <b>${it.length}</b></div>
  <div style="margin-bottom:8px">विशेष नोट / Remarks (बिल पर छपेगा):</div>
  <textarea id="billNote" rows="3" placeholder="जैसे: माल डिलीवरी सही सलामत मिल गई, या अगली पेमेंट 10 दिन बाद..." oninput="dr.note=this.value">${E(dr.note||'')}</textarea>
  </div>
  <div class="card">
    <div class="tot"><span>नया माल कुल</span><b>${M(ni)}</b></div>
    <div class="tot"><span>पेमेंट कुल</span><b class="ok">− ${M(pp)}</b></div>
  </div>
  <button class="p wide" onclick="mk()">📄 Bill Generate – Self / Supplier ${dr.eid?'(अपडेट)':''}</button>
  <button class="wide" style="background:#10301c;color:var(--ok)" onclick="toCust()">🧑 Bill Generate – Customer</button>
  <button class="wide" style="background:#333;color:#fff" onclick="bk()">⬅ पिछला Page (Items बदलें)</button>`
}

async function mk(){const s=sup(),it=dr.it.filter(i=>i.n.trim()&&N(i.q)>0&&N(i.r)>0).map(i=>({n:i.n.trim(),q:N(i.q),r:N(i.r)}));
if(!it.length&&!dr.pays.length)return al('कम से कम एक product (qty + rate) या payment डालें');
const noteElem = $('billNote'); if(noteElem) dr.note = noteElem.value;
const e={id:dr.eid||uid(),t:'bill',date:dr.d,items:it,pays:dr.pays.map(p=>({d:p.d,a:N(p.a)})),note:dr.note||''},i=s.ev.findIndex(x=>x.id===e.id);
if(i>=0)s.ev[i]=e;else s.ev.push(e);sv();dr=nd();RC=bd(s,e);BL=null;go('rc');setTimeout(grab,400)}

/* ---------- OLD PRODUCTS / BILLS ---------- */
function led_(){const s=sup(),b=bal(s),lp=lastPay(s.ev),f=F,ev=srt(s);F={};
const by=t=>ev.filter(e=>e.t===t);
return `<div class="card"><h3>📒 ${E(s.name)} का हिसाब</h3><div class="tot"><span>कुल बकाया</span><b class="big ${b>0?'bad':'ok'}">${b>0?M(b):'कोई बकाया नहीं ✅'}</b></div><div class="tot"><span>आखिरी payment</span><b>${lp?D(lp):'—'}</b></div></div>
<div class="card"><h3>📦 पुराने Products ${pend&&pend.t==='buy'?'(edit)':''}</h3>${by('buy').map(e=>`<div class="hr"><div style="flex:1"><b>${D(e.date)}</b> ${E(e.items[0].n)}<div class="m">${e.items[0].q} × ${e.items[0].r}</div></div><b class="bad">${M(e.amt)}</b><button onclick="editEv(${e.id})">✏</button><button class="d" onclick="delEv(${e.id})">🗑</button></div>`).join('')||'<div class="m" style="margin-bottom:6px">अभी कोई पुराना product नहीं</div>'}
<div class="m" style="margin:8px 0 4px">+ Product जोड़ो (कौन सा, किस तारीख को, कितना)</div><input type="date" id="lfd" value="${f.d||T()}"><input id="lfn" list="pl" placeholder="Product (जैसे 1 kg Gainer)" value="${E(f.n||'')}"><datalist id="pl">${P.slice(0,-1).map(x=>`<option value="${E(x.n)}">`).join('')}</datalist><div class="row"><input id="lfq" type="number" inputmode="decimal" placeholder="Qty" value="${E(f.q||'')}"><input id="lfr" type="number" inputmode="decimal" placeholder="Rate ₹" value="${E(f.r||'')}"><button class="p" onclick="addOld()">+ जोड़ो</button></div>${pend?'<button onclick="rs();R()">रद्द</button>':''}</div>
<div class="card"><h3>🧾 पुराने Bills</h3>${by('bill').map(e=>`<div class="hr"><div style="flex:1"><b>${D(e.date)}</b> SB-${String(e.id).slice(-5)}<div class="m">${e.items.length} items · माल ${M(sI(e.items))} · payment ${M(sP(e.pays))}</div></div><button onclick="vb(${e.id})">👁</button><button onclick="editEv(${e.id})">✏</button><button class="d" onclick="delEv(${e.id})">🗑</button></div>`).join('')||'<div class="m">अभी कोई bill नहीं</div>'}<button class="p" style="margin-top:8px" onclick="go('bill')">+ नया Bill बनाओ</button></div>
<div class="card"><h3>💰 Payments ${pend&&pend.t==='pay'?'(edit)':''}</h3>${by('pay').map(e=>`<div class="hr"><div style="flex:1"><b>${D(e.date)}</b> Payment</div><b class="ok">${M(e.amt)}</b><button onclick="editEv(${e.id})">✏</button><button class="d" onclick="delEv(${e.id})">🗑</button></div>`).join('')||'<div class="m" style="margin-bottom:6px">अभी कोई payment नहीं</div>'}

async function mkF(){if(BL)return BL;if(!window.html2canvas||!window.jspdf)throw new Error('lib');const cv=await html2canvas($('rcpt'),{scale:2,backgroundColor:'#ffffff'}),w=cv.width/2,h=cv.height/2,
pdf=new jspdf.jsPDF({unit:'px',format:[w+20,h+20],orientation:w>h?'l':'p'});pdf.addImage(cv.toDataURL('image/png'),'PNG',10,10,w,h);
const png=await new Promise(r=>cv.toBlob(r,'image/png'));return BL={png,pdf:pdf.output('blob'),n:((RC.kind==='C'?RC.name:RC.sup.name)+'_'+RC.no).replace(/[^\w\-]+/g,'_')}}
async function dl(b,n){try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:n,data:b});return}}}catch(e){if(e&&e.code==='declined')return}
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function grab(){if(V!=='rc')return;try{const f=await mkF();await dl(f.png,f.n+'.png');await dl(f.pdf,f.n+'.pdf')}catch(e){al('Download नहीं हो पाया – internet check करके फिर कोशिश करें')}}
async function shr(){try{const f=await mkF(),fs=[new File([f.png],f.n+'.png',{type:'image/png'}),new File([f.pdf],f.n+'.pdf',{type:'application/pdf'})];

R();
