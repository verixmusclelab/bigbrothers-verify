<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diet Orders – Admin Approval</title>
<style>
  body{background:#0b0b0b;color:#fff;font-family:system-ui,sans-serif;padding:14px;max-width:520px;margin:auto}
  h2{color:#ffcc00}
  .c{background:#161616;border:1px solid #333;border-radius:12px;padding:12px;margin:10px 0;font-size:14px;line-height:1.6}
  button{padding:11px;border:0;border-radius:8px;font-weight:800;width:49%;font-size:14px;cursor:pointer;margin-top:6px}
  input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #444;background:#000;color:#fff;font-size:16px;text-align:center;letter-spacing:4px}
  .a{background:#3ddc84;color:#000}
  .r{background:#ff5c5c;color:#000}
  .y{background:#ffcc00;color:#000;width:100%;letter-spacing:normal}
  .m{color:#aaa;font-size:12px}
  .e{color:#ff6b6b;font-size:13px;margin-top:8px}
  .w{background:#3a1d00;border:1px solid #ff9900;color:#ffb84d;border-radius:8px;padding:6px 8px;margin:6px 0;font-size:13px;font-weight:700}
  .ss{max-width:100%;border-radius:8px;margin-top:6px;border:1px solid #444;cursor:zoom-in}
</style>
</head>
<body>

<!-- PIN LOCK SCREEN -->
<div id="lockScreen" class="c" style="text-align:center; margin-top: 40px; border-color: #ffcc00;">
  <h3 style="color:#ffcc00; margin-bottom: 8px;">🔒 Admin PIN Required</h3>
  <div class="m">कृपया 4 अंकों का Admin PIN दर्ज करें</div>
  <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <button class="y" onclick="checkPin()">Unlock Panel</button>
  <div id="pinError" class="e"></div>
</div>

<!-- MAIN ADMIN CONTENT -->
<div id="adminContent" style="display:none;">
  <h2>🧾 Diet Orders – Payment जाँचें</h2>
  <div class="m">अपने UPI app में UTR और रकम मिलाकर ही Approve करें।</div>
  <div id="st" class="m" style="margin-top:8px">⏳ Orders load ho rahe hain...</div>
  <div id="l"></div>
</div>

<script>
const $=i=>document.getElementById(i),say=t=>$("st").innerHTML=t;

function checkPin(){
  const pin = $("pinInput").value.trim();
  if(pin === "5555"){
    $("lockScreen").style.display = "none";
    $("adminContent").style.display = "block";
    initAudio();
    try{if("Notification" in window && Notification.permission==="default")Notification.requestPermission()}catch(e){}
    initFirebase();
  } else {
    $("pinError").innerText = "❌ गलत PIN!";
    $("pinInput").value = "";
  }
}

$("pinInput").addEventListener("keypress", function(event) {
  if (event.key === "Enter") { checkPin(); }
});

const L=u=>new Promise((r,e)=>{const s=document.createElement("script");s.src=u;s.onload=r;s.onerror=()=>e(new Error("load nahi hua: "+u));document.head.appendChild(s)});

const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let AC=null,pendingNow=0;
function initAudio(){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function beep(){
  try{
    if(!AC)return; if(AC.state==="suspended")AC.resume();
    [0,0.25,0.5].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=0.25;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+0.15)});
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([300,150,300])}catch(e){}
}
// Pending order jab tak hai, har 30 sec beep (page khula ho to)
setInterval(()=>{if(pendingNow>0)beep()},30000);

async function loadOrders(){
  try{
    say("✅ Orders fetch kiye ja rahe hain...");
    let first=true;
    firebase.firestore().collection("diet_orders").onSnapshot(q=>{
      const l=$("l");
      l.innerHTML="";
      const rows=[];
      q.forEach(x=>{const o=x.data();if(o.status==="pending")rows.push({ref:x.ref,o})});
      rows.sort((a,b)=>(b.o.t||0)-(a.o.t||0));
      pendingNow=rows.length;
      document.title=rows.length?`(${rows.length}) Diet Orders – Approve`:"Diet Orders – Admin Approval";
      if(!first){
        q.docChanges().forEach(c=>{
          if(c.type==="added"&&c.doc.data().status==="pending"){
            beep();
            try{if("Notification" in window&&Notification.permission==="granted"){const o=c.doc.data();new Notification("Naya Diet Payment",{body:`${o.n} · Rs ${o.price} · UTR ${o.utr}`})}}catch(e){}
          }
        });
      }
      first=false;
      if(rows.length===0){
        l.innerHTML="<div class='c' style='text-align:center;'>Koi pending order nahi hai.</div>";
        say("");
        return;
      }
      rows.forEach(({ref,o})=>{
        const e=document.createElement("div");
        e.className="c";
        const ssHtml=o.ss?`<br><img class="ss" src="${esc(o.ss)}" alt="Payment screenshot" onclick="window.open().document.write('<img src=&quot;'+this.src+'&quot; style=&quot;max-width:100%&quot;>')">`:"";
        const dup=o.dupUtr?`<div class="w">⚠️ Ye UTR pehle bhi use ho chuka hai – dhyan se check karein!</div>`:"";
        const stale=(o.notified===false&&Date.now()-(o.t||0)>20000)?`<div class="w">ℹ️ Is order ka phone push nahi gaya tha, par order yahan aa gaya.</div>`:"";
        e.innerHTML=`<b>${esc(o.n)}</b> · ${esc(o.mb)}<br>Goal: <b>${esc(o.goal||'General')}</b><br>${esc(o.days)} din · <b>₹${esc(o.price)}</b><br>UTR: <b>${esc(o.utr)}</b>${dup}${stale}${ssHtml}<br><span class="m">${new Date(o.t).toLocaleString()} · Umar ${esc(o.a)}, BMI ${esc(o.B)}</span><br><button class="a">✅ Approve</button> <button class="r">❌ Reject</button>`;
        const [btnA,btnR]=e.querySelectorAll("button");
        btnA.onclick=()=>ref.update({status:"approved"});
        btnR.onclick=()=>ref.update({status:"rejected"});
        l.appendChild(e);
      });
      say("");
    },err=>{
      say('<span class="e">Orders load karne mein error: '+esc(err.message)+' (Firestore Rules check karein)</span>');
    });
  }catch(err){
    say('<span class="e">Error: '+esc(err.message)+'</span>');
  }
}

async function initFirebase(){
  try{
    const V="https://www.gstatic.com/firebasejs/9.22.2/firebase-";
    await L(V+"app-compat.js");
    await L(V+"firestore-compat.js");
    
    if(!firebase.apps.length){
      firebase.initializeApp({
        apiKey:"AIzaSyA9z1gXZDB3W0lJxyHV9x2vWeb0Ees7z-g",
        authDomain:"brother-s-fitness-club.firebaseapp.com",
        projectId:"brother-s-fitness-club"
      });
    }
    loadOrders();
  }catch(e){
    say('<span class="e">'+e.message+' — internet / ad-blocker check karein.</span>');
  }
}
</script>
</body>
</html>
