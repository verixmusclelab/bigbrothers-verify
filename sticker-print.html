<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5 Brother's Nutrition - QR Sticker Print Sheet</title>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Arial', sans-serif;
}

body{
  background: #f0f0f0;
  padding: 15px;
}

/* TOP CONTROLS (PRINT TIME PAR HIDE HO JAYEGA) */
.controls-bar{
  background: #111;
  color: #fff;
  padding: 15px;
  border-radius: 10px;
  max-width: 900px;
  margin: 0 auto 20px auto;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
}

.controls-bar select, .controls-bar input{
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid #ffcc00;
  background: #222;
  color: #fff;
  font-weight: bold;
}

.print-btn{
  background: #ffcc00;
  color: #000;
  border: none;
  padding: 10px 20px;
  font-weight: 900;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}

/* A4 SHEET CONTAINER */
.a4-sheet{
  width: 210mm;
  min-height: 297mm;
  padding: 8mm 6mm;
  background: #fff;
  margin: 0 auto;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 3mm;
  align-content: start;
}

/* INDIVIDUAL STICKER (50mm x 25mm approx) */
.sticker{
  border: 1.5px solid #000;
  border-radius: 6px;
  padding: 4px 6px;
  height: 26mm;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: #fff;
  position: relative;
  overflow: hidden;
}

.sticker-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #000;
  padding-bottom: 2px;
}

.store-name{
  font-size: 7.5px;
  font-weight: 900;
  color: #000;
  letter-spacing: -0.2px;
}

.verified-tag{
  background: #000;
  color: #fff;
  font-size: 6px;
  padding: 1px 3px;
  border-radius: 2px;
  font-weight: bold;
}

.sticker-body{
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 2px;
}

.qr-box{
  width: 17mm;
  height: 17mm;
  display: flex;
  align-items: center;
  justify-content: center;
}

.qr-box img{
  width: 100%;
  height: 100%;
}

.code-details{
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.prod-title{
  font-size: 6.5px;
  font-weight: 900;
  color: #222;
  line-height: 1.1;
  margin-bottom: 2px;
}

.scratch-area{
  border: 1px dashed #666;
  background: #eee;
  padding: 2px 3px;
  border-radius: 3px;
  text-align: center;
}

.scratch-label{
  font-size: 5.5px;
  color: #555;
  font-weight: bold;
  text-transform: uppercase;
}

.actual-code{
  font-size: 8px;
  font-weight: 900;
  color: #000;
  letter-spacing: 0.5px;
}

.sticker-footer{
  font-size: 5px;
  color: #444;
  text-align: center;
  font-weight: bold;
  margin-top: 1px;
}

/* PRINT MEDIA SETUP */
@media print{
  body{
    background: #fff;
    padding: 0;
  }
  .controls-bar{
    display: none !important;
  }
  .a4-sheet{
    box-shadow: none;
    margin: 0;
    padding: 6mm 4mm;
    page-break-after: always;
  }
}
</style>
</head>
<body>

<div class="controls-bar">
  <div>
    <label>प्रॉडक्ट चुनें: </label>
    <select id="prodSelect" onchange="generateStickerGrid()">
      <option value="whey">Muscle Size 100% Whey (MSW)</option>
      <option value="gainer">MG Pro Power Mass Gainer (MGG)</option>
      <option value="active">Active Shake Protein (ACT)</option>
    </select>
  </div>

  <div>
    <label>शीट पर स्टिकर संख्या: </label>
    <select id="countSelect" onchange="generateStickerGrid()">
      <option value="40" selected>40 स्टिकर (1 A4 Sheet)</option>
      <option value="80">80 स्टिकर (2 Sheets)</option>
      <option value="120">120 स्टिकर (3 Sheets)</option>
    </select>
  </div>

  <button class="print-btn" onclick="window.print()">🖨️ A4 शीट प्रिंट करें</button>
</div>

<!-- A4 SHEET -->
<div class="a4-sheet" id="sheetContainer">
  <!-- Stickers JavaScript se generate honge -->
</div>

<script>
const CHARS = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";

function getCodeForIndex(prefix, index) {
  let num = (index * 9301 + 49297) % 233280;
  let part = "";
  let n = (num * 1000 + index * 37) >>> 0;
  for(let i = 0; i < 5; i++){
    part += CHARS[n % CHARS.length];
    n = Math.floor(n / CHARS.length) + (i * 7);
  }
  return prefix + part;
}

function generateStickerGrid() {
  const type = document.getElementById("prodSelect").value;
  const count = parseInt(document.getElementById("countSelect").value) || 40;
  const container = document.getElementById("sheetContainer");
  container.innerHTML = "";

  let prefix = "MSW";
  let title = "MUSCLE SIZE 100% WHEY";
  
  if(type === "gainer"){
    prefix = "MGG";
    title = "MG PRO MASS GAINER";
  } else if(type === "active"){
    prefix = "ACT";
    title = "ACTIVE SHAKE PROTEIN";
  }

  const baseUrl = "https://verixmusclelab.github.io/bigbrothers-verify/verify.html?code=";

  for(let i = 1; i <= count; i++){
    let code = getCodeForIndex(prefix, i);
    let fullUrl = baseUrl + code;
    let qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(fullUrl)}`;

    let card = document.createElement("div");
    card.className = "sticker";
    card.innerHTML = `
      <div class="sticker-header">
        <span class="store-name">5 BROTHER'S FITNESS</span>
        <span class="verified-tag">100% GENUINE</span>
      </div>
      <div class="sticker-body">
        <div class="qr-box">
          <img src="${qrUrl}" alt="QR">
        </div>
        <div class="code-details">
          <div class="prod-title">${title}</div>
          <div class="scratch-area">
            <div class="scratch-label">SCRATCH / SECURITY CODE</div>
            <div class="actual-code">${code}</div>
          </div>
        </div>
      </div>
      <div class="sticker-footer">SCAN QR TO VERIFY AUTHENTICITY</div>
    `;
    container.appendChild(card);
  }
}

// Initial Load
window.onload = generateStickerGrid;
</script>

</body>
</html>
