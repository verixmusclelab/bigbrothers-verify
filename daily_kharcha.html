<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Daily Kharcha — Pocket & Expense</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#080808;color:#fff;padding:12px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.card{background:#121005;border:2px solid #ffcc00;border-radius:18px;max-width:480px;width:100%;padding:14px;box-shadow:0 0 28px rgba(255,204,0,.18);margin-bottom:16px}
.header{text-align:center;border-bottom:2px dashed #ffcc00;padding-bottom:10px;margin-bottom:12px}
.header h1{color:#ffcc00;font-size:20px;font-weight:900}
.tag{color:#e6c300;font-size:10px;font-weight:700;margin-top:4px;background:rgba(255,204,0,.12);display:inline-block;padding:2px 10px;border-radius:10px}
.balance-box{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.bal{background:#181818;border-radius:10px;padding:10px 6px;text-align:center;border:1px solid #333}
.bal b{display:block;font-size:16px;font-weight:900}
.bal span{font-size:10px;color:#888}
.bal.in b{color:#00ff99}.bal.out b{color:#ff6666}.bal.pocket b{color:#ffcc00}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.tab{background:#181818;border:1.5px solid #444;color:#bbb;padding:10px 4px;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer;text-align:center}
.tab.active{background:#ffcc00;color:#000;border-color:#ffcc00}
.field{margin-bottom:10px}
label{display:block;font-size:11px;color:#ddd;margin-bottom:3px;font-weight:600}
label span{color:#ff3333}
input,select,textarea{width:100%;background:#181818;border:1.5px solid #444;color:#fff;padding:10px;border-radius:8px;font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#ffcc00}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:none;border-radius:8px;padding:12px;font-weight:800;font-size:14px;cursor:pointer;width:100%}
.btn-gold{background:#ffcc00;color:#000}.btn-green{background:#25D366;color:#000}.btn-red{background:#ff4444;color:#fff}.btn-dark{background:#333;color:#fff}
.btn-sm{width:auto;padding:7px 12px;font-size:11px;border-radius:6px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.quick button{padding:14px;font-size:14px;font-weight:900;border-radius:12px;border:none;cursor:pointer}
.q-in{background:linear-gradient(135deg,#0a3,#064);color:#fff}
.q-out{background:linear-gradient(135deg,#a30,#620);color:#fff}
.hide{display:none!important}
.box{background:#141414;border:1.5px solid #333;border-radius:10px;padding:12px;margin-bottom:11px}
.box h3{font-size:13px;color:#ffcc00;margin-bottom:8px;border-left:3px solid #ffcc00;padding-left:8px}
.list-item{background:#0e0e0e;border:1px solid #333;border-left:4px solid #ffcc00;border-radius:10px;padding:10px;margin-bottom:8px;font-size:12px}
.list-item.out{border-left-color:#ff4444}
.list-item.in{border-left-color:#00ff99}
.list-item .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.list-item .amt{font-weight:900;font-size:15px}
.list-item .meta{color:#888;font-size:11px;margin-top:4px}
.list-item .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.muted{color:#888;font-size:11px}
.gold{color:#ffcc00}.green{color:#00ff99}.red{color:#ff6666}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:#222;border:1px solid #555;color:#ffcc00;border-radius:16px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer}
.chip.on{background:#ffcc00;color:#000;border-color:#ffcc00}
/* Receipt modal */
#receiptModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:9999;justify-content:center;align-items:flex-start;padding:12px;overflow-y:auto}
.rw{max-width:400px;width:100%;margin:10px auto}
.receipt-card{background:#fff;color:#000;border-radius:12px;padding:16px;position:relative;overflow:hidden}
.wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-28deg);font-size:22px;font-weight:900;color:rgba(0,0,0,.06);white-space:nowrap;pointer-events:none}
.rh{text-align:center;border-bottom:2px dashed #000;padding-bottom:8px;margin-bottom:8px;position:relative;z-index:2}
.rr{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:4px;border-bottom:1px dotted #ccc;padding-bottom:3px;position:relative;z-index:2}
.rr b{text-align:right}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.sg{background:#f5f5f5;border-radius:8px;padding:8px;text-align:center;font-size:11px}
.sg b{display:block;font-size:14px;margin-top:2px}
.empty{text-align:center;padding:24px;color:#666;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>💰 Daily Kharcha</h1>
    <div class="tag">Pocket · Family · Ghar · Personal Expense</div>
  </div>

  <div class="balance-box">
    <div class="bal pocket"><b id="bPocket">₹0</b><span>Pocket abhi</span></div>
    <div class="bal in"><b id="bIn">₹0</b><span>Aaj mila</span></div>
    <div class="bal out"><b id="bOut">₹0</b><span>Aaj diya</span></div>
  </div>

  <div class="quick">
    <button type="button" class="q-in" onclick="openForm('in')">➕ Paise Mile</button>
    <button type="button" class="q-out" onclick="openForm('out')">➖ Paise Diye / Kharcha</button>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabAdd" onclick="showTab('add')">➕ Add</div>
    <div class="tab" id="tabList" onclick="showTab('list')">📒 List</div>
    <div class="tab" id="tabReport" onclick="showTab('report')">📊 Report</div>
  </div>

  <!-- ADD -->
  <div id="secAdd">
    <div class="box" id="formBox">
      <h3 id="formTitle">➖ Kharcha / Paise Diye</h3>
      <input type="hidden" id="fType" value="out">

      <div class="field">
        <label>Category <span>*</span></label>
        <select id="fCat" onchange="onCat()">
          <option value="family">👨‍👩‍👧 Family Member</option>
          <option value="ghar">🏠 Ghar ka Saman</option>
          <option value="other">📦 Other / Kahi aur</option>
          <option value="income">💵 Income / Mile (jab type = Mila)</option>
        </select>
      </div>

      <div class="row">
        <div class="field">
          <label>Amount (₹) <span>*</span></label>
          <input id="fAmt" type="number" min="1" inputmode="numeric" placeholder="0">
        </div>
        <div class="field">
          <label>Cash / Online <span>*</span></label>
          <select id="fMode">
            <option value="Cash">💵 Cash</option>
            <option value="Online">📱 Online / UPI</option>
          </select>
        </div>
      </div>

      <div class="field" id="wrapName">
        <label id="lblName">Naam (kis ko / kis se) <span>*</span></label>
        <input id="fName" placeholder="Naam" autocomplete="off">
        <div class="chips" id="nameChips"></div>
      </div>

      <div class="field" id="wrapReason">
        <label id="lblReason">Reason / Kis cheez ke liye <span>*</span></label>
        <input id="fReason" placeholder="jaise: ration, school, petrol, training…">
        <div class="chips" id="reasonChips"></div>
      </div>

      <div class="row">
        <div class="field">
          <label>Date</label>
          <input id="fDate" type="date">
        </div>
        <div class="field">
          <label>Time</label>
          <input id="fTime" type="time">
        </div>
      </div>

      <div class="field">
        <label>Note (optional)</label>
        <textarea id="fNote" rows="2" placeholder="Extra detail…"></textarea>
      </div>

      <button type="button" class="btn btn-green" onclick="saveEntry()">✅ Save + Receipt</button>
      <button type="button" class="btn btn-dark" style="margin-top:8px" onclick="resetForm()">Clear</button>
    </div>
  </div>

  <!-- LIST -->
  <div id="secList" class="hide">
    <div class="row" style="margin-bottom:10px">
      <div class="field" style="margin:0">
        <label>Filter date</label>
        <input id="listDate" type="date" onchange="renderList()">
      </div>
      <div class="field" style="margin:0">
        <label>Type</label>
        <select id="listFilter" onchange="renderList()">
          <option value="all">Sab</option>
          <option value="out">Sirf Diya / Kharcha</option>
          <option value="in">Sirf Mila</option>
        </select>
      </div>
    </div>
    <input id="listSearch" placeholder="🔍 Naam / reason / amount" oninput="renderList()" style="margin-bottom:10px">
    <div id="listBox"></div>
  </div>

  <!-- REPORT -->
  <div id="secReport" class="hide">
    <div class="box">
      <h3>📊 Date range report</h3>
      <div class="row">
        <div class="field"><label>From</label><input id="rFrom" type="date"></div>
        <div class="field"><label>To</label><input id="rTo" type="date"></div>
      </div>
      <button type="button" class="btn btn-gold" onclick="renderReport()">Report dikhao</button>
    </div>
    <div id="reportBox"></div>
  </div>
</div>

<!-- RECEIPT -->
<div id="receiptModal">
  <div class="rw">
    <button class="btn btn-dark btn-sm" style="margin-bottom:8px;color:#ffcc00" onclick="closeReceipt()">⬅️ Wapas</button>
    <div id="printable"></div>
    <div style="margin-top:12px;display:grid;gap:8px">
      <button type="button" class="btn btn-gold" onclick="downloadImg()">📥 Photo Download</button>
      <button type="button" class="btn btn-green" onclick="downloadPdf()">📄 PDF Download</button>
      <button type="button" class="btn btn-dark" onclick="closeReceipt()">Band karo</button>
    </div>
  </div>
</div>

<script>
const LS = "DAILY_KHARCHA_V1";
const NAME_LS = "DAILY_KHARCHA_NAMES";
const REASON_LS = "DAILY_KHARCHA_REASONS";
let ENTRIES = [];
let CUR = null;

const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const pad = n => String(n).padStart(2,"0");
const todayISO = () => {
  const d = new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
};
const nowTime = () => {
  const d = new Date();
  return pad(d.getHours())+":"+pad(d.getMinutes());
};
const showD = iso => {
  if(!iso) return "—";
  const p = String(iso).split("-");
  return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : iso;
};
const showDT = (d,t) => showD(d) + (t ? " · "+t : "");
const rs = n => "₹" + Number(n||0).toLocaleString("en-IN");
const esc = s => String(s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function load(){
  try{ ENTRIES = JSON.parse(localStorage.getItem(LS)||"[]"); if(!Array.isArray(ENTRIES)) ENTRIES=[]; }
  catch(e){ ENTRIES=[]; }
}
function save(){ localStorage.setItem(LS, JSON.stringify(ENTRIES)); }
function loadChips(key){
  try{ return JSON.parse(localStorage.getItem(key)||"[]"); }catch(e){ return []; }
}
function rememberChip(key, val){
  if(!val || val.length<2) return;
  let a = loadChips(key).filter(x => x.toLowerCase() !== val.toLowerCase());
  a.unshift(val);
  localStorage.setItem(key, JSON.stringify(a.slice(0,12)));
}
function renderNameChips(){
  const box = $("nameChips");
  const names = loadChips(NAME_LS);
  box.innerHTML = names.map(n => `<span class="chip" onclick="$('fName').value='${esc(n).replace(/'/g,"")}'">${esc(n)}</span>`).join("");
}
function renderReasonChips(){
  const box = $("reasonChips");
  const list = loadChips(REASON_LS);
  const defaults = ["Ration","Petrol","School","Medicine","Electricity","Milk","Vegetables","Training","Mobile Recharge"];
  const all = [...new Set([...list, ...defaults])].slice(0,14);
  box.innerHTML = all.map(n => `<span class="chip" onclick="$('fReason').value='${esc(n).replace(/'/g,"")}'">${esc(n)}</span>`).join("");
}

function pocketBalance(){
  let bal = 0;
  ENTRIES.forEach(e => {
    if(e.mode !== "Cash") return;
    if(e.type === "in") bal += e.amount;
    else bal -= e.amount;
  });
  return bal;
}
function todayStats(){
  const t = todayISO();
  let inn=0, out=0;
  ENTRIES.forEach(e => {
    if(e.date !== t) return;
    if(e.type === "in") inn += e.amount;
    else out += e.amount;
  });
  return {inn, out};
}
function refreshBalance(){
  const p = pocketBalance();
  const s = todayStats();
  $("bPocket").textContent = rs(p);
  $("bIn").textContent = rs(s.inn);
  $("bOut").textContent = rs(s.out);
}

function showTab(t){
  $("secAdd").classList.toggle("hide", t!=="add");
  $("secList").classList.toggle("hide", t!=="list");
  $("secReport").classList.toggle("hide", t!=="report");
  $("tabAdd").classList.toggle("active", t==="add");
  $("tabList").classList.toggle("active", t==="list");
  $("tabReport").classList.toggle("active", t==="report");
  if(t==="list") renderList();
  if(t==="report") {
    if(!$("rFrom").value) $("rFrom").value = todayISO().slice(0,8)+"01";
    if(!$("rTo").value) $("rTo").value = todayISO();
  }
}

function openForm(type){
  showTab("add");
  $("fType").value = type;
  $("formTitle").textContent = type==="in" ? "➕ Paise Mile (Income)" : "➖ Kharcha / Paise Diye";
  if(type==="in"){
    $("fCat").value = "income";
    $("lblName").innerHTML = "Kis se mile <span>*</span>";
    $("lblReason").innerHTML = "Reason (optional)";
  } else {
    $("fCat").value = "family";
    $("lblName").innerHTML = "Kis ko diya <span>*</span>";
    $("lblReason").innerHTML = "Kis cheez ke liye <span>*</span>";
  }
  onCat();
  $("fDate").value = todayISO();
  $("fTime").value = nowTime();
  $("fAmt").focus();
}

function onCat(){
  const c = $("fCat").value;
  if(c==="ghar"){
    $("lblName").innerHTML = "Shop / Jagah (optional)";
    $("lblReason").innerHTML = "Kaun sa saman <span>*</span>";
  } else if(c==="other"){
    $("lblName").innerHTML = "Naam / Jagah (optional)";
    $("lblReason").innerHTML = "Kis liye <span>*</span>";
  } else if(c==="income"){
    $("lblName").innerHTML = "Kis se mile <span>*</span>";
    $("lblReason").innerHTML = "Reason (optional)";
  } else {
    $("lblName").innerHTML = "Family member naam <span>*</span>";
    $("lblReason").innerHTML = "Kis cheez ke liye <span>*</span>";
  }
}

function resetForm(){
  $("fAmt").value = "";
  $("fName").value = "";
  $("fReason").value = "";
  $("fNote").value = "";
  $("fMode").value = "Cash";
  $("fDate").value = todayISO();
  $("fTime").value = nowTime();
}

function saveEntry(){
  const type = $("fType").value;
  const amount = num($("fAmt").value);
  if(amount <= 0){ alert("Sahi amount dalo"); $("fAmt").focus(); return; }
  const cat = $("fCat").value;
  const name = $("fName").value.trim();
  const reason = $("fReason").value.trim();
  if(type==="out" && (cat==="family" || cat==="ghar" || cat==="other") && !reason){
    alert("Reason / saman likho"); $("fReason").focus(); return;
  }
  if((type==="in" || cat==="family") && !name){
    alert("Naam likho"); $("fName").focus(); return;
  }
  const entry = {
    id: "KX-" + Date.now().toString(36).toUpperCase(),
    type,
    cat,
    amount,
    mode: $("fMode").value,
    name: name || "—",
    reason: reason || "—",
    note: $("fNote").value.trim(),
    date: $("fDate").value || todayISO(),
    time: $("fTime").value || nowTime(),
    createdAt: Date.now()
  };
  ENTRIES.unshift(entry);
  save();
  if(name && name !== "—") rememberChip(NAME_LS, name);
  if(reason && reason !== "—") rememberChip(REASON_LS, reason);
  renderNameChips();
  renderReasonChips();
  refreshBalance();
  resetForm();
  openReceipt(entry);
}

function catLabel(c){
  return {family:"Family", ghar:"Ghar Saman", other:"Other", income:"Income"}[c] || c;
}

function renderList(){
  const d = $("listDate").value;
  const f = $("listFilter").value;
  const q = ($("listSearch").value||"").toLowerCase().trim();
  let list = ENTRIES.filter(e => {
    if(d && e.date !== d) return false;
    if(f==="in" && e.type!=="in") return false;
    if(f==="out" && e.type!=="out") return false;
    if(q && !(e.name+" "+e.reason+" "+e.amount+" "+e.note).toLowerCase().includes(q)) return false;
    return true;
  });
  if(!list.length){
    $("listBox").innerHTML = '<div class="empty">Koi entry nahi</div>';
    return;
  }
  $("listBox").innerHTML = list.map(e => `
    <div class="list-item ${e.type}">
      <div class="top">
        <div>
          <b>${esc(e.name)}</b>
          <div class="meta">${esc(catLabel(e.cat))} · ${esc(e.reason)}</div>
        </div>
        <div class="amt ${e.type==="in"?"green":"red"}">${e.type==="in"?"+":"−"}${rs(e.amount)}</div>
      </div>
      <div class="meta">${showDT(e.date,e.time)} · ${esc(e.mode)}${e.note?" · "+esc(e.note):""}</div>
      <div class="acts">
        <button class="btn btn-dark btn-sm" onclick="openReceipt(ENTRIES.find(x=>x.id==='${e.id}'))">🧾 Receipt</button>
        <button class="btn btn-red btn-sm" onclick="delEntry('${e.id}')">🗑️</button>
      </div>
    </div>
  `).join("");
}

function delEntry(id){
  if(!confirm("Delete this entry?")) return;
  ENTRIES = ENTRIES.filter(e => e.id !== id);
  save();
  refreshBalance();
  renderList();
}

function renderReport(){
  const from = $("rFrom").value;
  const to = $("rTo").value;
  if(!from || !to){ alert("From aur To date select karo"); return; }
  const list = ENTRIES.filter(e => e.date >= from && e.date <= to);
  let cashIn=0, cashOut=0, onlineIn=0, onlineOut=0, totalIn=0, totalOut=0;
  const byPerson = {};
  list.forEach(e => {
    if(e.type==="in"){
      totalIn += e.amount;
      if(e.mode==="Cash") cashIn += e.amount; else onlineIn += e.amount;
    } else {
      totalOut += e.amount;
      if(e.mode==="Cash") cashOut += e.amount; else onlineOut += e.amount;
    }
    const k = e.name || "—";
    if(!byPerson[k]) byPerson[k] = {in:0, out:0};
    if(e.type==="in") byPerson[k].in += e.amount;
    else byPerson[k].out += e.amount;
  });
  const personRows = Object.entries(byPerson).sort((a,b)=>(b[1].in+b[1].out)-(a[1].in+a[1].out))
    .map(([n,v]) => `<div class="rr"><span>${esc(n)}</span><b><span class="green">+${rs(v.in)}</span> / <span class="red">−${rs(v.out)}</span></b></div>`).join("")
    || '<p class="muted">Koi data nahi</p>';

  $("reportBox").innerHTML = `
    <div class="box">
      <h3>${showD(from)} → ${showD(to)}</h3>
      <div class="summary-grid" style="grid-template-columns:1fr 1fr;gap:8px">
        <div class="sg" style="background:#0a2218"><span class="muted">Total Mila</span><b class="green">${rs(totalIn)}</b></div>
        <div class="sg" style="background:#220a0a"><span class="muted">Total Diya</span><b class="red">${rs(totalOut)}</b></div>
        <div class="sg"><span class="muted">Cash Mila</span><b class="green">${rs(cashIn)}</b></div>
        <div class="sg"><span class="muted">Cash Diya</span><b class="red">${rs(cashOut)}</b></div>
        <div class="sg"><span class="muted">Online Mila</span><b class="green">${rs(onlineIn)}</b></div>
        <div class="sg"><span class="muted">Online Diya</span><b class="red">${rs(onlineOut)}</b></div>
      </div>
      <p class="muted" style="margin:8px 0">Net (is period): <b class="${totalIn-totalOut>=0?"green":"red"}">${rs(totalIn-totalOut)}</b> · Entries: ${list.length}</p>
      <h3 style="margin-top:10px">Naam-wise</h3>
      ${personRows}
      <button type="button" class="btn btn-gold" style="margin-top:12px" onclick="printReportSummary()">🧾 Period Receipt</button>
    </div>
    <div class="box">
      <h3>Saari entries</h3>
      ${list.length ? list.map(e => `
        <div class="list-item ${e.type}" style="margin-bottom:6px">
          <div class="top">
            <div><b>${esc(e.name)}</b><div class="meta">${esc(e.reason)} · ${showDT(e.date,e.time)}</div></div>
            <div class="amt ${e.type==="in"?"green":"red"}">${e.type==="in"?"+":"−"}${rs(e.amount)}</div>
          </div>
          <div class="meta">${esc(e.mode)} · ${esc(catLabel(e.cat))}</div>
        </div>
      `).join("") : '<p class="empty">Is range mein kuch nahi</p>'}
    </div>
  `;
  window.__reportRange = {from, to, list, totalIn, totalOut, cashIn, cashOut, onlineIn, onlineOut};
}

function printReportSummary(){
  const r = window.__reportRange;
  if(!r) return;
  const html = `<div class="receipt-card">
    <div class="wm">Daily Kharcha</div>
    <div class="rh">
      <div style="background:#ffcc00;font-size:10px;font-weight:800;padding:2px 10px;border-radius:10px;display:inline-block">PERIOD SUMMARY</div>
      <h2 style="font-size:16px;margin-top:6px;font-weight:900">Daily Kharcha Report</h2>
      <p style="font-size:11px;color:#555">${showD(r.from)} se ${showD(r.to)}</p>
    </div>
    <div class="rr"><span>Total Mila</span><b style="color:green">${rs(r.totalIn)}</b></div>
    <div class="rr"><span>Total Diya</span><b style="color:#c00">${rs(r.totalOut)}</b></div>
    <div class="rr"><span>Cash Mila / Diya</span><b>${rs(r.cashIn)} / ${rs(r.cashOut)}</b></div>
    <div class="rr"><span>Online Mila / Diya</span><b>${rs(r.onlineIn)} / ${rs(r.onlineOut)}</b></div>
    <div class="rr"><span>Net</span><b>${rs(r.totalIn - r.totalOut)}</b></div>
    <div class="rr"><span>Entries</span><b>${r.list.length}</b></div>
    <p style="font-size:10px;color:#777;margin-top:10px;text-align:center">Generated · Daily Kharcha App</p>
  </div>`;
  $("printable").innerHTML = html;
  $("receiptModal").style.display = "flex";
  CUR = null;
}

    <div class="rh">
      <div style="background:${isIn?"#0a7":"#c00"};color:#fff;font-size:10px;font-weight:800;padding:2px 10px;border-radius:10px;display:inline-block">${isIn?"MONEY IN":"EXPENSE / OUT"}</div>
      <h2 style="font-size:16px;margin-top:6px;font-weight:900">Daily Kharcha Slip</h2>

    </div>
    <div class="rr"><span>Type</span><b>${isIn?"Paise Mile":"Paise Diye / Kharcha"}</b></div>

async function downloadImg(){
  const el = $("printable");
  const canvas = await html2canvas(el, {scale:2, backgroundColor:"#ffffff"});
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = (CUR ? CUR.id : "Report") + ".png";
  a.click();
}
async function downloadPdf(){
  const el = $("printable");
  const canvas = await html2canvas(el, {scale:2, backgroundColor:"#ffffff"});
  const { jsPDF } = window.jspdf;
  const w = 100, h = canvas.height * w / canvas.width;
  const pdf = new jsPDF({unit:"mm", format:[w+10, h+10]});
  pdf.addImage(canvas.toDataURL("image/png"), "PNG", 5, 5, w, h);
  pdf.save((CUR ? CUR.id : "Report") + ".pdf");
}
