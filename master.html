<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5BFC Master Control & Live Database Dashboard</title>
</head>
<body style="background:#050505; color:#fff; font-family:sans-serif; margin:0; padding:12px;">

<!-- TOP NAVIGATION BAR -->
<div style="max-width:800px; margin:10px auto; display:flex; justify-content:space-between; align-items:center; background:#111; border:1px solid #ffcc00; padding:10px 14px; border-radius:8px;">
  <a href="app.html" style="background:#ffcc00; color:#000; text-decoration:none; font-weight:bold; font-size:12px; padding:6px 12px; border-radius:6px; display:inline-flex; align-items:center; gap:5px;">
    ⬅️ मुख्य मेन्यू (Home)
  </a>
  <span style="color:#ffcc00; font-size:12px; font-weight:bold;">5 BROTHER'S FITNESS - MASTER HUB</span>
</div>

<!-- DASHBOARD CONTAINER -->
<div style="max-width:800px; margin:0 auto; background:#0e0e0e; border:1.5px solid #ffcc00; border-radius:14px; padding:16px; box-sizing:border-box; box-shadow:0 0 25px rgba(255,204,0,0.15);">

  <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
    <div>
      <h2 style="color:#ffcc00; margin:0; font-size:16px;">📊 लाइव डेटाबेस हब (Google Sheet Style)</h2>
      <p style="color:#aaa; font-size:11px; margin:2px 0 0;">उमराव खेड़ा, अकरमपुर, उन्नाव</p>
    </div>
    <div style="display:flex; gap:6px;">
      <button onclick="exportMasterToCSV()" style="background:#00ff66; color:#000; font-size:11px; font-weight:bold; padding:6px 10px; border:none; border-radius:6px; cursor:pointer;">📥 Excel Export</button>
      <button onclick="addNewMemberPrompt()" style="background:#ffcc00; color:#000; font-size:11px; font-weight:bold; padding:6px 10px; border:none; border-radius:6px; cursor:pointer;">➕ नया मेम्बर जोड़ें</button>
    </div>
  </div>

  <!-- SEARCH & FILTER BAR -->
  <div style="display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;">
    <input 
      type="text" 
      id="masterSearchInput" 
      placeholder="नाम या मोबाइल नंबर से खोजें..." 
      oninput="currentMasterPage=1; renderMasterTable()"
      style="flex:1; min-width:180px; background:#181818; border:1px solid #444; color:#fff; padding:9px; border-radius:8px; font-size:12px; outline:none;"
    >
    <select 
      id="masterFilterStatus" 
      onchange="currentMasterPage=1; renderMasterTable()" 
      style="background:#181818; border:1px solid #444; color:#fff; padding:9px; border-radius:8px; font-size:12px;"
    >
      <option value="ALL">सभी स्टेटस</option>
      <option value="Paid">फुली पेड (Paid)</option>
      <option value="Pending">पेंडिंग फीस (Pending)</option>
    </select>
    <select 
      id="masterSortOrder" 
      onchange="currentMasterPage=1; renderMasterTable()" 
      style="background:#181818; border:1px solid #444; color:#fff; padding:9px; border-radius:8px; font-size:12px;"
    >
      <option value="latest">⭐ हाल ही में जुड़े (Latest First)</option>
      <option value="oldest"> पुराना रिकॉर्ड (Oldest First)</option>
    </select>
  </div>

  <!-- DATE RANGE FILTER BAR -->
  <div style="display:flex; gap:8px; margin-bottom:14px; align-items:center; background:#141414; padding:8px; border-radius:8px; border:1px solid #333; flex-wrap:wrap;">
    <span style="font-size:11px; color:#ffcc00; font-weight:bold;">📅 दिनांक फिल्टर (Date Wise):</span>
    <input type="date" id="filterStartDate" style="background:#181818; border:1px solid #444; color:#fff; padding:5px; border-radius:6px; font-size:11px;">
    <span style="font-size:11px; color:#aaa;">से</span>
    <input type="date" id="filterEndDate" style="background:#181818; border:1px solid #444; color:#fff; padding:5px; border-radius:6px; font-size:11px;">
    <button onclick="applyDateFilter()" style="background:#ffcc00; color:#000; border:1px solid #ffcc00; padding:5px 10px; border-radius:6px; font-size:11px; font-weight:bold; cursor:pointer;">सबमिट</button>
    <button onclick="resetDateFilter()" style="background:#333; color:#ffcc00; border:1px solid #555; padding:5px 8px; border-radius:6px; font-size:10px; cursor:pointer;">रीसेट</button>
  </div>

  <!-- LIVE DATABASE TABLE -->
  <div style="overflow-x:auto;">
    <table style="width:100%; border-collapse:collapse; font-size:11px; text-align:left;">
      <thead>
        <tr style="background:#222; color:#ffcc00; border-bottom:2px solid #ffcc00;">
          <th style="padding:8px;">ID / नाम</th>
          <th style="padding:8px;">मोबाइल</th>
          <th style="padding:8px;">प्लान / फीस</th>
          <th style="padding:8px;">प्रवेश तिथि</th>
          <th style="padding:8px;">स्टेटस</th>
          <th style="padding:8px; text-align:center;">एक्शन (Controls)</th>
        </tr>
      </thead>
      <tbody id="masterTableBody">
        <!-- Dynamically Populated -->
      </tbody>
    </table>
  </div>

  <!-- PAGINATION CONTROLS -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:10px; border-top:1px solid #333; font-size:11px;">
    <span id="paginationInfo" style="color:#aaa;">कुल रिकॉर्ड्स: 0</span>
    <div style="display:flex; gap:6px; align-items:center;">
      <button onclick="changePage(-1)" id="prevBtn" style="background:#222; color:#fff; border:1px solid #444; padding:5px 10px; border-radius:6px; cursor:pointer;">⬅ पिछला</button>
      <span id="pageIndicator" style="color:#ffcc00; font-weight:bold; padding:0 4px;">1 / 1</span>
      <button onclick="changePage(1)" id="nextBtn" style="background:#222; color:#fff; border:1px solid #444; padding:5px 10px; border-radius:6px; cursor:pointer;">अगला ➡</button>
    </div>
  </div>

</div>

<script>
let currentMasterPage = 1;
const recordsPerPage = 10;

window.addEventListener("DOMContentLoaded", () => {
  renderMasterTable();
});

function getMasterRecords() {
  // Different versions of the gym pages may save to either key.
  try {
    const primary = localStorage.getItem("5BFC_MEMBERS");
    const legacy = localStorage.getItem("bbf_master_records_v4");
    const parsedPrimary = primary ? JSON.parse(primary) : null;
    const parsedLegacy = legacy ? JSON.parse(legacy) : null;
    if (Array.isArray(parsedPrimary) && parsedPrimary.length) return parsedPrimary;
    if (Array.isArray(parsedLegacy)) return parsedLegacy;
    if (Array.isArray(parsedPrimary)) return parsedPrimary;
    return [];
  } catch (error) {
    console.error("Master records read error:", error);
    alert("डेटाबेस पढ़ने में समस्या हुई। पेज को दोबारा खोलें।");
    return [];
  }
}

function saveMasterRecords(records) {
  localStorage.setItem("5BFC_MEMBERS", JSON.stringify(records));
  localStorage.setItem("bbf_master_records_v4", JSON.stringify(records));
}

function applyDateFilter() {
  const startDate = document.getElementById("filterStartDate").value;
  const endDate = document.getElementById("filterEndDate").value;
  if (startDate && endDate && startDate > endDate) {
    alert("शुरुआत की तारीख, अंतिम तारीख से आगे नहीं हो सकती।");
    return;
  }
  currentMasterPage = 1;
  renderMasterTable();
  alert("✅ तारीख के अनुसार रिकॉर्ड सफलतापूर्वक फ़िल्टर हो गए।");
}

function resetDateFilter() {
  document.getElementById("filterStartDate").value = "";
  document.getElementById("filterEndDate").value = "";
  currentMasterPage = 1;
  renderMasterTable();
  alert("✅ तारीख फ़िल्टर रीसेट हो गया।");
}

function renderMasterTable() {
  const tbody = document.getElementById("masterTableBody");
  const query = document.getElementById("masterSearchInput").value.trim().toLowerCase();
  const filter = document.getElementById("masterFilterStatus").value;
  const sortOrder = document.getElementById("masterSortOrder").value;
  const startDate = document.getElementById("filterStartDate").value;
  const endDate = document.getElementById("filterEndDate").value;

  let records = getMasterRecords();

  // 1. Search filter
  if (query) {
    records = records.filter(m => (m.name && m.name.toLowerCase().includes(query)) || (m.phone && m.phone.includes(query)));
  }

  // 2. Status filter
  if (filter !== "ALL") {
    records = records.filter(m => {
      const isPaid = (m.status === 'Full Paid' || m.fees === 'Paid');
      return filter === "Paid" ? isPaid : !isPaid;
    });
  }

  // 3. Date Range filter
  if (startDate) {
    records = records.filter(m => m.joinDate && m.joinDate >= startDate);
  }
  if (endDate) {
    records = records.filter(m => m.joinDate && m.joinDate <= endDate);
  }

  // 4. Sorting (Latest First / Recently Joined vs Oldest)
  records.sort((a, b) => {
    let dateA = new Date(a.joinDate || a.id || 0);
    let dateB = new Date(b.joinDate || b.id || 0);
    if (sortOrder === "latest") {
      return dateB - dateA; // Newest first
    } else {
      return dateA - dateB; // Oldest first
    }
  });

  const totalRecords = records.length;
  const totalPages = Math.ceil(totalRecords / recordsPerPage) || 1;
  if (currentMasterPage > totalPages) currentMasterPage = totalPages;
  if (currentMasterPage < 1) currentMasterPage = 1;

  // Slice records for pagination (10 per page)
  const startIndex = (currentMasterPage - 1) * recordsPerPage;
  const paginatedRecords = records.slice(startIndex, startIndex + recordsPerPage);

  // Update pagination info text
  document.getElementById("paginationInfo").innerText = `कुल रिकॉर्ड्स: ${totalRecords} (पेज ${currentMasterPage}/${totalPages})`;
  document.getElementById("pageIndicator").innerText = `${currentMasterPage} / ${totalPages}`;
  document.getElementById("prevBtn").disabled = currentMasterPage === 1;
  document.getElementById("prevBtn").style.opacity = currentMasterPage === 1 ? "0.4" : "1";
  document.getElementById("nextBtn").disabled = currentMasterPage === totalPages;
  document.getElementById("nextBtn").style.opacity = currentMasterPage === totalPages ? "0.4" : "1";

  if (paginatedRecords.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:20px; color:#666;">कोई रिकॉर्ड नहीं मिला</td></tr>`;
    return;
  }

  tbody.innerHTML = paginatedRecords.map(m => {
    const isPaid = (m.status === 'Full Paid' || m.fees === 'Paid');
    return `
      <tr style="border-bottom:1px solid #222; background:#111;">
        <td style="padding:8px;">
          <b style="color:#ffcc00;">${m.name}</b><br>
          <span style="font-size:9.5px; color:#aaa;">${m.code || ('5BFC-' + m.id)}</span>
        </td>
        <td style="padding:8px; color:#ccc;">${m.phone}</td>
        <td style="padding:8px;">
          ${m.plan || 'General'}<br>
          <span style="color:#00ff66; font-weight:bold;">₹${m.totalFee || 500}</span>
        </td>
        <td style="padding:8px; color:#aaa;">${m.joinDate || 'N/A'}</td>
        <td style="padding:8px;">
          <span style="background:${isPaid ? '#003311' : '#331100'}; color:${isPaid ? '#00ff66' : '#ff9900'}; padding:3px 6px; border-radius:4px; font-weight:bold; font-size:10px;">
            ${isPaid ? 'Paid' : 'Pending'}
          </span>
        </td>
        <td style="padding:8px; text-align:center;">
          <div style="display:flex; gap:4px; justify-content:center; flex-wrap:wrap;">
            ${!isPaid ? `<button onclick="masterApprove(${m.id})" style="background:#ffcc00; color:#000; border:none; padding:4px 6px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:9.5px;">✅ अप्रूव</button>` : ''}
            <button onclick="masterEdit(${m.id})" style="background:#333; color:#fff; border:1px solid #555; padding:4px 6px; border-radius:4px; cursor:pointer; font-size:9.5px;">✏️ एडिट</button>
            <button onclick="masterDelete(${m.id})" style="background:#ff3333; color:#fff; border:none; padding:4px 6px; border-radius:4px; cursor:pointer; font-size:9.5px;">🗑️ डिलीट</button>
          </div>
        </td>
      </tr>
    `;
  }).join("");
}

function changePage(direction) {
  currentMasterPage += direction;
  renderMasterTable();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function masterApprove(id) {
  let records = getMasterRecords();
  let idx = records.findIndex(r => String(r.id) === String(id));
  if (idx !== -1) {
    records[idx].status = "Full Paid";
    records[idx].fees = "Paid";
    records[idx].paidFee = records[idx].totalFee || 500;
    records[idx].dueFee = 0;
    saveMasterRecords(records);
    renderMasterTable();
    alert("✅ फीस सफलतापूर्वक अप्रूव हो गई है!");
  } else {
    alert("❌ रिकॉर्ड नहीं मिला। डेटाबेस दोबारा लोड करके देखें।");
  }
}

function masterDelete(id) {
  if (confirm("⚠️ क्या आप वाकई इस मेम्बर को हमेशा के लिए डिलीट करना चाहते हैं?")) {
    let records = getMasterRecords();
    const beforeCount = records.length;
    records = records.filter(r => String(r.id) !== String(id));
    if (records.length === beforeCount) {
      alert("❌ रिकॉर्ड नहीं मिला, इसलिए डिलीट नहीं हुआ।");
      return;
    }
    saveMasterRecords(records);
    renderMasterTable();
    alert("✅ रिकॉर्ड सफलतापूर्वक डिलीट हो गया है!");
  }
}

function masterEdit(id) {
  let records = getMasterRecords();
  let m = records.find(r => String(r.id) === String(id));
  if (!m) {
    alert("❌ रिकॉर्ड नहीं मिला। डेटाबेस दोबारा लोड करके देखें।");
    return;
  }

  const newName = prompt("नया नाम दर्ज करें:", m.name);
  if (newName === null) return;
  const newPhone = prompt("नया मोबाइल नंबर दर्ज करें:", m.phone);
  if (newPhone === null) return;
  const newFee = prompt("कुल फीस दर्ज करें:", m.totalFee || 500);
  if (newFee === null) return;

  if (!newName.trim()) { alert("नाम खाली नहीं हो सकता।"); return; }
  if (!/^\d{10}$/.test(newPhone.trim())) { alert("मोबाइल नंबर 10 अंकों का होना चाहिए।"); return; }
  const parsedFee = Number(newFee);
  if (!Number.isFinite(parsedFee) || parsedFee < 0) { alert("कृपया सही फीस दर्ज करें।"); return; }

  m.name = newName.trim();
  m.phone = newPhone.trim();
  m.totalFee = parsedFee;

  saveMasterRecords(records);
  renderMasterTable();
  alert("✅ रिकॉर्ड सफलतापूर्वक एडिट/अपडेट हो गया है!");
}

function addNewMemberPrompt() {
  const name = prompt("नये मेम्बर का पूरा नाम दर्ज करें:");
  if (!name) return;
  const phone = prompt("10 अंकों का मोबाइल नंबर दर्ज करें:");
  if (!phone || phone.length !== 10) { alert("अमान्य मोबाइल नंबर!"); return; }

  const newMember = {
    id: Date.now(),
    code: "5BFC-" + Date.now().toString().slice(-6),
    name: name.trim(),
    phone: phone.trim(),
    joinDate: new Date().toISOString().split("T")[0],
    plan: "सामान्य (₹500)",
    totalFee: 500,
    paidFee: 500,
    dueFee: 0,
    status: "Full Paid",
    fees: "Paid",
    activeInGym: true
  };

  let records = getMasterRecords();
  records.unshift(newMember);
  saveMasterRecords(records);
  currentMasterPage = 1; // Jump to first page to see newly added member
  renderMasterTable();
  alert("🎉 नया मेम्बर सफलतापूर्वक जोड़ दिया गया है!");
}

function exportMasterToCSV() {
  const records = getMasterRecords();
  let csv = "ID,Name,Phone,Plan,TotalFee,Status,JoinDate\n";
  records.forEach(r => {
    csv += `"${r.code || r.id}","${r.name}","${r.phone}","${r.plan || 'General'}","${r.totalFee || 500}","${r.status || 'Pending'}","${r.joinDate || ''}"\n`;
  });
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "5BFC_Master_Database.csv";
  a.click();
}
</script>
</body>
</html>
