<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Login & Invite Management</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-functions-compat.js"></script>
<style>body{margin:0;background:#070b16;color:#f8fafc;font:14px Arial;padding:16px}.wrap{max-width:560px;margin:auto}.card{background:#111b31;border:1px solid #34476b;border-radius:16px;padding:16px;margin:12px 0}h2{color:#f5b942}label{display:block;margin:10px 0 4px;color:#cbd5e1;font-size:12px}input,select{width:100%;padding:11px;border-radius:8px;border:1px solid #405174;background:#070d1c;color:white;box-sizing:border-box}button{border:0;border-radius:9px;padding:11px 14px;background:#f5b942;color:#111;font-weight:900;margin-top:12px;width:100%}.muted{color:#9aa9c3;font-size:12px;line-height:1.5}#out{white-space:pre-wrap;overflow-wrap:anywhere;color:#6ee7b7;font-size:12px;margin-top:12px}</style></head>
<body><div class="wrap"><p><a href="index.html" style="color:#22d3ee">← Dashboard</a></p><div class="card"><h2>Manager / Staff Secure Account</h2><p class="muted">Sirf Gym Owner naya Manager ya Staff login create kar sakta hai. Password server par hash hoga; browser mein save nahi hoga. Invite link mein Gym ID aur role fixed rahega.</p>
<label>Employee Code *</label><input id="code" maxlength="24" placeholder="e.g. MGR001 / STF001">
<label>Employee Name *</label><input id="name" placeholder="Full name">
<label>Role *</label><select id="role"><option value="manager">Manager</option><option value="staff">Staff</option></select>
<label>Branch ID *</label><input id="branch" placeholder="e.g. 001">
<label>Temporary Password (minimum 8 characters) *</label><input id="password" type="password" minlength="8" placeholder="Create temporary password">
<button id="createBtn" type="button">Create Secure Login & Generate Invite</button>
<hr style="border-color:#34476b;margin:18px 0">
<h2>Reset Team Password</h2><label>Employee Code *</label><input id="resetCode" placeholder="Existing employee code"><label>New Password *</label><input id="resetPassword" type="password" minlength="8" placeholder="New password"><button id="resetBtn" type="button">Reset Password</button><div id="out"></div></div></div>
<script>
const CFG={apiKey:'AIzaSyAHEMISEIDSzZz-m2OQT5EPyhTRF-mXqjQ',authDomain:'bfc-gym-215ae.firebaseapp.com',projectId:'bfc-gym-215ae',storageBucket:'bfc-gym-215ae.firebasestorage.app',messagingSenderId:'886920088571',appId:'1:886920088571:web:c4bc478d246a2700b0d95e'};
if(!firebase.apps.length)firebase.initializeApp(CFG);const auth=firebase.auth(),db=firebase.firestore(),fn=firebase.app().functions('asia-south1');
const out=document.getElementById('out'),createBtn=document.getElementById('createBtn'),resetBtn=document.getElementById('resetBtn');
auth.onAuthStateChanged(async u=>{if(!u){location.replace('login.html');return;}try{const s=await db.collection('owner_accounts').doc(u.uid).get();const c=await u.getIdTokenResult(true);if(!s.exists||c.claims.role&&c.claims.role!=='owner'){alert('Only verified Gym Owner can create team accounts.');location.replace('index.html');return;}const sub=await db.collection('subscriptions').doc(u.uid).get();const p=sub.exists?sub.data():{};const canUse=p.status==='active'&&Number(p.amount||0)>=499; if(!canUse){out.textContent='PREVIEW ONLY: Manager / Staff login management ke liye ₹499 ya usse upar ka active plan chahiye. Aap fields dekh sakte hain, lekin account create/reset nahi hoga.';createBtn.disabled=true;resetBtn.disabled=true;createBtn.style.opacity='.45';resetBtn.style.opacity='.45';}}catch(e){alert('Owner verification failed.');location.replace('login.html');}});
document.getElementById('createBtn').onclick=async()=>{const payload={employeeCode:code.value.trim(),name:name.value.trim(),role:role.value,branchId:branch.value.trim(),password:password.value};if(!payload.employeeCode||!payload.name||!payload.branchId||payload.password.length<8){out.textContent='Sabhi fields bharein. Password kam se kam 8 characters ka ho.';return;}try{const r=await fn.httpsCallable('createTeamAccount')(payload);out.textContent='Account created.\nEmployee Code: '+r.data.employeeCode+'\nRole: '+r.data.role+'\nInvite: '+r.data.invitePath+'\n\nIs link ko sirf isi employee ko bhejein.';password.value='';}catch(e){out.textContent='Create failed: '+(e.message||e);}};
document.getElementById('resetBtn').onclick=async()=>{if(!resetCode.value.trim()||resetPassword.value.length<8){out.textContent='Employee Code aur 8+ character password zaroori hai.';return;}try{await fn.httpsCallable('resetTeamPassword')({employeeCode:resetCode.value.trim(),password:resetPassword.value});out.textContent='Password securely reset ho gaya. Purana password kaam nahi karega.';resetPassword.value='';}catch(e){out.textContent='Reset failed: '+(e.message||e);}};
</script></body></html>
