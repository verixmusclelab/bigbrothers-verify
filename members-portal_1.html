<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>5BFC — Members Portal (Student / Job)</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#050505;color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:12px}
  .wrap{max-width:560px;margin:0 auto}
  .card{background:#111;border:1.5px solid #ffcc00;border-radius:12px;padding:14px;margin-bottom:12px}
  .gold{color:#ffcc00}
  .green{color:#00ff66}
  .red{color:#ff5555}
  .muted{color:#888;font-size:11px}
  input,select,textarea{width:100%;background:#181818;border:1px solid #444;color:#fff;padding:10px;border-radius:8px;font-size:13px;outline:none}
  input:focus,select:focus{border-color:#ffcc00}
  .btn{border:none;border-radius:8px;padding:10px 14px;font-weight:700;font-size:12px;cursor:pointer}
  .btn-gold{background:#ffcc00;color:#000}
  .btn-green{background:#00ff66;color:#000}
  .btn-dark{background:#333;color:#fff}
  .btn-red{background:#ff3333;color:#fff}
  .btn-wa{background:#25D366;color:#fff}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tab{flex:1;min-width:90px;text-align:center;padding:10px 6px;border-radius:8px;background:#1a1a1a;border:1px solid #333;color:#aaa;font-size:11px;font-weight:700;cursor:pointer}
  .tab.on{background:#ffcc00;color:#000;border-color:#ffcc00}
  .member{background:#0e0e0e;border:1px solid #333;border-radius:10px;padding:12px;margin-bottom:8px}
  .member.student{border-left:4px solid #00aaff}
  .member.job{border-left:4px solid #ff9900}
  .member.expire{border-left:4px solid #ff3333;background:#1a0a0a}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
  .badge-s{background:#003355;color:#4db8ff}
  .badge-j{background:#442200;color:#ffaa44}
  .badge-e{background:#440000;color:#ff8888}
  .badge-ok{background:#003322;color:#00ff66}
  .login-box{max-width:360px;margin:80px auto;text-align:center}
  .login-box input{text-align:center;font-size:22px;letter-spacing:8px;font-weight:700}
  .hide{display:none!important}
  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .edit-grid .full{grid-column:1/-1}
  label{font-size:10px;color:#aaa;display:block;margin-bottom:3px}
  h1{font-size:16px;color:#ffcc00;text-align:center;margin-bottom:4px}
  h2{font-size:13px;color:#ffcc00;margin-bottom:8px;border-left:3px solid #ffcc00;padding-left:8px}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:#181818;border-radius:8px;padding:10px;text-align:center}
  .stat b{display:block;font-size:20px;color:#ffcc00}
  .stat span{font-size:10px;color:#888}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .det{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:10px;padding-top:10px;border-top:1px dashed #333}
  .det div{font-size:11px;color:#ccc;line-height:1.35}
  .det div b{display:block;font-size:9px;color:#777;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .det .full{grid-column:1/-1}
  .datebox{display:flex;gap:6px;margin-top:10px}
  .datebox div{flex:1;background:#181818;border-radius:8px;padding:8px;text-align:center;font-size:12px;font-weight:700}
  .datebox div b{display:block;font-size:9px;color:#888;font-weight:600;margin-bottom:2px}
  a.home{background:#ffcc00;color:#000;text-decoration:none;font-weight:700;font-size:11px;padding:6px 12px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <noscript><div style="color:#ff0;padding:20px">JavaScript on karein</div></noscript>
  <div id="loginScreen" class="login-box card">
    <div style="font-size:28px;margin-bottom:8px">🔒</div>
    <h1>Members Portal</h1>
    <p class="muted" style="margin-bottom:16px">5 Brother's Fitness Club — Admin Only</p>
    <input type="password" id="pwInput" placeholder="••••" maxlength="8" inputmode="numeric"
      onkeydown="if(event.key==='Enter')tryLogin()">
    <button class="btn btn-gold" style="width:100%;margin-top:12px" onclick="tryLogin()">LOGIN</button>
    <p class="muted" style="margin-top:12px">Password required — random access blocked</p>
  </div>

  <!-- MAIN -->
  <div id="mainScreen" class="hide">
    <div class="topbar">
      <a class="home" href="app.html">⬅ Home</a>
      <span class="gold" style="font-size:11px;font-weight:700">5 BROTHER'S FITNESS</span>
      <button class="btn btn-dark" style="padding:6px 10px" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h1>👥 Members Desk</h1>
      <p class="muted" style="text-align:center;margin-bottom:10px">Student · Job · Expiring · Edit · WhatsApp Reminder</p>
      <div class="stats">
        <div class="stat"><b id="stTotal">0</b><span>Total</span></div>
        <div class="stat"><b id="stStudent" style="color:#4db8ff">0</b><span>Student</span></div>
        <div class="stat"><b id="stJob" style="color:#ffaa44">0</b><span>Job/Normal</span></div>
        <div class="stat"><b id="stExpire" style="color:#ff5555">0</b><span>Expiring≤3d</span></div>
      </div>
      <input type="text" id="searchBox" placeholder="🔍 नाम / हिंदी / English / Mobile / Father / Surname..."
        oninput="renderList()" style="margin-bottom:10px">
      <div class="tabs">
        <div class="tab on" data-tab="all" onclick="setTab('all')">All</div>
        <div class="tab" data-tab="student" onclick="setTab('student')">🎓 Student</div>
        <div class="tab" data-tab="job" onclick="setTab('job')">💼 Job</div>
        <div class="tab" data-tab="expire" onclick="setTab('expire')">⚠️ Expiring</div>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <button class="btn btn-dark" style="flex:1" onclick="loadMembers(true)">🔄 Refresh</button>
        <button class="btn btn-gold" style="flex:1" onclick="exportCSV()">📥 CSV</button>
      </div>
    </div>

    <div id="listBox"></div>
  </div>

  <!-- EDIT MODAL -->
  <div id="editModal" class="hide" style="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;overflow:auto;padding:16px">
    <div class="card" style="max-width:520px;margin:20px auto">
      <h2>✏️ Edit Member</h2>
      <input type="hidden" id="edId">
      <div class="edit-grid">
        <div class="full"><label>Full Name *</label><input id="edName"></div>
        <div class="full"><label>Father / Parent Name</label><input id="edParent"></div>
        <div><label>Phone *</label><input id="edPhone" maxlength="10" inputmode="numeric"></div>
        <div><label>Category</label>
          <select id="edCat">
            <option value="student">Student</option>
            <option value="cardio">Job Seeker / Cardio</option>
            <option value="general">General / Job</option>
            <option value="trial">Trial</option>
          </select>
        </div>
        <div><label>Plan</label><input id="edPlan" placeholder="1 Month / 3 Month..." oninput="autoEnd()"></div>
        <div><label>Total Fee ₹</label><input id="edFee" type="number" oninput="autoDue()"></div>
        <div><label>Paid Fee ₹</label><input id="edPaid" type="number" oninput="autoDue()"></div>
        <div><label>Due Fee ₹</label><input id="edDue" type="number"></div>
        <div><label>Joining Date</label><input id="edJoin" type="date" onchange="autoEnd()"></div>
        <div><label>Expiry / End Date</label><input id="edEnd" type="date"></div>
        <div><label>Status</label>
          <select id="edStatus">
            <option value="Full Paid">Full Paid</option>
            <option value="Pending">Pending</option>
            <option value="Partial">Partial</option>
          </select>
        </div>
        <div><label>Occupation</label><input id="edOcc"></div>
        <div class="full"><label>Address / Village</label><input id="edAddr"></div>
        <div><label>Age</label><input id="edAge" type="number"></div>
        <div><label>Gender</label>
          <select id="edGender"><option value="M">M</option><option value="F">F</option><option value="O">O</option></select>
        </div>
        <div class="full"><label>Time Slot</label><input id="edSlot"></div>
        <div class="full"><label>Notes</label><textarea id="edNotes" rows="2" style="width:100%;background:#181818;border:1px solid #444;color:#fff;padding:8px;border-radius:8px"></textarea></div>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn btn-dark" style="flex:1" onclick="closeEdit()">Cancel</button>
        <button class="btn btn-green" style="flex:2" onclick="saveEdit()">💾 Save Changes</button>
      </div>
    </div>
  </div>

</div>

<script>
const PASSWORD = "5555";
const LS_KEYS = ["5BFC_MEMBERS", "bbf_master_records_v4", "bbf_members_v1"];

const firebaseConfig = {
  apiKey: "AIzaSyA9z1gXZDB3W0lJxyHV9x2vWeb0Ees7z-g",
  authDomain: "brother-s-fitness-club.firebaseapp.com",
  projectId: "brother-s-fitness-club",
  storageBucket: "brother-s-fitness-club.firebasestorage.app",
  messagingSenderId: "781489019006",
  appId: "1:781489019006:web:4a230698f2195e7208202f"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let MEMBERS = [];
let currentTab = "all";

function tryLogin() {
  const v = (document.getElementById("pwInput").value || "").trim();
  if (v === PASSWORD) {
    sessionStorage.setItem("5bfc_members_ok", "1");
    document.getElementById("loginScreen").classList.add("hide");
    document.getElementById("mainScreen").classList.remove("hide");
    loadMembers(true);
  } else {
    alert("❌ Galat password");
    document.getElementById("pwInput").value = "";
  }
}
function logout() {
  sessionStorage.removeItem("5bfc_members_ok");
  location.reload();
}
if (sessionStorage.getItem("5bfc_members_ok") === "1") {
  document.getElementById("loginScreen").classList.add("hide");
  document.getElementById("mainScreen").classList.remove("hide");
}

function setTab(t) {
  currentTab = t;
  document.querySelectorAll(".tab").forEach(el => el.classList.toggle("on", el.dataset.tab === t));
  renderList();
}

function normalize(m) {
  const cat = String(m.category || m.admCategory || m.planCategory || m.memberType || "").toLowerCase();
  const plan = String(m.plan || m.planName || "").toLowerCase();
  const occ = String(m.occupation || "").toLowerCase();
  let type = "job";
  if (cat.includes("student") || plan.includes("student") || plan.includes("विद्यार्थी") || occ.includes("student") || occ.includes("छात्र")) {
    type = "student";
  } else if (cat.includes("trial")) {
    type = "job";
  }
  const join = m.joinDate || m.joiningDate || m.admDate || m.startDate || "";
  let end = m.endDate || m.expiryDate || m.expDate || m.validTill || "";
  if (!end && join) end = calcEnd(join, m.plan || m.planName || "");
  return {
    id: m.id || m.code || String(Math.random()).slice(2, 10),
    code: m.code || ("5BFC-" + (m.id || "")),
    name: m.name || m.fullName || m.admFullName || "",
    parentName: m.parentName || m.fatherName || m.admParentName || "",
    phone: String(m.phone || m.mobile || m.admPhone || "").replace(/\D/g, "").slice(-10),
    category: cat || (type === "student" ? "student" : "general"),
    type,
    plan: m.plan || m.planName || "",
    totalFee: num(m.totalFee || m.fee || m.feesAmount || 0),
    paidFee: num(m.paidFee || m.paid || 0),
    dueFee: num(m.dueFee != null ? m.dueFee : 0),
    status: m.status || m.fees || m.manualStatus || "Pending",
    joinDate: join,
    endDate: end,
    occupation: m.occupation || "",
    village: m.village || m.address || m.area || "",
    age: m.age || "",
    gender: m.gender || "M",
    slot: m.slot || m.timeSlot || "",
    notes: m.notes || "",
    _raw: m
  };
}
function num(x){ const n = Number(x); return isNaN(n)?0:n; }
function pad(n){ return String(n).padStart(2,"0"); }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function showDate(s){ const d=parseDate(s); return d ? pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear() : "—"; }
// plan se kitne mahine (1 Month=1, 3 Month=3, 6=6, 12/Year=12)
function planMonths(plan){
  const p = String(plan||"").toLowerCase();
  const n = p.match(/(\d+)/);
  if(/year|yr|saal|साल|वर्ष/.test(p)) return n ? Math.min(+n[1],5)*12 : 12;
  return n && +n[1]>0 ? +n[1] : 1;
}
// Join 1 tarikh -> End 31 (mahine ka last din). Join 15 Jan -> End 14 Feb.
function calcEnd(joinStr, plan){
  const d = parseDate(joinStr);
  if(!d) return "";
  const months = planMonths(plan);
  const lastDay = new Date(d.getFullYear(), d.getMonth()+months+1, 0).getDate();
  const next = new Date(d.getFullYear(), d.getMonth()+months, Math.min(d.getDate(), lastDay));
  next.setDate(next.getDate()-1);
  return iso(next);
}
function parseDate(s){
  if(!s || s==="N/A") return null;
  // yyyy-mm-dd (local time, timezone shift nahi)
  const im = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(im) return new Date(+im[1], +im[2]-1, +im[3]);
  // dd/mm/yyyy or dd-mm-yyyy
  const m = String(s).match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){
    let y = m[3].length===2 ? "20"+m[3] : m[3];
    return new Date(+y, +m[2]-1, +m[1]);
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function daysLeft(end){
  const d = parseDate(end);
  if(!d) return 9999;
  const today = new Date(); today.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  return Math.round((d - today)/86400000);
}

function loadFromLocal(){
  const map = new Map();
  LS_KEYS.forEach(k=>{
    try{
      const arr = JSON.parse(localStorage.getItem(k)||"[]");
      if(Array.isArray(arr)) arr.forEach(m=>{
        const n = normalize(m);
        if(n.phone || n.name) map.set(String(n.id), n);
      });
    }catch(e){}
  });
  return [...map.values()];
}

async function loadMembers(fromCloud){
  const listBox = document.getElementById("listBox");
  listBox.innerHTML = '<p class="muted" style="text-align:center;padding:20px">Loading...</p>';
  let local = loadFromLocal();
  if(fromCloud){
    try{
      const snap = await db.collection("members").get();
      const cloud = [];
      snap.forEach(doc=>{
        const data = doc.data();
        data.id = data.id || doc.id;
        const nm = normalize(data); nm._docId = doc.id;
        cloud.push(nm);
      });
      // merge cloud over local by phone/name
      const map = new Map();
      local.forEach(m=>map.set(String(m.id), m));
      cloud.forEach(m=>{
        const key = String(m.id);
        if(map.has(key)) map.set(key, {...map.get(key), ...m});
        else {
          // also match by phone
          let found = false;
          for(const [k,v] of map){
            if(v.phone && v.phone === m.phone && m.phone.length===10){
              map.set(k, {...v, ...m, id:v.id});
              found = true; break;
            }
          }
          if(!found) map.set(key, m);
        }
      });
      MEMBERS = [...map.values()];
    }catch(e){
      console.error(e);
      MEMBERS = local;
    }
  } else {
    MEMBERS = local;
  }
  // sort by name
  MEMBERS.sort((a,b)=> (a.name||"").localeCompare(b.name||"", "hi"));
  updateStats();
  renderList();
}

function updateStats(){
  const st = MEMBERS.filter(m=>m.type==="student").length;
  const job = MEMBERS.length - st;
  const exp = MEMBERS.filter(m=> daysLeft(m.endDate) <= 3).length;
  document.getElementById("stTotal").textContent = MEMBERS.length;
  document.getElementById("stStudent").textContent = st;
  document.getElementById("stJob").textContent = job;
  document.getElementById("stExpire").textContent = exp;
}

function matchesSearch(m, q){
  if(!q) return true;
  q = q.toLowerCase().trim();
  const bag = [
    m.name, m.parentName, m.phone, m.code, m.plan, m.occupation, m.village, m.notes
  ].join(" ").toLowerCase();
  // also split words
  return q.split(/\s+/).every(w => bag.includes(w));
}

function renderList(){
  const q = document.getElementById("searchBox").value || "";
  let list = MEMBERS.filter(m => matchesSearch(m, q));
  if(currentTab==="student") list = list.filter(m=>m.type==="student");
  else if(currentTab==="job") list = list.filter(m=>m.type!=="student");
  else if(currentTab==="expire") list = list.filter(m=> daysLeft(m.endDate) <= 3).sort((a,b)=>daysLeft(a.endDate)-daysLeft(b.endDate));

  const box = document.getElementById("listBox");
  if(!list.length){
    box.innerHTML = '<div class="card"><p class="muted" style="text-align:center">Koi member nahi mila</p></div>';
    return;
  }
  box.innerHTML = list.map(m=>{
    const dl = daysLeft(m.endDate);
    const expClass = dl <= 3 ? "expire" : (m.type==="student"?"student":"job");
    const badge = m.type==="student"
      ? '<span class="badge badge-s">🎓 Student</span>'
      : '<span class="badge badge-j">💼 Job/Normal</span>';
    const expBadge = dl <= 3
      ? `<span class="badge badge-e">⚠️ ${dl<0?("Overdue "+Math.abs(dl)+"d"):(dl+" day left")}</span>`
      : (m.endDate ? `<span class="badge badge-ok">End: ${m.endDate}</span>` : "");
    const paid = String(m.status).toLowerCase().includes("paid") || m.dueFee===0;
    const jd = parseDate(m.joinDate);
    const feeDay = jd ? jd.getDate() : null;
    const catLabel = {student:"Student",cardio:"Job Seeker / Cardio",general:"General / Job",trial:"Trial"};
    const cat = (m.category||"").includes("student")?"Student":(m.category||"").includes("cardio")?"Job Seeker / Cardio":(m.category||"").includes("trial")?"Trial":"General / Job";
    return `<div class="member ${expClass}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div>
          <div style="font-weight:700;font-size:14px">${esc(m.name)||"—"}</div>
          <div class="muted">S/O: ${esc(m.parentName)||"—"} · ${esc(m.phone)||"—"}</div>
          <div class="muted">${esc(m.code)} · ${esc(m.plan)||"Plan N/A"}</div>
        </div>
        <div style="text-align:right">
          ${badge}<br>${expBadge}
        </div>
      </div>
      <div class="datebox">
        <div><b>JOIN DATE</b>${showDate(m.joinDate)}</div>
        <div><b>FEES DATE</b>${feeDay?("Har mahine "+feeDay+" ko"):"—"}</div>
        <div class="${dl<=3?"red":"green"}"><b>EXPIRY</b>${showDate(m.endDate)}</div>
      </div>
      <div class="det">
        <div><b>Total Fee</b>₹${m.totalFee}</div>
        <div><b>Paid</b>₹${m.paidFee}</div>
        <div><b>Due</b><span class="${m.dueFee>0?"red":"green"}">₹${m.dueFee}</span></div>
        <div><b>Status</b><span class="${paid?"green":"red"}">${esc(m.status)}</span></div>
        <div><b>Category</b>${cat}</div>
        <div><b>Occupation</b>${esc(m.occupation)||"—"}</div>
        <div><b>Age / Gender</b>${esc(m.age)||"—"} / ${esc(m.gender)||"—"}</div>
        <div><b>Time Slot</b>${esc(m.slot)||"—"}</div>
        <div class="full"><b>Address / Village</b>${esc(m.village)||"—"}</div>
        ${m.notes?`<div class="full"><b>Notes</b>${esc(m.notes)}</div>`:""}
      </div>
      <div class="row">
        <button class="btn btn-dark" onclick='openEdit(${JSON.stringify(m.id)})'>✏️ Edit</button>
        <button class="btn btn-wa" onclick='waReminder(${JSON.stringify(m.id)})'>💬 WhatsApp</button>
        <button class="btn btn-red" onclick='deleteMember(${JSON.stringify(m.id)})'>🗑️ Delete</button>
      </div>
    </div>`;
  }).join("");
}

function esc(s){
  return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function findMember(id){
  return MEMBERS.find(m => String(m.id)===String(id));
}

function openEdit(id){
  const m = findMember(id);
  if(!m){ alert("Record nahi mila"); return; }
  document.getElementById("edId").value = m.id;
  document.getElementById("edName").value = m.name||"";
  document.getElementById("edParent").value = m.parentName||"";
  document.getElementById("edPhone").value = m.phone||"";
  document.getElementById("edCat").value = (m.category||"").includes("student")?"student"
    :(m.category||"").includes("cardio")?"cardio"
    :(m.category||"").includes("trial")?"trial":"general";
  document.getElementById("edPlan").value = m.plan||"";
  document.getElementById("edFee").value = m.totalFee||0;
  document.getElementById("edPaid").value = m.paidFee||0;
  document.getElementById("edDue").value = m.dueFee||0;
  document.getElementById("edJoin").value = toInputDate(m.joinDate);
  document.getElementById("edEnd").value = toInputDate(m.endDate);
  document.getElementById("edStatus").value = String(m.status).toLowerCase().includes("paid")?"Full Paid"
    :String(m.status).toLowerCase().includes("partial")?"Partial":"Pending";
  document.getElementById("edOcc").value = m.occupation||"";
  document.getElementById("edAddr").value = m.village||"";
  document.getElementById("edAge").value = m.age||"";
  document.getElementById("edGender").value = m.gender||"M";
  document.getElementById("edSlot").value = m.slot||"";
  document.getElementById("edNotes").value = m.notes||"";
  document.getElementById("editModal").classList.remove("hide");
}
function toInputDate(s){
  const d = parseDate(s);
  return d ? iso(d) : "";
}
function autoEnd(){
  const e = calcEnd(document.getElementById("edJoin").value, document.getElementById("edPlan").value);
  if(e) document.getElementById("edEnd").value = e;
}
function autoDue(){
  const due = Math.max(0, num(document.getElementById("edFee").value) - num(document.getElementById("edPaid").value));
  document.getElementById("edDue").value = due;
  document.getElementById("edStatus").value = due===0 ? "Full Paid" : (num(document.getElementById("edPaid").value)>0 ? "Partial" : "Pending");
}
async function deleteMember(id){
  const m = findMember(id);
  if(!m){ alert("Record nahi mila"); return; }
  if(!confirm("🗑️ "+(m.name||"Member")+" ("+m.code+") ko DELETE karna hai?\n\nYeh wapas nahi aayega.")) return;
  LS_KEYS.forEach(k=>{
    try{
      let arr = JSON.parse(localStorage.getItem(k)||"[]");
      if(!Array.isArray(arr)) return;
      arr = arr.filter(r => String(r.id)!==String(m.id) && String(r.code||"")!==String(m.code));
      localStorage.setItem(k, JSON.stringify(arr));
    }catch(e){}
  });
  try{
    const ids = new Set([String(m.id)]);
    if(m._docId) ids.add(String(m._docId));
    for(const d of ids) await db.collection("members").doc(d).delete();
  }catch(e){ console.error("cloud delete", e); alert("Cloud se delete nahi hua, internet check karein"); }
  await loadMembers(true);
}
function closeEdit(){ document.getElementById("editModal").classList.add("hide"); }

async function saveEdit(){
  const id = document.getElementById("edId").value;
  const m = findMember(id);
  if(!m) return;
  const updated = {
    ...m._raw,
    id: m.id,
    code: m.code,
    name: document.getElementById("edName").value.trim(),
    fullName: document.getElementById("edName").value.trim(),
    parentName: document.getElementById("edParent").value.trim(),
    phone: document.getElementById("edPhone").value.trim(),
    category: document.getElementById("edCat").value,
    plan: document.getElementById("edPlan").value.trim(),
    totalFee: num(document.getElementById("edFee").value),
    paidFee: num(document.getElementById("edPaid").value),
    dueFee: num(document.getElementById("edDue").value),
    joinDate: document.getElementById("edJoin").value,
    endDate: document.getElementById("edEnd").value,
    expiryDate: document.getElementById("edEnd").value,
    status: document.getElementById("edStatus").value,
    fees: document.getElementById("edStatus").value === "Full Paid" ? "Paid" : "Pending",
    manualStatus: document.getElementById("edStatus").value === "Full Paid" ? "Paid" : "Pending",
    occupation: document.getElementById("edOcc").value.trim(),
    village: document.getElementById("edAddr").value.trim(),
    age: document.getElementById("edAge").value,
    gender: document.getElementById("edGender").value,
    slot: document.getElementById("edSlot").value.trim(),
    notes: document.getElementById("edNotes").value.trim()
  };

  // save local all keys
  LS_KEYS.forEach(k=>{
    try{
      let arr = JSON.parse(localStorage.getItem(k)||"[]");
      if(!Array.isArray(arr)) arr = [];
      const idx = arr.findIndex(r => String(r.id)===String(id) || (r.code && String(r.code)===String(updated.code)));
      if(idx>=0) arr[idx] = {...arr[idx], ...updated};
      else arr.push(updated);
      localStorage.setItem(k, JSON.stringify(arr));
    }catch(e){}
  });

  try{
    await db.collection("members").doc(String(m._docId||id)).set(JSON.parse(JSON.stringify(updated)), {merge:true});
  }catch(e){ console.error("cloud save", e); }

  closeEdit();
  await loadMembers(true);
  alert("✅ Details save ho gaye");
}

function exportCSV(){
  let csv = "ID,Name,Father,Phone,Type,Plan,Fee,Status,Join,End\n";
  MEMBERS.forEach(m=>{
    csv += `"${m.code}","${m.name}","${m.parentName}","${m.phone}","${m.type}","${m.plan}","${m.totalFee}","${m.status}","${m.joinDate}","${m.endDate}"\n`;
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download = "5BFC_Members.csv";
  a.click();
}
