<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OM Software — Master Admin Console</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-functions-compat.js"></script>
<style>body{margin:0;background:#050813;color:#f8fafc;font:14px Arial;padding:14px}.wrap{max-width:900px;margin:auto}.top,.card{background:#0c1730;border:1px solid #263b63;border-radius:14px;padding:14px;margin-bottom:12px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}h2{color:#f5b942;margin:0 0 10px}.muted{color:#94a3b8;font-size:12px}.item{border:1px solid #293c5e;border-radius:10px;padding:12px;margin:8px 0;background:#091226}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select{padding:8px;border-radius:8px;background:#081020;color:white;border:1px solid #405174}button{padding:9px 12px;border:0;border-radius:8px;background:#f5b942;color:#111;font-weight:900}button.danger{background:#fb7185}.good{color:#6ee7b7}.bad{color:#fb7185}#status{font-size:12px;color:#22d3ee;margin:8px 0}</style></head>
<body><div class="wrap"><div class="top"><div><h2>OM SOFTWARE — MASTER ADMIN</h2><div class="muted">Developer Console • All registered gyms • Plans • Tenant oversight</div></div><div><a href="index.html" style="color:#22d3ee">Dashboard</a> &nbsp; <button onclick="logout()">Logout</button></div></div><div id="status">Verifying Master Admin claim…</div>
<div class="card"><h2>All Registered Gyms</h2><div class="muted">Each Gym Owner has a separate tenant. New / empty gyms show zero data until records are uploaded.</div><div id="gyms">Loading…</div></div>
<div class="card"><h2>Pending Plan Requests</h2><div id="requests">Loading…</div></div></div>
<script>
const CFG={apiKey:'AIzaSyAHEMISEIDSzZz-m2OQT5EPyhTRF-mXqjQ',authDomain:'bfc-gym-215ae.firebaseapp.com',projectId:'bfc-gym-215ae',storageBucket:'bfc-gym-215ae.firebasestorage.app',messagingSenderId:'886920088571',appId:'1:886920088571:web:c4bc478d246a2700b0d95e'};
if(!firebase.apps.length)firebase.initializeApp(CFG);const auth=firebase.auth(),db=firebase.firestore(),fn=firebase.app().functions('asia-south1');
const $=id=>document.getElementById(id),esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let master=false;
function logout(){auth.signOut().finally(()=>location.replace('login.html'))}
async function activate(gymId){const amount=Number(document.getElementById('plan_'+gymId).value);try{await fn.httpsCallable('masterSetSubscription')({gymId,amount,action:'activate'});$('status').textContent='Plan activated for '+gymId;await loadAll()}catch(e){$('status').textContent='Activation failed: '+(e.message||e)}}
async function approveRequest(gymId, amount){const sel=document.getElementById('plan_'+gymId);if(sel)sel.value=String(amount);return activate(gymId)}
async function suspend(gymId){if(!confirm('Is Gym ka plan suspend karna hai?'))return;try{await fn.httpsCallable('masterSetSubscription')({gymId,action:'suspend'});$('status').textContent='Subscription suspended for '+gymId;await loadAll()}catch(e){$('status').textContent='Suspend failed: '+(e.message||e)}}
async function loadAll(){
 const [os,ss,rs]=await Promise.all([db.collection('owner_accounts').get(),db.collection('subscriptions').get(),db.collection('plan_requests').where('status','==','pending').get()]);
 const plans={};ss.forEach(d=>plans[d.id]=d.data()||{});
 $('gyms').innerHTML=os.empty?'<div class="item">Abhi koi Gym Owner register nahi hua.</div>':os.docs.map(d=>{const x=d.data()||{},p=plans[d.id]||{};return `<div class="item"><b>${esc(x.gymName||'Unnamed Gym')}</b><div class="muted">Owner: ${esc(x.ownerName||'-')} • Email: ${esc(x.email||'-')} • Mobile: ${esc(x.phone||'-')}</div><div class="muted">Gym ID: ${esc(d.id)}</div><div class="row"><span class="${p.status==='active'?'good':'bad'}">${esc(p.status||'No Plan')} ${p.amount?'• ₹'+p.amount:''}</span><select id="plan_${esc(d.id)}"><option value="99">₹99 Base</option><option value="199">₹199 Growth</option><option value="399">₹399 Pro</option><option value="499">₹499 Advanced</option><option value="999">₹999 Enterprise</option></select><button onclick="activate('${esc(d.id)}')">Activate / Upgrade</button><button class="danger" onclick="suspend('${esc(d.id)}')">Suspend</button></div></div>`}).join('');
 $('requests').innerHTML=rs.empty?'<div class="item">Koi pending plan request nahi hai.</div>':rs.docs.map(d=>{const x=d.data()||{};return `<div class="item"><b>${esc(x.planName||'Plan request')}</b> • ₹${Number(x.amount||0)}<div class="muted">Gym ID: ${esc(x.gymId||d.id)} • Request ID: ${esc(d.id)}</div><div class="row"><select id="reqplan_${esc(d.id)}"><option value="${Number(x.amount||99)}">Requested ₹${Number(x.amount||99)}</option><option value="99">₹99 Base</option><option value="199">₹199 Growth</option><option value="399">₹399 Pro</option><option value="499">₹499 Advanced</option><option value="999">₹999 Enterprise</option></select><button onclick="approveRequest('${esc(x.gymId||d.id)}',${Number(x.amount||99)})">Approve &amp; Activate</button></div></div>`}).join('');
}
auth.onAuthStateChanged(async u=>{if(!u){location.replace('login.html');return;}try{const t=await u.getIdTokenResult(true);if(!t.claims.masterAdmin){alert('Master Admin access denied.');location.replace('index.html');return;}master=true;$('status').textContent='Verified Master Admin • Full tenant access';await loadAll()}catch(e){$('status').textContent='Verification failed: '+(e.message||e)}});
</script></body></html>
