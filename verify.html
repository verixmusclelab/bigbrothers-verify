<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Official Product Verification - Big Brothers Fitness</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: radial-gradient(circle at center, #1b1b1b 0%, #080808 100%);
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 15px;
}

.main-container {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Header & Welcome */
.brand-icon {
  font-size: 32px;
  margin-bottom: 6px;
  filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.4));
}

.welcome-title {
  font-size: 24px;
  font-weight: 800;
  color: #ffcc00;
  text-align: center;
  line-height: 1.25;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.welcome-sub {
  font-size: 14px;
  color: #cccccc;
  text-align: center;
  margin-bottom: 22px;
}

/* Verification Card */
.verify-card {
  width: 100%;
  background: rgba(22, 22, 22, 0.95);
  border: 2px solid #ffcc00;
  border-radius: 18px;
  padding: 22px 18px;
  box-shadow: 0 0 25px rgba(255, 204, 0, 0.15);
  margin-bottom: 18px;
  text-align: center;
}

.card-heading {
  font-size: 18px;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 14px;
  letter-spacing: 0.5px;
}

.code-input {
  width: 100%;
  padding: 14px;
  background: #0d0d0d;
  border: 1.5px solid #333333;
  border-radius: 10px;
  color: #ffffff;
  font-size: 17px;
  font-weight: bold;
  text-align: center;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  outline: none;
  transition: border-color 0.3s;
}

.code-input:focus {
  border-color: #ffcc00;
}

.verify-btn {
  width: 100%;
  padding: 14px;
  margin-top: 14px;
  background: #ffcc00;
  border: none;
  border-radius: 10px;
  color: #000000;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.5px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
  transition: transform 0.1s, background 0.2s;
}

.verify-btn:active {
  transform: scale(0.98);
}

/* Result Box */
#resultBox {
  width: 100%;
  display: none;
  margin-bottom: 18px;
}

.badge-box {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  text-align: center;
}

.badge-verified {
  background: rgba(0, 255, 100, 0.08);
  border: 2px solid #00ff66;
  box-shadow: 0 0 20px rgba(0, 255, 100, 0.2);
}

.badge-failed {
  background: rgba(255, 50, 50, 0.08);
  border: 2px solid #ff3333;
  box-shadow: 0 0 20px rgba(255, 50, 50, 0.2);
}

.badge-warning {
  background: rgba(255, 204, 0, 0.08);
  border: 2px solid #ffcc00;
  box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
}

/* Admin / Download Area */
.download-section {
  width: 100%;
  text-align: center;
  margin-top: 10px;
  padding-top: 15px;
  border-top: 1px dashed rgba(255, 255, 255, 0.15);
}

.download-title {
  font-size: 12px;
  color: #ffcc00;
  margin-bottom: 10px;
  font-weight: 600;
}

.pill-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
}

.pill-btn {
  background: #1f1f1f;
  color: #ffcc00;
  border: 1px solid #333333;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
}
</style>
</head>
<body>

<div class="main-container">
  
  <!-- BRAND LOGO / ICON -->
  <div class="brand-icon">👑</div>

  <!-- DYNAMIC BRAND WELCOME TEXT -->
  <h1 class="welcome-title" id="welcomeBrand">Welcome to<br>Big Brothers Fitness</h1>
  <p class="welcome-sub">Enter Your Verification Code here</p>

  <!-- VERIFICATION INPUT CARD -->
  <div class="verify-card">
    <div class="card-heading">Verification Card</div>
    <input type="text" id="scratchInput" class="code-input" placeholder="ENTER CODE" maxlength="15" autocomplete="off" autocorrect="off" autocapitalize="characters">
    <button type="button" class="verify-btn" onclick="runVerification()">VERIFY CODE</button>
  </div>

  <!-- RESULT NOTIFICATION CARD (PEHLE SE HIDE RAHEGA) -->
  <div id="resultBox">
    <!-- Jaisa result hoga, javascript se yahan badge aayega -->
  </div>

  <!-- ADMIN / STICKER CODES DOWNLOAD AREA -->
  <div class="download-section">
    <div class="download-title">📥 Download - Sticker Printing (.txt)</div>
    <div class="pill-container">
      <button type="button" class="pill-btn" onclick="downloadCodes('WP', 'Whey_Protein')">Whey Protein</button>
      <button type="button" class="pill-btn" onclick="downloadCodes('MG', 'Mass_Gainer')">Mass Gainer</button>
      <button type="button" class="pill-btn" onclick="downloadCodes('CR', 'Creatine')">Creatine</button>
      <button type="button" class="pill-btn" onclick="downloadCodes('MV', 'Multivitamin')">Multivitamin</button>
    </div>
  </div>

</div>
<script>
const CHARS = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";

function getCodeForIndex(prefix, index) {
  let num = (index * 9301 + 49297) % 233280;
  let part = "";
  let n = (num * 1000 + index * 37) >>> 0;
  for (let i = 0; i < 5; i++) {
    part += CHARS[n % CHARS.length];
    n = Math.floor(n / CHARS.length) + (i * 7);
  }
  return prefix + part;
}

const BRAND_DIRECTORY = {
  "MSW": "Muscle Size Nutrition",
  "MGG": "Muscul Gold Nutrition",
  "ACT": "Active Shake Nutrition",
  "KNG": "KN Nutrition",
  "ANX": "Americian Nutrition",
  "LBR": "Labrada Nutrition",
  "ULT": "Ultimate Nutrition",
  "ON": "Optimum Nutrition",
  "GNC": "GNC Live Well",
  "MB": "MuscleBlaze",
  "MT": "MuscleTech",
  "WP": "Big Brothers Whey",
  "MG": "Big Brothers Gainer",
  "CR": "Big Brothers Creatine",
  "MV": "Big Brothers Multivitamin"
};

function identifyProduct(c) {
  if (c.startsWith("MSW")) return { brand: "Muscle Size Nutrition", name: "100% Whey Protein" };
  if (c.startsWith("MGG")) return { brand: "Muscul Gold Nutrition", name: "Pro Series Mass Gainer" };
  if (c.startsWith("ACT")) return { brand: "Active Shake Nutrition", name: "Active Shake Protein" };
  if (c.startsWith("KNG")) return { brand: "KN Nutrition", name: "Real Mass Gainer" };
  if (c.startsWith("ANX")) return { brand: "Americian Nutrition", name: "Xtreme Mass" };
  if (c.startsWith("WP") || c.startsWith("LBR") || c.startsWith("ULT")) return { brand: "Big Brothers Fitness", name: "100% Genuine Whey Protein" };
  if (c.startsWith("MG") || c.startsWith("LMG")) return { brand: "Big Brothers Fitness", name: "100% Genuine Mass Gainer" };
  if (c.startsWith("CR") || c.startsWith("CRE") || c.startsWith("GNC-C")) return { brand: "Big Brothers Fitness", name: "100% Genuine Creatine" };
  if (c.startsWith("MV") || c.startsWith("VIT") || c.startsWith("MUL")) return { brand: "Big Brothers Fitness", name: "100% Genuine Multivitamin" };
  return null;
}

window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  const brandParam = (params.get("brand") || "").trim().toUpperCase();
  const codeParam = (params.get("code") || "").trim().toUpperCase();

  if (brandParam && BRAND_DIRECTORY[brandParam]) {
    document.getElementById("welcomeBrand").innerHTML = "Welcome to<br>" + BRAND_DIRECTORY[brandParam];
  }

  if (codeParam) {
    document.getElementById("scratchInput").value = codeParam;
    runVerification();
  }
};

function runVerification() {
  const inputElem = document.getElementById("scratchInput");
  const resultBox = document.getElementById("resultBox");
  const code = inputElem.value.trim().toUpperCase();

  if (!code) {
    resultBox.style.display = "block";
    resultBox.innerHTML = `
      <div class="badge-box badge-failed">
        <div style="font-size:18px; font-weight:800; color:#ff3333; margin-bottom:4px;">❌ CODE REQUIRED</div>
        <div style="font-size:13px; color:#bbb;">Kripya box me scratch code enter karein.</div>
      </div>
    `;
    return;
  }

  const productData = identifyProduct(code);

  if (productData) {
    document.getElementById("welcomeBrand").innerHTML = "Welcome to<br>" + productData.brand;

    let scanCount = parseInt(localStorage.getItem("scan_" + code)) || 0;

    if (scanCount >= 2) {
      resultBox.style.display = "block";
      resultBox.innerHTML = `
        <div class="badge-box badge-warning">
          <div style="font-size:18px; font-weight:800; color:#ffcc00; margin-bottom:4px;">⚠️ ALREADY VERIFIED</div>
          <div style="font-size:14px; font-weight:bold; color:#fff; margin-bottom:4px;">BRAND: ${productData.brand}</div>
          <div style="font-size:13px; color:#ddd; margin-bottom:4px;">PRODUCT: ${productData.name}</div>
          <div style="font-size:12px; color:#aaa;">Ye code pehle hi 2 baar scan kiya ja chuka hai (Limit 2/2).</div>
        </div>
      `;
    } else {
      scanCount++;
      localStorage.setItem("scan_" + code, scanCount);

      resultBox.style.display = "block";
      resultBox.innerHTML = `
        <div class="badge-box badge-verified">
          <div style="font-size:18px; font-weight:800; color:#00ff66; margin-bottom:4px;">✔ 100% ORIGINAL & VERIFIED</div>
          <div style="font-size:14px; font-weight:bold; color:#fff; margin-bottom:4px;">BRAND: ${productData.brand}</div>
          <div style="font-size:13px; color:#ddd; margin-bottom:6px;">PRODUCT: ${productData.name}</div>
          <div style="font-size:12px; color:#00ff66; font-weight:600;">Verification Scan: ${scanCount} / 2</div>
        </div>
      `;
    }
  } else {
    resultBox.style.display = "block";
    resultBox.innerHTML = `
      <div class="badge-box badge-failed">
        <div style="font-size:18px; font-weight:800; color:#ff3333; margin-bottom:4px;">❌ INVALID PRODUCT CODE</div>
        <div style="font-size:13px; color:#bbb;">Ye code verify record me uplabdh nahi hai.</div>
      </div>
    `;
  }
}

function downloadCodes(prefix, fileName) {
  let list = [];
  for (let i = 1; i <= 2000; i++) {
    list.push(getCodeForIndex(prefix, i));
  }
  let blob = new Blob([list.join("\n")], { type: "text/plain;charset=utf-8" });
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `2000_${fileName}_Codes.txt`;
  a.click();
}
</script>

</body>
</html>
