<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>5 Brother's Nutrition - Official Verification</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:#0b0b0b;
color:#fff;
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:15px;
}

.card{
background:radial-gradient(circle at top, #1a1705 0%, #0d0d0d 85%);
padding:26px 20px;
border-radius:20px;
border:2px solid #ffcc00;
width:100%;
max-width:390px;
text-align:center;
box-shadow:0 0 25px rgba(255,204,0,0.2);
}

.brand{
font-size:21px;
font-weight:900;
color:#ffcc00;
letter-spacing:1px;
margin-bottom:4px;
}

.sub-tag{
font-size:11px;
color:#aaa;
margin-bottom:15px;
font-weight:bold;
}

.badge{
display:inline-block;
padding:4px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
margin-bottom:15px;
}

.badge-success{
background:rgba(0,255,100,0.15);
border:1px solid #00ff66;
color:#00ff66;
}

.btn{
width:100%;
padding:13px;
background:#ffcc00;
color:#000;
border:none;
font-weight:bold;
cursor:pointer;
border-radius:10px;
margin-top:12px;
font-size:15px;
}

.code-box{
margin:15px 0;
padding:12px;
border:1.5px dashed #ffcc00;
border-radius:12px;
color:#ffcc00;
font-size:16px;
font-weight:bold;
background:rgba(255,204,0,0.05);
word-break:break-all;
}

input{
width:100%;
padding:12px;
text-align:center;
border-radius:10px;
border:1.5px solid #444;
background:#161616;
color:#fff;
font-size:16px;
outline:none;
text-transform:uppercase;
font-weight:bold;
letter-spacing:1px;
}

input:focus{
border-color:#ffcc00;
}

#resultBox{
margin-top:16px;
font-weight:bold;
font-size:15px;
min-height:40px;
line-height:1.5;
}

.admin-export{
margin-top:20px;
text-align:center;
border-top:1px dashed #333;
padding-top:15px;
width:100%;
max-width:390px;
}

.export-btn{
background:#222;
color:#ffcc00;
border:1px solid #ffcc00;
padding:8px 10px;
border-radius:6px;
font-size:11px;
cursor:pointer;
margin:4px;
font-weight:bold;
}
</style>
</head>

<body>

<!-- SCREEN 1: QR AUTO VERIFIED SCREEN -->
<div id="verifiedScreen" style="display:none; width:100%; justify-content:center;">
  <div class="card">
    <div class="brand" id="scanBrandName">5 BROTHER'S NUTRITION</div>
    <div class="sub-tag">100% AUTHENTIC VERIFICATION DESK</div>
    
    <div style="font-size:55px; margin:10px 0;">✅</div>
    
    <div class="badge badge-success">PRODUCT VERIFIED & GENUINE</div>
    
    <div style="font-size:15px; color:#ddd; margin-bottom:8px;">
      उत्पाद: <b id="scanProduct" style="color:#ffcc00;">---</b>
    </div>
    <div style="font-size:13px; color:#888; margin-bottom:15px;">
      बैच कोड: <span id="scanCodeText" style="color:#00ff66; font-weight:bold;">---</span>
    </div>

    <button class="btn" onclick="openPortal()">OPEN VERIFY PORTAL</button>
  </div>
</div>

<!-- SCREEN 2: MANUAL VERIFICATION PORTAL -->
<div id="portalScreen" style="display:flex; width:100%; justify-content:center;">
  <div class="card">
    <div class="brand">PRODUCT VERIFICATION</div>
    <div class="sub-tag">5 BROTHER'S FITNESS CLUB</div>

    <div class="code-box">
      DETECTED CODE:<br>
      <span id="displayCode" style="font-size:18px;">---</span>
    </div>

    <input type="text" id="verifyInput" placeholder="ENTER 8-DIGIT CODE" maxlength="12">

    <button class="btn" onclick="verifyProduct()">VERIFY CODE</button>

    <div id="resultBox"></div>
  </div>
</div>

<!-- ADMIN EXPORT TOOLS -->
<div class="admin-export">
  <div style="font-size:11px; color:#888; margin-bottom:6px;">🖨️ स्टिकर प्रिंटिंग हेतु 2000 कोड्स डाउनलोड करें:</div>
  <button class="export-btn" onclick="downloadCategoryCodes('whey')">📥 2000 Muscle Size Whey (.txt)</button>
  <button class="export-btn" onclick="downloadCategoryCodes('gainer')">📥 2000 MG Pro Gainer (.txt)</button>
  <button class="export-btn" onclick="downloadCategoryCodes('active')">📥 2000 Active Shake (.txt)</button>
</div>

<script>
const CHARS = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";

function getCodeForIndex(prefix, index) {
  let num = (index * 9301 + 49297) % 233280;
  let part = "";
  let n = (num * 1000 + index * 37) >>> 0;
  for(let i = 0; i < 5; i++){
    part += CHARS[n % CHARS.length];
    n = Math.floor(n / CHARS.length) + (i * 7);
  }
  return prefix + part;
}

const CODE_DATABASE = {};

// 1. Muscle Size Intra Bulk 100% Whey Protein (2000 Codes: MSW.....)
for(let i = 1; i <= 2000; i++){
  let c = getCodeForIndex("MSW", i);
  CODE_DATABASE[c] = { brand: "MUSCLE SIZE INTRA BULK", product: "100% WHEY PROTEIN (908g)", cat: "Whey" };
}

// 2. MG Pro Series Power Musculs Gain Mass Gainer (2000 Codes: MGG.....)
for(let i = 1; i <= 2000; i++){
  let c = getCodeForIndex("MGG", i);
  CODE_DATABASE[c] = { brand: "MUSCUL GOLD NUTRITION", product: "PRO SERIES POWER MUSCULS GAIN & MASS GAINER", cat: "Gainer" };
}

// 3. Active Shake Protein (2000 Codes: ACT.....)
for(let i = 1; i <= 2000; i++){
  let c = getCodeForIndex("ACT", i);
  CODE_DATABASE[c] = { brand: "ACTIVE SHAKE NUTRITION", product: "ACTIVE SHAKE PROTEIN (900g)", cat: "Active" };
}

let currentCode = "";

window.onload = function(){
  const params = new URLSearchParams(window.location.search);
  const code = (params.get("code") || "").trim().toUpperCase();

  if(code && CODE_DATABASE[code]){
    currentCode = code;
    let p = CODE_DATABASE[currentCode];
    
    document.getElementById("scanBrandName").innerText = p.brand;
    document.getElementById("scanProduct").innerText = p.product;
    document.getElementById("scanCodeText").innerText = currentCode;
    document.getElementById("displayCode").innerText = currentCode;
    document.getElementById("verifyInput").value = currentCode;

    document.getElementById("portalScreen").style.display = "none";
    document.getElementById("verifiedScreen").style.display = "flex";
  } else {
    document.getElementById("portalScreen").style.display = "flex";
    document.getElementById("verifiedScreen").style.display = "none";
    if(code){
      document.getElementById("displayCode").innerText = code + " (NOT FOUND)";
      document.getElementById("verifyInput").value = code;
    }
  }
};

function openPortal(){
  document.getElementById("verifiedScreen").style.display = "none";
  document.getElementById("portalScreen").style.display = "flex";
}

function verifyProduct(){
  let enteredCode = document.getElementById("verifyInput").value.trim().toUpperCase();
  let box = document.getElementById("resultBox");

  if(!enteredCode){
    box.innerHTML = "<span style='color:#ff3333;'>कृपया कोड दर्ज करें!</span>";
    return;
  }

  if(CODE_DATABASE[enteredCode]){
    let p = CODE_DATABASE[enteredCode];
    let used = parseInt(sessionStorage.getItem("used_" + enteredCode)) || 0;

    if(used >= 2){
      box.innerHTML = `
        <div style="color:#ffcc00; background:rgba(255,204,0,0.1); padding:10px; border-radius:8px; border:1px solid #ffcc00;">
          ⚠️ कोड की अधिकतम सीमा समाप्त (Code Expired)<br>
          <small style="color:#aaa;">यह कोड पहले ही 2 बार वेरिफाई हो चुका है।</small>
        </div>
      `;
    } else {
      used++;
      sessionStorage.setItem("used_" + enteredCode, used);
      box.innerHTML = `
        <div style="color:#00ff66; background:rgba(0,255,100,0.1); padding:10px; border-radius:8px; border:1px solid #00ff66;">
          ✅ 100% ORIGINAL & VERIFIED<br>
          <span style="color:#fff; font-size:14px;">ब्रांड: ${p.brand}</span><br>
          <span style="color:#ffcc00; font-size:14px;">उत्पाद: ${p.product}</span><br>
          <small style="color:#aaa;">वेरिफिकेशन उपयोग: ${used} / 2</small>
        </div>
      `;
    }
  } else {
    box.innerHTML = `
      <div style="color:#ff3333; background:rgba(255,50,50,0.1); padding:10px; border-radius:8px; border:1px solid #ff3333;">
        ❌ अमान्य कोड (INVALID CODE)<br>
        <small style="color:#bbb;">यह कोड 5 Brother's Nutrition रिकॉर्ड में उपलब्ध नहीं है।</small>
      </div>
    `;
  }
}

function downloadCategoryCodes(type){
  let prefix = type === "whey" ? "MSW" : (type === "gainer" ? "MGG" : "ACT");
  let catName = type.toUpperCase();
  let list = [];
  
  for(let i = 1; i <= 2000; i++){
    let c = getCodeForIndex(prefix, i);
    list.push(c);
  }

  let blob = new Blob([list.join("\n")], { type: "text/plain;charset=utf-8" });
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `2000_${catName}_CODES.txt`;
  a.click();
}
</script>

</body>
</html>
