<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>5 Brother's Fitness Club</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
  body{
    background: #0a0a0a;
    color: #fff;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    text-align: center;
  }
  .splash-container{
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    animation: fadeIn 1s ease-in-out;
  }
  .crown{
    font-size: 50px;
    margin-bottom: 12px;
    animation: bounce 1.2s infinite alternate;
  }
  h1{
    color: #ffcc00;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-shadow: 0 0 15px rgba(255,204,0,0.4);
  }
  .tagline{
    color: #aaa;
    font-size: 11px;
    font-weight: 600;
    background: rgba(255,204,0,0.1);
    border: 1px solid rgba(255,204,0,0.3);
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 25px;
  }
  .loader-bar{
    width: 160px;
    height: 4px;
    background: #222;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .loader-fill{
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 0%;
    background: linear-gradient(90deg, #ffcc00, #00ff66);
    border-radius: 4px;
    animation: loadProgress 2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-8px); }
  }
  @keyframes loadProgress {
    0% { width: 0%; }
    100% { width: 100%; }
  }
</style>
</head>
<body>

<div class="splash-container">
  <div class="crown">👑🏋️‍♂️</div>
  <h1>5 BROTHER'S FITNESS CLUB</h1>
  <div class="tagline">"100% असली और असरदार रिजल्ट"</div>
  <div class="loader-bar">
    <div class="loader-fill"></div>
  </div>
</div>

<script>
  // 2 सेकंड बाद यह ऑटोमैटिक store.html पर बड़े और सही साइज़ में चला जाएगा
  setTimeout(() => {
    window.location.replace("store.html");
  }, 2000);
</script>

</body>
</html>
