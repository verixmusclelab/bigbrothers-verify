function renderCatalog() {
  const grid = document.getElementById("productGrid");
  grid.innerHTML = "";

  catalog.forEach(item => {
    let sizeOptionsHtml = item.options.map(opt => `<option value="${opt.price}">${opt.size}</option>`).join("");
    let flavourOptionsHtml = item.flavours.map(flv => `<option>${flv}</option>`).join("");
    let initialPrice = item.options[0].price;

    let card = document.createElement("div");
    card.className = "card";
    card.dataset.category = item.category;
    card.dataset.name = item.name.toLowerCase();

    card.innerHTML = `
      <img src="${item.img}" alt="${item.name}">
      <h3>${item.name}</h3>
      <p class="desc">${item.desc}</p>
      <div class="dropdown-grp">
         <select onchange="updatePrice(this)">${sizeOptionsHtml}</select>
        <select>${flavourOptionsHtml}</select>
      </div>
      <div class="price">₹${initialPrice.toLocaleString('en-IN')}</div>
      <a href="https://wa.me/919990954574" class="buy-btn buy-wa">WhatsApp Order</a>
      <a href="tel:9990954574" class="buy-btn buy-call">Call Now</a>
    `;
    grid.appendChild(card);
  });
}

function updatePrice(selectElem) {
  let card = selectElem.closest('.card');
  let priceDisplay = card.querySelector('.price');
  let selectedVal = parseInt(selectElem.value);
  priceDisplay.innerText = "₹" + selectedVal.toLocaleString('en-IN');
}

function filterCategory(category, btn) {
  let buttons = document.querySelectorAll('.menu button');
  buttons.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  let cards = document.querySelectorAll('.card');
  cards.forEach(card => {
    if(category === 'all' || card.dataset.category === category) {
      card.style.display = "flex";
    } else {
      card.style.display = "none";
    }
  });
}

function searchSupplements() {
  let input = document.getElementById('searchInput').value.toLowerCase().trim();
  let cards = document.querySelectorAll('.card');

  cards.forEach(card => {
    let name = card.dataset.name.toLowerCase();
    if(name.includes(input)) {
      card.style.display = "flex";
    } else {
      card.style.display = "none";
    }
  });
}

function verifyCode(){
  let input = document.getElementById("manualCodeInput");
  let code = input.value.trim().toUpperCase();

  if(code === ""){
    alert("Kripya code enter karein!");
    return;
  }

  let currentTime = new Date().getTime();
  let lockKey = "lock_" + code;
  let lockTime = localStorage.getItem(lockKey);

  if(lockTime && currentTime < parseInt(lockTime)){
    let secondsLeft = Math.ceil((parseInt(lockTime) - currentTime) / 1000);
    alert("Code temporarily locked hai! " + secondsLeft + " second intezar karein.");
    return;
  }

  document.getElementById("verification-overlay").style.display = "flex";

  if(products[code]){
    let countKey = "count_" + code;
    let count = parseInt(localStorage.getItem(countKey) || "0");

    if(count >= 2){
      localStorage.setItem(lockKey, currentTime + 60000);
      document.getElementById("brand-name").innerText = products[code];
      document.getElementById("verify-status").innerHTML = "ALREADY USED";
      document.getElementById("verify-msg").innerText = "Ye code pehle scan ho chuka hai (Limit 2 Exceeded)! 1 minute lock hai.";
      document.getElementById("verify-icon").innerHTML = "⚠️";
      document.getElementById("verify-status").style.color = "#ffcc00";
      document.getElementById("verify-box").style.border = "3px solid #ffcc00";
    } else {
      count++;
      localStorage.setItem(countKey, count);
      document.getElementById("brand-name").innerText = products[code];
      document.getElementById("verify-status").innerHTML = "PRODUCT VERIFIED";
      document.getElementById("verify-msg").innerText = "100% Genuine Certified (Scan " + count + "/2)";
      document.getElementById("verify-icon").innerHTML = "✅";
      document.getElementById("verify-status").style.color = "#00ff00";
      document.getElementById("verify-box").style.border = "3px solid #00ff00";
    }
  } else {
    document.getElementById("brand-name").innerText = "UNKNOWN CODE";
    document.getElementById("verify-status").innerHTML = "VERIFICATION FAILED";
    document.getElementById("verify-msg").innerText = "Invalid or Duplicate Product Code";
    document.getElementById("verify-icon").innerHTML = "❌";
    document.getElementById("verify-status").style.color = "red";
    document.getElementById("verify-box").style.border = "3px solid red";
  }

  input.value = "";
}

function closeVerifyPopup(){
  document.getElementById("verification-overlay").style.display = "none";
}

window.onload = function(){
  renderCatalog();
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  if(code){
    document.getElementById("manualCodeInput").value = code;
    verifyCode();
  }
};
