<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffcc00">
<meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Brothers Fitness & Supplements</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; scroll-behavior:smooth; }
body { background:#0d0d0d; color:white; padding-bottom:70px; }

.top-strip { background:#111; border-bottom:2px solid #ffcc00; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:9999; }
.top-strip a { background:#ffcc00; color:#000; text-decoration:none; font-weight:bold; font-size:12px; padding:6px 12px; border-radius:6px; }
.top-strip span { color:#ffcc00; font-size:12px; font-weight:bold; }

header { background:black; padding:16px 20px; border-bottom:3px solid #ffcc00; position:sticky; top:42px; z-index:998; }
.topbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; max-width:1350px; margin:auto; }
.logo h1 { color:#ffcc00; font-size:22px; font-weight:900; }
.logo p { font-size:12px; color:#ccc; }
.head-btns { display:flex; align-items:center; gap:8px; }
.call-btn, .whatsapp-btn, .cart-top-btn { padding:9px 13px; border-radius:8px; text-decoration:none; font-weight:bold; font-size:13px; border:none; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.call-btn { background:#ffcc00; color:black; }
.whatsapp-btn { background:#25D366; color:white; }
.cart-top-btn { background:#007bff; color:white; }
.cart-badge { background:#ff3333; color:white; font-size:11px; padding:2px 7px; border-radius:20px; font-weight:bold; }

.menu { display:flex; gap:10px; overflow-x:auto; padding:12px 20px; background:#111; position:sticky; top:112px; z-index:997; }
.menu button { border:none; background:#1e1e1e; color:white; padding:9px 16px; border-radius:30px; font-weight:bold; cursor:pointer; white-space:nowrap; font-size:13px; }
.menu button.active, .menu button:hover { background:#ffcc00; color:black; }

.hero { padding:24px 20px 10px; text-align:center; }
.hero h2 { font-size:26px; color:#ffcc00; margin-bottom:6px; font-weight:900; }
.hero p { color:#bbb; margin-bottom:14px; font-size:13px; }
.search-box { max-width:550px; margin:auto; }
.search-box input { width:100%; padding:12px 16px; border:2px solid #333; border-radius:12px; font-size:14px; background:#181818; color:white; outline:none; }
.search-box input:focus { border-color:#ffcc00; }

.section-title { text-align:center; font-size:22px; margin:18px 0 10px; color:#ffcc00; font-weight:800; }
.product-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; padding:16px; max-width:1350px; margin:auto; }
.card { background:#141414; border-radius:16px; padding:15px; text-align:center; border:1px solid #292929; display:flex; flex-direction:column; justify-content:space-between; position:relative; }
.img-container { width:100%; height:190px; background:#fff; border-radius:10px; margin-bottom:12px; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:6px; }
.card img { max-width:100%; max-height:100%; object-fit:contain; }
.card h3 { font-size:15px; margin-bottom:4px; color:#fff; line-height:1.3; font-weight:800; }
.card p.desc { font-size:12px; color:#aaa; margin-bottom:10px; }

.product-info-btn { display:block; width:100%; padding:9px; margin:4px 0 10px; border:1px solid #ffcc00; border-radius:8px; background:#222; color:#ffcc00; font-size:13px; font-weight:bold; cursor:pointer; }
.dropdown-grp { display:flex; gap:8px; margin-bottom:10px; }
.dropdown-grp select { width:50%; padding:7px 5px; background:#222; color:#ffcc00; border:1px solid #444; border-radius:6px; font-size:12px; font-weight:bold; outline:none; }

.price-container { margin-bottom:10px; }
.mrp-cut { font-size:12px; color:#888; text-decoration:line-through; margin-right:6px; }
.price { font-size:22px; font-weight:900; color:#ffcc00; }
.save-badge { display:inline-block; background:rgba(0,255,102,0.15); color:#00ff66; border:1px solid #00ff66; border-radius:4px; font-size:11px; font-weight:800; padding:2px 6px; margin-top:4px; }

.buy-btn { display:block; padding:10px; border-radius:8px; margin:4px 0; font-weight:bold; text-decoration:none; border:none; cursor:pointer; font-size:13px; text-align:center; }
.buy-cart { background:#007bff; color:white; }
.buy-wa { background:#25D366; color:white; }
.buy-call { background:#ffcc00; color:black; }

.modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.88); z-index:99999; justify-content:center; align-items:center; padding:15px; backdrop-filter:blur(4px); }
.modal-box { background:#181818; border:2px solid #ffcc00; border-radius:16px; max-width:480px; width:100%; padding:18px; color:white; max-height:92vh; overflow-y:auto; position:relative; }
.modal-close-btn { position:absolute; right:14px; top:12px; background:none; border:none; color:#aaa; font-size:26px; cursor:pointer; }

.verify-section { padding:24px 16px; text-align:center; background:#111; margin:24px 16px; border-radius:16px; border:2px solid #ffcc00; max-width:550px; margin-inline:auto; }
.verify-section input { padding:10px; width:85%; max-width:320px; border:none; border-radius:8px; font-size:14px; margin-top:10px; outline:none; }
.verify-section button { padding:10px 20px; background:#ffcc00; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:10px; color:black; }
</style>
</head>
<body>

<div class="top-strip">
  <a href="./home.html">⬅️ मुख्य मेनू (Home)</a>
  <span>5BFC SUPPLEMENT STORE</span>
</div>

<header>
<div class="topbar">
  <div class="logo">
    <h1>Big Brothers Fitness</h1>
    <p>100% Authentic Supplements</p>
  </div>
  <div class="head-btns">
    <button onclick="openCart()" class="cart-top-btn">🛒 Cart <span id="cartCountBadge" class="cart-badge">0</span></button>
    <a href="tel:9990954574" class="call-btn">📞 Call</a>
    <a href="https://wa.me/919990954574" class="whatsapp-btn">WhatsApp</a>
  </div>
</div>
</header>

<div class="menu" id="catMenu">
  <button class="active" onclick="filterCat('all', this)">All</button>
  <button onclick="filterCat('whey', this)">Whey Protein</button>
  <button onclick="filterCat('gainer', this)">Mass Gainer</button>
  <button onclick="filterCat('creatine', this)">Creatine</button>
  <button onclick="filterCat('multivitamin', this)">Multivitamin</button>
</div>

<section class="hero">
  <h2>100% Authentic Store</h2>
  <p>Select Weight & Flavour for Live Prices</p>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search brands, products..." onkeyup="searchProducts()">
  </div>
</section>

<h2 class="section-title">🔥 Featured Catalog</h2>
<div class="product-grid" id="productGrid"></div>

<!-- VERIFY SECTION -->
<section class="verify-section">
  <h2 style="color:#ffcc00; font-size:24px;">Verify Product</h2>
  <p style="color:#aaa; font-size:13px; margin-top:4px;">Original Scan Authenticity Check</p>
  <input id="manualCodeInput" placeholder="Enter Product Code">
  <br>
  <button onclick="verifyCode()">Verify Product</button>
</section>

<!-- POPUP FOR QR VERIFICATION -->
<div class="modal-overlay" id="verification-overlay">
  <div style="background:#141414; max-width:400px; width:100%; padding:24px; border-radius:20px; border:2px solid #ffcc00; text-align:center;">
    <div id="verify-content"></div>
    <button onclick="document.getElementById('verification-overlay').style.display='none'" class="buy-btn buy-call" style="margin-top:16px; width:100%;">Close</button>
  </div>
</div>

<script>
// QR Code Database
const products = {
  "LBR-W701A":"LABRADA WHEY PROTEIN", "LBR-W702B":"LABRADA WHEY PROTEIN", "LBR-W703C":"LABRADA WHEY PROTEIN",
  "ULT-W501A":"ULTIMATE WHEY PROTEIN", "ULT-W502B":"ULTIMATE WHEY PROTEIN", "ULT-W503C":"ULTIMATE WHEY PROTEIN",
  "ON-G801X":"OPTIMUM NUTRITION", "ON-G802Y":"OPTIMUM NUTRITION", "ON-G803Z":"OPTIMUM NUTRITION",
  "GNC-C901M":"GNC CREATINE", "GNC-C902N":"GNC CREATINE", "GNC-C903P":"GNC CREATINE",
  "MUL-V201A":"GNC MULTIVITAMIN", "MUL-V202B":"GNC MULTIVITAMIN", "MUL-V203C":"GNC MULTIVITAMIN",
  "LMG-G401M":"LABRADA MASS GAINER", "LMG-G402N":"LABRADA MASS GAINER", "LMG-G403P":"LABRADA MASS GAINER",
  "FIS-O301X":"MUSCLEBLAZE FISH OIL", "FIS-O302Y":"MUSCLEBLAZE FISH OIL", "FIS-O310G":"MUSCLEBLAZE FISH OIL",
  "LBR7F29K":"LABRADA NUTRITION", "ON84P2X":"OPTIMUM NUTRITION", "GNC3M78B":"GNC"
};

const productBrandData = {
  "LBR": { brand: "LABRADA NUTRITION (USA)", img: "https://i.ibb.co/ynbr1YCw/download-1.webp", seal: "OFFICIAL IMPORTED SEAL • 100% GENUINE" },
  "ON": { brand: "OPTIMUM NUTRITION (GLANBIA)", img: "https://i.ibb.co/Psd0wvRZ/1118910-1-af26fc31-6747-4679-8e5f-00dc04b9aecd.jpg", seal: "TRUE STRENGTH CERTIFIED" },
  "GNC": { brand: "GNC LIVE WELL (USA)", img: "https://i.ibb.co/kjbvcn2/download-17.webp", seal: "100% PURE PHARMA GRADE" }
};

const catalog = [
  { category: "whey", name: "Labrada 100% Whey Protein", desc: "24g Protein • 5.2g BCAA", img: "https://i.ibb.co/ynbr1YCw/download-1.webp", flavours: ["Chocolate", "Vanilla"], options: [{ size: "1 Kg", price: 3199 }, { size: "2 Kg", price: 5999 }] },
  { category: "whey", name: "ON Gold Standard 100% Whey", desc: "24g Isolate Blend • 5.5g BCAA", img: "https://i.ibb.co/Psd0wvRZ/1118910-1-af26fc31-6747-4679-8e5f-00dc04b9aecd.jpg", flavours: ["Double Rich Chocolate"], options: [{ size: "907 Gram", price: 3299 }, { size: "2.27 Kg", price: 6499 }] },
  { category: "gainer", name: "Labrada Muscle Mass Gainer", desc: "52g Protein • 1260 Calories", img: "https://i.ibb.co/ccv7zKnP/download-7.webp", flavours: ["Chocolate"], options: [{ size: "1 Kg", price: 1499 }, { size: "3 Kg", price: 2999 }] },
  { category: "creatine", name: "Wellcore Pure Micronised Creatine", desc: "100% Pure Pharma Grade", img: "https://i.ibb.co/BxSkC0Q/download-16.webp", flavours: ["Unflavoured"], options: [{ size: "100 Gram", price: 450 }, { size: "250 Gram", price: 950 }] }
];

function renderCatalog() {
  const grid = document.getElementById("productGrid");
  if (!grid) return;
  grid.innerHTML = catalog.map((item, index) => `
    <div class="card">
      <div class="img-container">
        <img src="${item.img}" alt="${item.name}">
      </div>
      <h3>${item.name}</h3>
      <p class="desc">${item.desc}</p>
      <div class="price">₹${item.options[0].price}</div>
      <a href="https://wa.me/919990954574?text=Order%20${encodeURIComponent(item.name)}" class="buy-btn buy-wa">WhatsApp Order</a>
    </div>
  `).join('');
}

function verifyCode(directCode) {
  let code = (directCode || document.getElementById("manualCodeInput").value || "").trim().toUpperCase();
  if (!code) return;

  let prefix = code.split("-")[0] || code.substring(0, 3);
  let brand = products[code] || "100% AUTHENTIC PRODUCT";
  let bData = productBrandData[prefix] || { brand: "BIG BROTHERS FITNESS", img: "https://i.ibb.co/ynbr1YCw/download-1.webp", seal: "100% GENUINE SEAL" };

  document.getElementById("verify-content").innerHTML = `
    <div style="font-size:45px; margin-bottom:8px;">✅</div>
    <div style="display:inline-block; background:#00ff66; color:#000; font-size:11px; font-weight:900; padding:4px 10px; border-radius:20px; margin-bottom:12px;">OFFICIAL AUTHENTICITY CERTIFICATE</div>
    <div style="width:100px; height:100px; margin:0 auto 10px; background:#fff; border-radius:10px; padding:6px; display:flex; align-items:center; justify-content:center;">
      <img src="${bData.img}" style="max-height:100%; max-width:100%; object-fit:contain;">
    </div>
    <h3 style="color:#ffcc00; font-size:14px;">${bData.brand}</h3>
    <h2 style="font-size:18px; margin:4px 0 10px; color:#fff;">${brand}</h2>
    <div style="background:rgba(255,255,255,0.06); border:1px solid #333; border-radius:8px; padding:10px; text-align:left; font-size:12px; line-height:1.6;">
      <div><strong>Code:</strong> <span style="color:#00ff66;">${code}</span></div>
      <div><strong>Status:</strong> <span style="color:#00ff66;">100% Original Verified</span></div>
      <div><strong>Batch:</strong> ${bData.seal}</div>
    </div>
  `;
  document.getElementById("verification-overlay").style.display = "flex";
}

// Auto verify on QR Scan
window.addEventListener('DOMContentLoaded', () => {
  renderCatalog();
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');
  if (code) {
    verifyCode(code);
  }
});
</script>
</body>
</html>
