<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5 Brothers Nutrition Store</title>
  <style>
    :root {
      --primary: #f59e0b;
      --dark: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #22c55e;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--dark);
      color: var(--text);
      padding-bottom: 90px;
    }
    header {
      background: #020617;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .brand-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar {
      display: none;
    }
    .cat-btn {
      white-space: nowrap;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .cat-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
      font-weight: 700;
    }
    main {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .card-img-wrap {
      width: 100%;
      height: 220px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .card-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #dc2626;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .card-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 10px;
    }
    .brand-name {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--primary);
    }
    .product-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .rating-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .rating-pill {
      background: #064e3b;
      color: #34d399;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .variant-selector {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .variant-pill {
      padding: 5px 9px;
      border: 1px solid var(--border);
      background: #0f172a;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--text-muted);
    }
    .variant-pill.active {
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
      background: #78350f33;
    }
    .price-box {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: auto;
      padding-top: 8px;
    }
    .current-price {
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
    }
    .mrp-price {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }
    .servings-tag {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
    }
    .buy-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 8px;
    }
    /* Checkout Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .modal-box input, .modal-box textarea {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }
    .order-action-btn {
      padding: 12px;
      background: #25d366;
      color: #000;
      font-weight: 800;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .close-modal-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="brand-title">5 Brothers Nutrition Store</div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search protein, Big Daddy, creatine, brands...">
      </div>
      <div class="categories" id="catList">
        <button class="cat-btn active" data-category="ALL">All Products</button>
        <button class="cat-btn" data-category="Whey Protein">Whey Protein</button>
        <button class="cat-btn" data-category="Pre-Workout">Pre-Workout</button>
        <button class="cat-btn" data-category="Creatine">Creatine</button>
        <button class="cat-btn" data-category="Mass Gainer">Mass Gainer</button>
        <button class="cat-btn" data-category="Peanut Butter">Peanut Butter</button>
        <button class="cat-btn" data-category="BCAA & Amino">BCAA & Amino</button>
        <button class="cat-btn" data-category="Ayurvedic & Wellness">Ayurvedic</button>
        <button class="cat-btn" data-category="Multivitamin">Multivitamin</button>
        <button class="cat-btn" data-category="Fish Oil">Fish Oil</button>
      </div>
    </div>
  </header>

  <main>
    <div class="grid" id="productGrid">
      <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
        Loading products catalog...
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-box">
      <div class="modal-title" id="orderModalTitle">Confirm Order</div>
      <div id="orderModalSummary" style="font-size: 0.85rem; color: var(--text-muted);"></div>
      <input type="text" id="custName" placeholder="Aapka Naam">
      <input type="tel" id="custPhone" placeholder="Mobile / WhatsApp Number">
      <textarea id="custAddress" rows="2" placeholder="Complete Delivery Address"></textarea>
      <div style="font-size: 0.85rem; color: #f59e0b; background: #020617; padding: 8px; border-radius: 6px; text-align: center;">
        Payment UPI ID: <strong>9990954574@nyes</strong>
      </div>
      <button class="order-action-btn" onclick="sendWhatsAppOrder()">Direct Order on WhatsApp</button>
      <button class="close-modal-btn" onclick="closeModal()">Band Karein</button>
    </div>
  </div>

  <script>
    let allProducts = [];
    let selectedVariants = {};
    let activeCategory = 'ALL';
    let currentOrderItem = null;

    async function loadCatalog() {
      try {
        // Cache bust query string added (?t=...) to avoid stale browser cache
        const res = await fetch('products.json?t=' + Date.now());
        if (!res.ok) throw new Error('Network status: ' + res.status);
        allProducts = await res.json();
        renderProducts();
      } catch (err) {
        document.getElementById('productGrid').innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 40px;">
            products.json load nahi ho saki: ${err.message}.
          </div>
        `;
      }
    }

    function renderProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const grid = document.getElementById('productGrid');

      const filtered = allProducts.filter(item => {
        const matchCat = activeCategory === 'ALL' || item.category === activeCategory;
        const matchText = (item.name || '').toLowerCase().includes(query) || (item.brand || '').toLowerCase().includes(query);
        return matchCat && matchText;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">Koi product nahi mila.</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => {
        if (!selectedVariants[item.id]) {
          selectedVariants[item.id] = 0;
        }
        const activeVIdx = selectedVariants[item.id];
        const v = (item.variants && item.variants[activeVIdx]) ? item.variants[activeVIdx] : (item.variants ? item.variants[0] : {});

        return `
          <div class="card">
            ${item.badge ? `<div class="badge">${item.badge}</div>` : ''}
            <div class="card-img-wrap">
              <img src="${item.image}" alt="${item.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/200?text=Supplement'">
            </div>
            <div class="card-content">
              <div class="brand-name">${item.brand || ''}</div>
              <div class="product-title">${item.name || ''}</div>
              <div class="rating-row">
                <span class="rating-pill">★ ${item.rating || '4.5'}</span>
                <span>(${item.rating_count || '10K+'})</span>
              </div>
              <div class="variant-selector">
                ${(item.variants || []).map((variant, idx) => `
                  <button class="variant-pill ${idx === activeVIdx ? 'active' : ''}" onclick="selectVariant(${item.id},${idx})">
                    ${variant.pack}
                  </button>
                `).join('')}
              </div>
              <div class="price-box">
                <span class="current-price">₹${v.price || ''}</span>
                <span class="mrp-price">₹${v.mrp || ''}</span>
                <span class="servings-tag">${v.servings || ''}</span>
              </div>
              <button class="buy-btn" onclick="openModal(${item.id})">Order Now</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectVariant(prodId, varIdx) {
      selectedVariants[prodId] = varIdx;
      renderProducts();
    }

    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.getAttribute('data-category');
        renderProducts();
      });
    });

    document.getElementById('searchInput').addEventListener('input', renderProducts);

    function openModal(prodId) {
      const prod = allProducts.find(p => p.id === prodId);
      const v = prod.variants[selectedVariants[prodId] || 0];
      currentOrderItem = { prod, variant: v };

      document.getElementById('orderModalTitle').innerText = prod.name;
      document.getElementById('orderModalSummary').innerText = `Pack: ${v.pack} | Price: ₹${v.price} (MRP: ₹${v.mrp})`;
      document.getElementById('checkoutModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('checkoutModal').style.display = 'none';
    }

    function sendWhatsAppOrder() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();

      if (!name || !phone || !address) {
        alert('Kripya apna naam, mobile number aur address dalein.');
        return;
      }

      const msg = `*New Supplement Order*%0A%0A` +
        `*Product:* ${currentOrderItem.prod.name}%0A` +
        `*Brand:* ${currentOrderItem.prod.brand}%0A` +
        `*Pack Size:* ${currentOrderItem.variant.pack}%0A` +
        `*Final Price:* ₹${currentOrderItem.variant.price}%0A%0A` +
        `*Customer Details:*%0A` +
        `Name: ${name}%0A` +
        `Phone: ${phone}%0A` +
        `Address: ${address}%0A%0A` +
        `*UPI ID for Payment:* 9990954574@nyes`;

      window.open(`https://wa.me/919990954574?text=${msg}`, '_blank');
      closeModal();
    }

    loadCatalog();
  </script>
</body>
        </html>
