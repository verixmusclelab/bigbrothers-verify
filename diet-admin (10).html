<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Diet Admin · Dietician Xpert</title>
<script src="auth-gate.js" data-mode="ondemand"></script>
<style>
:root{--y:#ffd60a;--bg:#0b0b0b;--c:#1a1a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:12px;padding-bottom:40px;background:var(--bg);color:#fff;font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;min-height:100vh}
.h{border:2px solid var(--y);background:linear-gradient(145deg,#2a2200,#141414);border-radius:14px;text-align:center;padding:16px;margin-bottom:12px}
.h .brand{color:var(--y);font-weight:900;font-size:18px}
.h small{display:block;color:#ccc;font-size:11px;margin-top:4px}
.c{background:var(--c);border:1.5px solid #3a3a3a;border-radius:14px;padding:16px;margin-bottom:12px}
h3{margin:0 0 10px;color:var(--y);font-size:17px}
.m{font-size:13px;color:#bbb;margin:10px 0 4px;font-weight:600}
.bi{font-size:12px;color:#999;line-height:1.5}
input,select{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:1.5px solid #555;background:#0d0d0d;color:#fff;font-size:16px}
button,.b{display:block;width:100%;text-align:center;text-decoration:none;color:#000;background:linear-gradient(135deg,#ffd60a,#e6b800);font-weight:900;border:0;border-radius:12px;padding:14px;margin-top:10px;font-size:15px;min-height:48px;cursor:pointer}
.g{background:#2a2a2a;color:#eee;border:1.5px solid #555}
.r{display:flex;gap:8px;flex-wrap:wrap}.r>*{flex:1;min-width:30%}
.card{background:#0d0d0d;border:1.5px solid #444;border-radius:14px;padding:14px;margin:12px 0}
.card h4{margin:0 0 8px;color:var(--y);font-size:16px}
.badge{display:inline-block;font-weight:900;font-size:11px;padding:4px 10px;border-radius:20px;color:#000}
.badge.ok{background:#3ddc84}.badge.pend{background:#ff9800}
.mem{background:#111;padding:10px;border-radius:10px;margin:8px 0;font-size:13px;line-height:1.5;border:1px solid #333}
.spinner{border:4px solid #333;border-top:4px solid var(--y);border-radius:50%;width:36px;height:36px;animation:spin 1s linear infinite;margin:16px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.hid{display:none!important}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:12px;font-size:13px}
.tabs button.active{border:2px solid var(--y);background:#2a2200;color:var(--y)}
</style>
</head>
<body>
<div class="h">
  <div class="brand">DIETICIAN XPERT · ADMIN</div>
  <small>Diet Orders · Full form history</small>
</div>

<div id="lock" class="c">
  <h3>🔒 Admin Access</h3>
  <div class="bi" style="margin-bottom:6px">सिर्फ़ Admin (Email + Password)</div>
  <button type="button" onclick="unlock()">🔐 Admin Login</button>
</div>

<div id="panel" class="hid">
  <div class="c">
    <div class="tabs">
      <button type="button" class="g active" id="tabAll" onclick="setTab('all')">All</button>
      <button type="button" class="g" id="tabPend" onclick="setTab('pending')">Pending</button>
      <button type="button" class="g" id="tabOk" onclick="setTab('approved')">Approved</button>
    </div>
    <input id="q" placeholder="Search name / mobile / UTR / order id" oninput="render()">
    <button type="button" onclick="load()">🔄 Refresh</button>
    <div class="bi" id="stats" style="margin-top:8px"></div>
  </div>
  <div id="list"></div>
  <div class="c"><button class="g" type="button" onclick="lockAgain()">Lock</button></div>
</div>

<div id="detail" class="hid"></div>

<script>
const EXPERT_WA="9140417259";
const $=id=>document.getElementById(id);
let ROWS=[], TAB="all";

var _db;
function DB(){
  return _db||(_db=(async()=>{
    const L=u=>new Promise((r,e)=>{const s=document.createElement("script");s.src=u;s.onload=r;s.onerror=e;document.head.appendChild(s);});
    await L("https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js");
    await L("https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js");
    await L("https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js");
    if(!firebase.apps.length) firebase.initializeApp({apiKey:"AIzaSyA9z1gXZDB3W0lJxyHV9x2vWeb0Ees7z-g",authDomain:"brother-s-fitness-club.firebaseapp.com",projectId:"brother-s-fitness-club",storageBucket:"brother-s-fitness-club.firebasestorage.app",messagingSenderId:"781489019006",appId:"1:781489019006:web:4a230698f2195e7208202f"});
    return firebase.firestore();
  })());
}

async function unlock(){
  try{ await DB(); }catch(e){ return alert("Internet check karein"); }
  if(typeof bfcLogin!=="function") return alert("auth-gate.js missing — upload karein");
  if(!(await bfcLogin())) return;
  $("lock").classList.add("hid");
  $("panel").classList.remove("hid");
  load();
}
function lockAgain(){
  $("panel").classList.add("hid");
  $("detail").classList.add("hid");
  $("lock").classList.remove("hid");
  try{ if(typeof bfcLogout==="function") bfcLogout(); }catch(e){}
}
function setTab(t){
  TAB=t;
  ["tabAll","tabPend","tabOk"].forEach(id=>$ (id).classList.remove("active"));
  $(t==="all"?"tabAll":t==="pending"?"tabPend":"tabOk").classList.add("active");
  render();
}

async function load(){
  $("list").innerHTML='<div class="spinner"></div>';
  try{
    const db=await DB();
    let snap;
    try{ snap=await db.collection("diet_orders").orderBy("t","desc").limit(80).get(); }
    catch(e){ snap=await db.collection("diet_orders").limit(80).get(); }
    ROWS=[];
    snap.forEach(doc=>{ const o=doc.data()||{}; o._id=doc.id; ROWS.push(o); });
    ROWS.sort((a,b)=>(b.t||0)-(a.t||0));
    const pend=ROWS.filter(x=>(x.status||"pending")==="pending").length;
    const ok=ROWS.filter(x=>x.status==="approved").length;
    $("stats").textContent="Total: "+ROWS.length+" · Pending: "+pend+" · Approved: "+ok;
    render();
  }catch(e){
    $("list").innerHTML='<div class="c"><div class="m">Load failed</div><button type="button" onclick="load()">Retry</button></div>';
  }
}

function render(){
  const q=($("q").value||"").toLowerCase().trim();
  let rows=ROWS.slice();
  if(TAB==="pending") rows=rows.filter(o=>(o.status||"pending")==="pending");
  if(TAB==="approved") rows=rows.filter(o=>o.status==="approved");
  if(q) rows=rows.filter(o=>{
    const blob=((o.n||"")+" "+(o.mb||"")+" "+(o.utr||"")+" "+(o._id||"")+" "+(o.orderId||"")+" "+(o.receiptText||"")).toLowerCase();
    return blob.indexOf(q)>=0;
  });
  if(!rows.length){ $("list").innerHTML='<div class="c"><div class="m">No orders</div></div>'; return; }
  $("list").innerHTML=rows.map(card).join("");
}

function card(o){
  const id=o._id||o.orderId||"";
  const st=o.status||"pending";
  const when=o.createdAt||(o.t?new Date(o.t).toLocaleString("en-IN"):"—");
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <h4>${esc(o.n)||"—"}</h4>
      <span class="badge ${st==="approved"?"ok":"pend"}">${st.toUpperCase()}</span>
    </div>
    <div class="bi">
      ${esc(o.mb)} · ${o.days||"—"} days · ₹${o.price||"—"} · UTR ${esc(o.utr)||"—"}<br>
      Members: ${esc((o.members||[]).join(", "))||"—"} · ${when}
    </div>
    <div class="r">
      <button type="button" onclick="openDetail('${id}')">📋 Full form</button>
      ${st!=="approved"?`<button type="button" onclick="approve('${id}')">✅ Approve</button>`:""}
      <button class="g" type="button" onclick="delOrder('${id}')">🗑️</button>
    </div>
  </div>`;
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

function openDetail(id){
  const o=ROWS.find(x=>(x._id||x.orderId)===id);
  if(!o) return alert("Not found");
  const when=o.createdAt||(o.t?new Date(o.t).toLocaleString("en-IN"):"—");
  const persons=o.persons||{};
  let memHtml="";
  (o.members||Object.keys(persons)).forEach(m=>{
    const p=persons[m]||{};
    const nm=m==="Self"?(o.n||"Self"):(p.name||m);
    memHtml+=`<div class="mem">
      <b style="color:var(--y)">${esc(nm)} (${esc(m)})</b><br>
      Age: ${p.age||"—"} · Weight: ${p.wt||"—"} kg · Height: ${p.ft||"—"} ft ${p.inc||0} in · BMI: ${p.bmi||"—"}<br>
      Gym: ${p.gym?("Haan · "+(p.gymDays||"?")+" days/week"):"Nahi"}<br>
      Habits — Cig/day: ${p.cig||0} · Alcohol/month: ${p.alc||0} · Gutkha: ${p.gutkha||0} · Paan: ${p.paan||0} · Tea: ${p.tea||0}
    </div>`;
  });
  const waCust=o.mb?`https://wa.me/91${String(o.mb).replace(/\D/g,"").slice(-10)}?text=${encodeURIComponent("Namaste "+(o.n||"")+", aapka Dietician Xpert diet plan ready hai.\\nOrder: "+id+"\\nPlan: "+(o.days||"")+" days")}`:"";
  const waExpert=`https://wa.me/91${EXPERT_WA}?text=${encodeURIComponent("Diet order "+id+"\\n"+(o.n||"")+" "+(o.mb||"")+"\\nUTR "+(o.utr||"")+"\\nRs "+(o.price||""))}`;

  $("panel").classList.add("hid");
  $("detail").classList.remove("hid");
  $("detail").innerHTML=`
    <div class="c">
      <h3>📋 Admission-style form data</h3>
      <div class="bi" style="line-height:1.65;font-size:13px;color:#ddd">
        <b>Payer name:</b> ${esc(o.n)}<br>
        <b>Mobile:</b> ${esc(o.mb)}<br>
        <b>Order ID:</b> ${esc(id)}<br>
        <b>Date / time:</b> ${esc(when)}<br>
        <b>Status:</b> ${esc(o.status||"pending")}<br>
        <b>Plan duration:</b> ${o.days||"—"} days<br>
        <b>Amount:</b> ₹${o.price||"—"} (base ₹${o.priceBase||"—"} × ${o.personCount||(o.members||[]).length||1})<br>
        <b>UTR:</b> ${esc(o.utr)}<br>
        <b>Diet type:</b> ${o.diet==="v"?"Vegetarian":"Non-Vegetarian"}<br>
        <b>Goal:</b> ${esc(o.goal)}<br>
        <b>Payer gender:</b> ${o.gender==="F"?"Female":"Male"}<br>
        <b>Medical:</b> ${o.hasDisease?esc(o.disease||"Yes"):"None reported"}${o.medicine?" · Med: "+esc(o.medicine):""}<br>
        <b>Pregnant:</b> ${esc(o.pregnant||"—")}<br>
        <b>Members selected:</b> ${esc((o.members||[]).join(", "))}<br>
        <b>Receipt line:</b> ${esc(o.receiptText||"—")}
      </div>
      <div class="m">Har member ki details</div>
      ${memHtml||"<div class='bi'>No member breakdown saved</div>"}
      ${o.ss?`<div class="m">Payment screenshot</div><img src="${o.ss}" style="width:100%;border-radius:12px;border:1px solid #444" alt="screenshot">`: "<div class='bi'>No screenshot stored</div>"}
      <div class="r">
        ${(o.status||"")!=="approved"?`<button type="button" onclick="approve('${id}')">✅ Approve</button>`:""}
        ${waCust?`<a class="b" href="${waCust}">WhatsApp customer</a>`:""}
        <a class="b" href="${waExpert}">WhatsApp expert</a>
        <button class="g" type="button" onclick="delOrder('${id}')">🗑️ Delete</button>
      </div>
      <button class="g" type="button" onclick="backList()">← Back to list</button>
    </div>`;
}

function backList(){
  $("detail").classList.add("hid");
  $("panel").classList.remove("hid");
  render();
}

async function approve(id){
  try{
    const db=await DB();
    await db.collection("diet_orders").doc(id).update({status:"approved",approvedAt:Date.now()});
    const row=ROWS.find(x=>(x._id||x.orderId)===id);
    if(row) row.status="approved";
    alert("Approved");
    if(!$("detail").classList.contains("hid")) openDetail(id);
    else render();
  }catch(e){ alert("Approve failed"); }
}

async function delOrder(id){
  if(!confirm("Delete this order permanently?")) return;
  try{
    const db=await DB();
    await db.collection("diet_orders").doc(id).delete();
    ROWS=ROWS.filter(x=>(x._id||x.orderId)!==id);
    backList();
    render();
  }catch(e){ alert("Delete failed"); }
}
</script>
</body>
</html>
