<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Staff Records</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="gym-scope.js"></script>
<script src="tenant-access.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,sans-serif}
body{background:#070707;color:#fff;max-width:560px;margin:0 auto;padding:12px 10px 40px}
h2{color:#ffcc00;margin:6px 0 10px;font-size:18px}
input,select{width:100%;background:#000;border:1.5px solid #444;color:#fff;padding:10px;border-radius:8px;font-size:13px;margin:4px 0}
label{font-size:11px;color:#bbb;font-weight:700}
.b{background:#ffcc00;color:#000;border:none;padding:10px 12px;border-radius:8px;font-weight:900;font-size:12px;cursor:pointer}
.b.g{background:#1c1c1c;color:#ffcc00;border:1px solid #ffcc00}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.item{background:#121212;border:1px solid #2a2a2a;border-radius:12px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center;cursor:pointer}
.item img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#222}
.item small{color:#aaa;display:block;font-size:11px}
#detail{background:#fff;color:#111;border-radius:10px;padding:14px;font-size:13px;line-height:1.6}
#detail h3{color:#b8860b;border-bottom:2px solid #ffcc00;padding-bottom:4px;margin:12px 0 6px;font-size:14px}
#detail table{width:100%;border-collapse:collapse}#detail td{padding:3px 4px;border-bottom:1px solid #eee;vertical-align:top}#detail td:first-child{color:#666;width:42%}
.docs{display:flex;flex-wrap:wrap;gap:8px}.docs figure{width:48%}.docs img{width:100%;border:1px solid #ccc;border-radius:6px}.docs figcaption{font-size:11px;color:#555}
#m{text-align:center;font-size:12px;font-weight:700;min-height:16px;margin:8px 0}.hide{display:none}.mut{color:#888;text-align:center;padding:14px;font-size:13px}
</style></head><body>
<h2>👥 Staff Records</h2>
<div class="row"><button class="b g" onclick="location.href='dashboard.html'">⬅ Dashboard</button><button class="b" onclick="location.href='staff-join.html'">➕ Naya Joining</button></div>
<div id="m"></div>
<div id="listBox"><input id="q" placeholder="Naam ya mobile number likho..." oninput="renderList()"><div id="list"><div class="mut">Loading...</div></div></div>
<div id="viewBox" class="hide">
 <div class="row"><button class="b g" onclick="back()">⬅ List</button><button class="b" onclick="editMode()">✏️ Edit</button><button class="b" onclick="dl()">⬇️ PDF Download</button></div>
 <div id="detail"></div>
</div>
<div id="editBox" class="hide"></div>
<script>
const CFG={apiKey:"AIzaSyAHEMISEIDSzZz-m2OQT5EPyhTRF-mXqjQ",authDomain:"bfc-gym-215ae.firebaseapp.com",projectId:"bfc-gym-215ae",storageBucket:"bfc-gym-215ae.firebasestorage.app",messagingSenderId:"886920088571",appId:"1:886920088571:web:c4bc478d246a2700b0d95e"};
firebase.initializeApp(CFG);const auth=firebase.auth(),db=bfcScope(firebase.firestore());
const $=id=>document.getElementById(id),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function msg(t,ok){$("m").textContent=t||"";$("m").style.color=ok?"#00ff66":"#ff6666"}
let ST=[],CUR=null,DOCS={},NEWDOC={};
const KIND={photo:"Photo",govFront:"Gov ID (Front)",govBack:"Gov ID (Back)",qual1:"Qualification 1",qual2:"Qualification 2"};
auth.onAuthStateChanged(u=>{ if(!u) location.replace("login.html"); });
async function loadStaffForVerifiedSession(){
 const sec=window.omSecureSession||{};const actRole=String(sec.role||"").toLowerCase();
 if(!sec.uid||!sec.gymId||!["owner","manager","developer"].includes(actRole)){
  alert("Staff Records ka access sirf Gym Owner, Manager aur Master Admin ko hai.");return location.replace("index.html");
 }
 try{
  let q=db.collection("staff");
  if(!sec.isMasterAdmin)q=q.where("gymId","==",String(sec.gymId));
  if(actRole==="manager"&&sec.branchId)q=q.where("branchId","==",String(sec.branchId));
  const snap=await q.get();ST=snap.docs.map(d=>({_id:d.id,...d.data()})).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));renderList();
 }catch(e){$("list").innerHTML='<div class="mut">Load nahi hua ('+esc(e.code||e.message)+'). Rules / Plan check karein.</div>';}
}
window.addEventListener("om:session-ready",loadStaffForVerifiedSession,{once:true});

function renderList(){
 const q=$("q").value.trim().toLowerCase(),L=ST.filter(x=>!q||String(x.name).toLowerCase().includes(q)||String(x.phone).includes(q));
 $("list").innerHTML=L.length?L.map(x=>'<div class="item" onclick="openRec(\''+x._id+'\')"><img id="th_'+x._id+'"><div><b>'+esc(x.name)+'</b><small>'+esc(x.post||x.role)+' • '+esc(x.branch||"")+'</small><small>📞 '+esc(x.phone)+'</small></div></div>').join(""):'<div class="mut">Koi record nahi</div>';
 L.slice(0,25).forEach(async x=>{try{let q=db.collection("staff_docs").where("staffId","==",x._id).where("kind","==","photo");if(!(window.omSecureSession&&window.omSecureSession.isMasterAdmin))q=q.where("gymId","==",String(window.omSecureSession.gymId));const snap=await q.limit(1).get();if(!snap.empty&&$("th_"+x._id))$("th_"+x._id).src=snap.docs[0].data().img}catch(e){}})}
function back(){CUR=null;$("viewBox").classList.add("hide");$("editBox").classList.add("hide");$("listBox").classList.remove("hide");msg("")}
async function openRec(id){
 CUR=ST.find(x=>x._id===id);DOCS={};$("listBox").classList.add("hide");$("viewBox").classList.remove("hide");$("detail").innerHTML="Loading...";
 try{let q=db.collection("staff_docs").where("staffId","==",id);if(!(window.omSecureSession&&window.omSecureSession.isMasterAdmin))q=q.where("gymId","==",String(window.omSecureSession.gymId));if(window.omSecureSession&&window.omSecureSession.role==="manager"&&window.omSecureSession.branchId)q=q.where("branchId","==",String(window.omSecureSession.branchId));const s=await q.get();s.forEach(d=>DOCS[d.data().kind]=d.data().img)}catch(e){}
 showDetail()}
function showDetail(){
 const x=CUR,b=x.banking||{},tb=(rows)=>'<table>'+rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+esc(r[1])+'</td></tr>').join("")+'</table>';
 $("detail").innerHTML='<div style="text-align:center"><b style="font-size:16px">STAFF JOINING FORM</b><br>ID: '+esc(x.id)+' • '+esc(x.joiningDate||"")+'</div>'+
 (DOCS.photo?'<div style="text-align:center;margin:8px"><img src="'+DOCS.photo+'" style="width:90px;height:90px;object-fit:cover;border-radius:8px"></div>':'')+
 '<h3>Personal</h3>'+tb([["Naam",x.name],["Pita",x.fatherName],["DOB / Age",(x.dob||"")+" / "+(x.age||"")],["Gender / Marital",(x.gender||"")+" / "+(x.maritalStatus||"")],["Mobile",x.phone],["Email",x.email],["Permanent address",x.permanentAddress],["Current address",x.currentAddress],["Emergency",((x.emergency||{}).name||"")+" ("+((x.emergency||{}).relation||"")+") "+((x.emergency||{}).phone||"")]])+
 '<h3>Post & Reporting</h3>'+tb([["Post",x.post||x.role],["Category",x.category],["Branch",x.branch],["Reporting Manager",((x.reportingManager||{}).name||"")+" "+((x.reportingManager||{}).phone||"")],["Shift / Off",(x.shift||"")+" / "+(x.weeklyOff||"")],["Salary",(x.salaryType||"")+" ₹"+(x.salary||0)]])+
 '<h3>KYC & Qualification</h3>'+tb([["Gov ID",((x.govId||{}).type||"")+": "+((x.govId||{}).number||"")],["Qualification",((x.qualification||{}).level||"")+" "+((x.qualification||{}).institute||"")],["Experience",((x.experience||{}).type||"")+" "+((x.experience||{}).totalExp||"")]])+
 '<div class="docs">'+["govFront","govBack","qual1","qual2"].filter(k=>DOCS[k]).map(k=>'<figure><img src="'+DOCS[k]+'"><figcaption>'+KIND[k]+'</figcaption></figure>').join("")+'</div>'+
 '<h3>Salary Payment</h3>'+(x.payMode==="Cash"?tb([["Mode","Cash (bank details nahi)"]]):tb([["Mode",x.payMode],["Bank",b.bank],["Holder",b.holder],["Account",b.account],["IFSC",b.ifsc],["UPI",b.upi],["UAN",b.uan]]))}
function editMode(){
 const x=CUR,b=x.banking||{},cash=x.payMode==="Cash";NEWDOC={};
 const f=(id,l,v)=>'<label>'+l+'</label><input id="e_'+id+'" value="'+esc(v)+'">';
 $("viewBox").classList.add("hide");$("editBox").classList.remove("hide");
 $("editBox").innerHTML='<div class="row"><button class="b g" onclick="cancelEdit()">⬅ Cancel</button></div><div style="background:#121212;border:1px solid #ffcc00;border-radius:12px;padding:12px">'+
 f("name","Naam",x.name)+f("phone","Mobile",x.phone)+f("email","Email",x.email)+f("post","Post",x.post||x.role)+f("branch","Branch",x.branch)+
 f("mgrName","Reporting Manager",(x.reportingManager||{}).name)+f("mgrPhone","Manager ka number",(x.reportingManager||{}).phone)+f("salary","Salary ₹",x.salary)+
 f("perm","Permanent address",x.permanentAddress)+f("curr","Current address",x.currentAddress)+f("govNo","Gov ID number",(x.govId||{}).number)+
 f("ql","Qualification",(x.qualification||{}).level)+f("qi","Sanstha",(x.qualification||{}).institute)+
 (cash?'':f("bank","Bank",b.bank)+f("holder","Account holder",b.holder)+f("acc","Account number",b.account)+f("ifsc","IFSC",b.ifsc)+f("upi","UPI",b.upi))+
 '<label>Photo / document badlo</label>'+["photo","govFront","govBack","qual1","qual2"].map(k=>'<div style="font-size:11px;color:#bbb;margin-top:6px">'+KIND[k]+'</div><input type="file" accept="image/*" onchange="newDoc(this,\''+k+'\')">').join("")+
 '<div class="row"><button class="b" onclick="saveEdit()">💾 Save karo</button></div></div>'}
function cancelEdit(){$("editBox").classList.add("hide");$("viewBox").classList.remove("hide")}
function newDoc(inp,k){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);NEWDOC[k]=c.toDataURL("image/jpeg",.6)};im.src=r.result};r.readAsDataURL(f)}
async function saveEdit(){
 const v=id=>($("e_"+id)||{}).value,x=CUR,cash=x.payMode==="Cash";
 const up={name:v("name").trim(),phone:v("phone").trim(),email:v("email").trim(),post:v("post").trim(),branch:v("branch").trim(),salary:Number(v("salary"))||0,monthlySalary:Number(v("salary"))||0,
  permanentAddress:v("perm").trim(),currentAddress:v("curr").trim(),"govId.number":v("govNo").trim().toUpperCase(),"qualification.level":v("ql").trim(),"qualification.institute":v("qi").trim(),
  "reportingManager.name":v("mgrName").trim(),"reportingManager.phone":v("mgrPhone").trim(),editedAt:new Date().toISOString()};
 if(!up.name||!up.phone)return msg("Naam aur mobile zaroori hai.");
 if(!cash){up["banking.bank"]=v("bank").trim();up["banking.holder"]=v("holder").trim();up["banking.account"]=v("acc").trim();up["banking.ifsc"]=v("ifsc").trim().toUpperCase();up["banking.upi"]=v("upi").trim()}
 try{await db.collection("staff").doc(x._id).update(up);
  for(const k of Object.keys(NEWDOC)){const gid=String(window.omSecureSession.gymId);await db.collection("staff_docs").doc(gid+"__"+x._id+"_"+k).set({gymId:gid,branchId:String(x.branchId||x.branch||window.omSecureSession.branchId||"001"),uid:x.uid||"",staffId:x._id,kind:k,img:NEWDOC[k],at:Date.now()});DOCS[k]=NEWDOC[k]}
  const s=await db.collection("staff").doc(x._id).get();CUR={_id:x._id,...s.data()};ST=ST.map(t=>t._id===x._id?CUR:t);
  msg("✅ Save ho gaya.",true);cancelEdit();showDetail()}catch(e){msg("Save nahi hua ("+(e.code||e.message)+")")}}
async function dl(){
 try{const c=await html2canvas($("detail"),{backgroundColor:"#ffffff",scale:1.6,useCORS:true}),{jsPDF}=window.jspdf,pdf=new jsPDF("p","mm","a4"),w=210,H=297,ih=c.height*w/c.width,img=c.toDataURL("image/jpeg",.85);
  let y=0;while(y<ih){pdf.addImage(img,"JPEG",0,-y,w,ih);y+=H;if(y<ih)pdf.addPage()}pdf.save("Staff_"+(CUR.name||"form").replace(/\s+/g,"_")+".pdf")}catch(e){msg("Download nahi hua ("+e.message+")")}}
</script></body></html>
