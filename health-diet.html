<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diet Orders – Admin Panel & History</title>
<style>
  body{background:#0b0b0b;color:#fff;font-family:system-ui,sans-serif;padding:14px;max-width:520px;margin:auto}
  h2{color:#ffcc00}
  .c{background:#161616;border:1px solid #333;border-radius:12px;padding:12px;margin:10px 0;font-size:14px;line-height:1.6}
  button{padding:11px;border:0;border-radius:8px;font-weight:800;width:49%;font-size:14px;cursor:pointer;margin-top:6px}
  input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #444;background:#000;color:#fff;font-size:16px;text-align:center;letter-spacing:4px}
  .a{background:#3ddc84;color:#000}
  .r{background:#ff5c5c;color:#000}
  .y{background:#ffcc00;color:#000;width:100%;letter-spacing:normal}
  .m{color:#aaa;font-size:12px}
  .e{color:#ff6b6b;font-size:13px;margin-top:8px}
  .badge-approved{color:#3ddc84;font-weight:bold;}
  .badge-rejected{color:#ff5c5c;font-weight:bold;}
  .badge-pending{color:#ffcc00;font-weight:bold;}
</style>
</head>
<body>

<!-- PIN LOCK SCREEN -->
<div id="lockScreen" class="c" style="text-align:center; margin-top: 40px; border-color: #ffcc00;">
  <h3 style="color:#ffcc00; margin-bottom: 8px;">🔒 Admin PIN Required</h3>
  <div class="m">कृपया 4 अंकों का Admin PIN दर्ज करें</div>
  <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <button class="y" onclick="checkPin()">Unlock Panel</button>
  <div id="pinError" class="e"></div>
</div>

<!-- MAIN ADMIN CONTENT -->
<div id="adminContent" style="display:none;">
  <h2>🧾 Diet Orders & History</h2>
  <div class="m">नया ऑर्डर आते ही घंटी बजेगी। सभी पेंडिंग और पुराने रिकॉर्ड यहाँ दिखेंगे।</div>
  <div id="st" class="m" style="margin-top:8px">⏳ Orders load ho rahe hain...</div>
  
  <h3 style="color:#ffcc00; margin-top:15px;">⏳ Pending Orders (Approval Required)</h3>
  <div id="pendingList"></div>

  <h3 style="color:#aaa; margin-top:25px;">📜 All Orders History (Sabhi Purane Records)</h3>
  <div id="historyList"></div>
</div>

<script>
const $=i=>document.getElementById(i),say=t=>$("st").innerHTML=t;

function checkPin(){
  const pin = $("pinInput").value.trim();
  if(pin === "5555"){
    $("lockScreen").style.display = "none";
    $("adminContent").style.display = "block";
    initFirebase();
  } else {
    $("pinError").innerText = "❌ गलत PIN! (Correct PIN is 5555)";
    $("pinInput").value = "";
  }
}

$("pinInput").addEventListener("keypress", function(event) {
  if (event.key === "Enter") { checkPin(); }
});

const L=u=>new Promise((r,e)=>{const s=document.createElement("script");s.src=u;s.onload=r;s.onerror=()=>e(new Error("load nahi hua: "+u));document.head.appendChild(s)});

// Play Beep Sound for Notification
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = "sine";
    osc.frequency.value = 800;
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

async function loadOrders(){
  try{
    say("✅ Orders fetch kiye ja rahe hain...");
    let firstLoad = true;
    
    firebase.firestore().collection("diet_orders").orderBy("t", "desc").onSnapshot(q=>{
      const pList = $("pendingList");
      const hList = $("historyList");
      pList.innerHTML = "";
      hList.innerHTML = "";

      if(q.empty){
        pList.innerHTML = "<div class='c' style='text-align:center;'>Koi pending order nahi hai.</div>";
        hList.innerHTML = "<div class='c' style='text-align:center;'>Koi history available nahi hai.</div>";
        say("");
        return;
      }

      let pendingCount = 0;
      let hasNewOrder = false;

      q.forEach(d=>{
        const o = d.data();
        const dateStr = new Date(o.t).toLocaleString();
        const ssHtml = o.ss ? `<br><a href="${o.ss}" target="_blank" style="color:#ffcc00;font-weight:bold;">📸 Payment Screenshot Dekhein</a>` : "";
        
        // History Card (Sabhi ke liye)
        const histCard = document.createElement("div");
        histCard.className = "c";
        let statusBadge = `<span class="badge-pending">Pending</span>`;
        if(o.status === "approved") statusBadge = `<span class="badge-approved">Approved ✅</span>`;
        if(o.status === "rejected") statusBadge = `<span class="badge-rejected">Rejected ❌</span>`;

        histCard.innerHTML = `<b>${o.n}</b> · ${o.mb} | Status: ${statusBadge}<br>Goal: <b>${o.goal || 'General'}</b> | ${o.days} din · <b>₹${o.price}</b><br>UTR: <b>${o.utr}</b>${ssHtml}<br><span class="m">${dateStr} · Umar ${o.a}, BMI ${o.B}</span>`;
        hList.appendChild(histCard);

        // Pending Card (Sirf unke liye jo pending hain)
        if(o.status === "pending"){
          pendingCount++;
          if(!firstLoad) { hasNewOrder = true; }

          const e = document.createElement("div");
          e.className = "c";
          e.innerHTML = `<b>${o.n}</b> · ${o.mb}<br>Goal: <b>${o.goal || 'General'}</b><br>${o.days} din · <b>₹${o.price}</b><br>UTR: <b>${o.utr}</b>${ssHtml}<br><span class="m">${dateStr} · Umar ${o.a}, BMI ${o.B}</span><br><button class="a">✅ Approve</button> <button class="r">❌ Reject</button>`;
          
          const [btnA, btnR] = e.querySelectorAll("button");
          btnA.onclick = () => d.ref.update({status:"approved"});
          btnR.onclick = () => d.ref.update({status:"rejected"});
          pList.appendChild(e);
        }
      });

      if(pendingCount === 0){
        pList.innerHTML = "<div class='c' style='text-align:center;'>Koi pending order nahi hai.</div>";
      }

      if(hasNewOrder){
        playBeep();
      }

      firstLoad = false;
      say("");
    }, err => {
      say('<span class="e">Error: '+err.message+'</span>');
    });
  }catch(err){
    say('<span class="e">Error: '+err.message+'</span>');
  }
}

async function initFirebase(){
  try{
    const V="https://www.gstatic.com/firebasejs/9.22.2/firebase-";
    await L(V+"app-compat.js");
    await L(V+"firestore-compat.js");
    
    if(!firebase.apps.length){
      firebase.initializeApp({
        apiKey:"AIzaSyA9z1gXZDB3W0lJxyHV9x2vWeb0Ees7z-g",
        authDomain:"brother-s-fitness-club.firebaseapp.com",
        projectId:"brother-s-fitness-club"
      });
    }
    loadOrders();
  }catch(e){
    say('<span class="e">'+e.message+'</span>');
  }
}
</script>
</body>
</html>
