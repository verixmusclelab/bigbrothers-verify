<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5BFC Store Admin – Photo + Price</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
  body{background:#0d0d0d;color:#fff;padding:12px;max-width:720px;margin:0 auto;padding-bottom:40px}
  h1{color:#ffcc00;font-size:18px;margin:8px 0}
  .pin-box{background:#151515;border:2px solid #ffcc00;border-radius:14px;padding:24px;text-align:center;margin-top:40px}
  .pin-box input{width:100%;padding:14px;font-size:20px;text-align:center;border-radius:10px;border:1px solid #444;background:#000;color:#ffcc00;letter-spacing:8px}
  .btn{background:#ffcc00;color:#000;border:none;font-weight:900;padding:12px 16px;border-radius:10px;cursor:pointer;font-size:14px}
  .btn-sec{background:#222;color:#ffcc00;border:1px solid #ffcc00}
  .btn-green{background:#00ff66;color:#000}
  .btn-sm{padding:8px 12px;font-size:12px}
  .search{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin:10px 0;font-size:14px}
  .card{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:12px;margin-bottom:12px}
  .card h3{font-size:14px;color:#fff;margin-bottom:4px}
  .meta{font-size:11px;color:#888;margin-bottom:8px}
  .row{display:flex;gap:10px;align-items:flex-start}
  .thumb{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:8px;flex-shrink:0}
  .thumb-ph{width:72px;height:72px;background:#222;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#666;font-size:10px;text-align:center}
  .fields{flex:1;min-width:0}
  label{display:block;font-size:11px;color:#aaa;margin:6px 0 2px}
  input[type=number],input[type=text],select{width:100%;padding:8px;border-radius:6px;border:1px solid #444;background:#1a1a1a;color:#ffcc00;font-size:13px}
  .var-row{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:6px;align-items:end;margin-bottom:6px}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#00ff66;color:#000;padding:12px 18px;border-radius:10px;font-weight:800;display:none;z-index:99}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  a.home{color:#ffcc00;font-size:12px;font-weight:700}
  .hint{font-size:11px;color:#888;line-height:1.4;margin:6px 0 12px}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="loginScreen" class="pin-box">
  <div style="font-size:32px;margin-bottom:8px">🔐</div>
  <h1>Store Admin</h1>
  <p style="color:#aaa;font-size:12px;margin:8px 0 14px">Photo upload + Price edit<br>PIN same as admission admin</p>
  <input type="password" id="pinInput" placeholder="PIN" maxlength="8" inputmode="numeric">
  <button class="btn" style="width:100%;margin-top:12px" onclick="tryLogin()">Unlock</button>
</div>

<div id="adminScreen" style="display:none">
  <div class="top">
    <h1>📦 Store Photo & Price</h1>
    <div>
      <a class="home" href="store.html">← Store</a>
      &nbsp;
      <button class="btn btn-sec btn-sm" onclick="location.reload()">Logout</button>
    </div>
  </div>
  <p class="hint">
    1) Product kholo → photo choose karo → <b>Save Photo</b> → store par dikhegi (refresh).<br>
    2) Price/MRP badlo → <b>Save Prices</b> → store par live update.<br>
    Store file edit ki zaroorat nahi.
  </p>
  <input class="search" id="q" placeholder="Search brand / product..." oninput="renderList()">
  <div id="list"></div>
</div>

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2500)}
function tryLogin(){
  if(document.getElementById("pinInput").value===PIN){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("adminScreen").style.display="block";
    loadOverrides().then(renderList);
  } else alert("Galat PIN");
}
document.getElementById("pinInput").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin()});

let overrides = {}; // id -> {v:{packKey:{p,m}}, images:[], thumb}
function keyPack(s){return String(s).replace(/[^a-z0-9]/gi,"_")}

async function loadOverrides(){
  overrides={};
  try{
    let tok="";
    do{
      const r=await fetch(FS+"/price_overrides?pageSize=300"+(tok?"&pageToken="+encodeURIComponent(tok):""));
      if(!r.ok)break;
      const j=await r.json();
      (j.documents||[]).forEach(d=>{
        const id=d.name.split("/").pop();
        const f=d.fields||{};
        const o={};
        if(f.v&&f.v.mapValue){
          o.v={};
          const mf=f.v.mapValue.fields||{};
          Object.keys(mf).forEach(k=>{
            const x=mf[k].mapValue&&mf[k].mapValue.fields||{};
            o.v[k]={p:x.p?(Number(x.p.integerValue||x.p.doubleValue)):null,m:x.m?(Number(x.m.integerValue||x.m.doubleValue)):null};
          });
        }
        overrides[id]=o;
      });
      tok=j.nextPageToken||"";
    }while(tok);
  }catch(e){console.log(e)}
  // photos
  try{
    for(const p of CATALOG){
      try{
        const r=await fetch(FS+"/product_photos/"+encodeURIComponent(p.id));
        if(!r.ok)continue;
        const j=await r.json();
        const vals=(j.fields&&j.fields.imgs&&j.fields.imgs.arrayValue&&j.fields.imgs.arrayValue.values)||[];
        const imgs=vals.map(v=>v.stringValue).filter(Boolean);
        if(imgs.length){
          if(!overrides[p.id])overrides[p.id]={};
          overrides[p.id].images=imgs;
        }
      }catch(e){}
    }
  }catch(e){}
}

function effectiveVariants(p){
  const o=overrides[p.id]||{};
  return (p.variants||[]).map(v=>{
    const k=keyPack(v.pack);
    const ov=o.v&&o.v[k];
    return {
      pack:v.pack,
      price: (ov&&ov.p!=null)?ov.p:v.price,
      mrp: (ov&&ov.m!=null)?ov.m:v.mrp,
      key:k
    };
  });
}

function productImg(p){
  const o=overrides[p.id];
  if(o&&o.images&&o.images[0])return o.images[0];
  return "";
}

function renderList(){
  const q=(document.getElementById("q").value||"").toLowerCase().trim();
  const list=document.getElementById("list");
  const items=CATALOG.filter(p=>{
    if(!q)return true;
    return (p.name+" "+p.brand+" "+p.category).toLowerCase().includes(q);
  });
  list.innerHTML=items.map(p=>{
    const img=productImg(p);
    const vars=effectiveVariants(p);
    const varHtml=vars.map((v,i)=>`
      <div class="var-row">
        <div><label>Pack</label><input type="text" value="${v.pack.replace(/"/g,"&quot;")}" readonly style="color:#ccc"></div>
        <div><label>Store ₹</label><input type="number" id="price-${p.id}-${i}" value="${v.price}"></div>
        <div><label>Flipkart ₹</label><input type="number" id="mrp-${p.id}-${i}" value="${v.mrp}"></div>
        <div style="font-size:10px;color:#666;padding-bottom:8px">${v.key}</div>
      </div>`).join("");
    return `<div class="card" id="card-${p.id}">
      <div class="row">
        ${img?`<img class="thumb" src="${img}" alt="">`:`<div class="thumb-ph">No<br>photo</div>`}
        <div class="fields">
          <h3>${p.name}</h3>
          <div class="meta">${p.brand} · ${p.category} · id: ${p.id}</div>
          <label>📷 Photo upload (1 image)</label>
          <input type="file" accept="image/*" id="file-${p.id}" onchange="previewFile('${p.id}')">
          <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-green btn-sm" onclick="savePhoto('${p.id}')">Save Photo</button>
            <button class="btn btn-sm" onclick="savePrices('${p.id}')">Save Prices</button>
          </div>
        </div>
      </div>
      <div style="margin-top:10px">${varHtml}</div>
    </div>`;
  }).join("")||'<p style="color:#888;text-align:center;padding:20px">No match</p>';
}

function previewFile(id){
  const f=document.getElementById("file-"+id).files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const card=document.getElementById("card-"+id);
    let img=card.querySelector("img.thumb");
    if(!img){
      const ph=card.querySelector(".thumb-ph");
      img=document.createElement("img");img.className="thumb";
      if(ph)ph.replaceWith(img); else card.querySelector(".row").prepend(img);
    }
    img.src=r.result;
  };
  r.readAsDataURL(f);
}

function compressImage(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        let w=im.width,h=im.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
        const c=document.createElement("canvas");
        c.width=w;c.height=h;
        c.getContext("2d").drawImage(im,0,0,w,h);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      im.onerror=reject;
      im.src=fr.result;
    };
    fr.onerror=reject;
    fr.readAsDataURL(file);
  });
}

function toFsString(s){return {stringValue:String(s)}}
function toFsInt(n){return {integerValue:String(Math.round(Number(n)||0))}}
function toFsMap(obj){
  const fields={};
  Object.keys(obj).forEach(k=>{
    const v=obj[k];
    if(v&&typeof v==="object"&&!Array.isArray(v)&&!("stringValue"in v)&&!("integerValue"in v)) fields[k]=toFsMap(v);
    else if(typeof v==="number") fields[k]=toFsInt(v);
    else fields[k]=toFsString(v);
  });
  return {mapValue:{fields}};
}

async function savePhoto(id){
  const input=document.getElementById("file-"+id);
  if(!input.files||!input.files[0]){alert("Pehle photo choose karo");return}
  toast("Compressing...");
  try{
    let dataUrl=await compressImage(input.files[0], 500, 0.72);
    // if still huge, compress more
    if(dataUrl.length>900000) dataUrl=await compressImage(input.files[0], 360, 0.55);
    if(dataUrl.length>950000){alert("Photo abhi bhi badi hai — dusri chhoti photo try karo");return}
    const body={fields:{
      imgs:{arrayValue:{values:[{stringValue:dataUrl}]}},
      updatedAt:{stringValue:new Date().toISOString()}
    }};
    const url=FS+"/product_photos/"+encodeURIComponent(id);
    let r=await fetch(url+"?alt=json",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.status===404||!r.ok){
      r=await fetch(url,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    }
    // Firestore REST create if missing
    if(!r.ok){
      r=await fetch(FS+"/product_photos?documentId="+encodeURIComponent(id),{
        method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)
      });
    }
    if(!r.ok){
      const t=await r.text();
      console.error(t);
      // fallback: still works client-side via price_overrides images field if rules allow
      alert("Cloud photo save fail ("+r.status+"). Firebase rules check karo.\n"+t.slice(0,120));
      return;
    }
    if(!overrides[id])overrides[id]={};
    overrides[id].images=[dataUrl];
    toast("✅ Photo saved — store refresh karo");
    renderList();
  }catch(e){
    console.error(e);
    alert("Photo error: "+e.message);
  }
}

async function savePrices(id){
  const p=CATALOG.find(x=>x.id===id);
  if(!p)return;
  const vMap={};
  (p.variants||[]).forEach((v,i)=>{
    const price=Number(document.getElementById("price-"+id+"-"+i).value);
    const mrp=Number(document.getElementById("mrp-"+id+"-"+i).value);
    const k=keyPack(v.pack);
    vMap[k]={p:price,m:mrp};
  });
  // Build Firestore fields
  const vFields={};
  Object.keys(vMap).forEach(k=>{
    vFields[k]={mapValue:{fields:{p:toFsInt(vMap[k].p),m:toFsInt(vMap[k].m)}}};
  });
  const body={fields:{
    v:{mapValue:{fields:vFields}},
    updatedAt:{stringValue:new Date().toISOString()}
  }};
  try{
    let r=await fetch(FS+"/price_overrides/"+encodeURIComponent(id),{
      method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)
    });
    if(!r.ok){
      r=await fetch(FS+"/price_overrides?documentId="+encodeURIComponent(id),{
        method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)
      });
    }
    if(!r.ok){
      const t=await r.text();
      alert("Price save fail: "+r.status+"\nFirebase rules me write allow hona chahiye.\n"+t.slice(0,150));
      return;
    }
    if(!overrides[id])overrides[id]={};
    overrides[id].v=vMap;
    toast("✅ Prices saved — store par live");
  }catch(e){alert(e.message)}
}
