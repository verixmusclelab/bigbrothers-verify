<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Staff Joining &amp; Verification Form</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#0A0F1E;--card:#121A2E;--border:#223052;--ac:#FFB800;--tx:#EAF0FF;--mut:#8D99B8;--ok:#22C55E;--er:#FF6B6B}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,sans-serif}
body{background:radial-gradient(1200px 500px at 50% -10%,#16224a 0%,#0A0F1E 60%) fixed #0A0F1E;color:var(--tx);max-width:560px;margin:0 auto;padding:14px 12px 90px;min-height:100vh}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.btn-back{background:linear-gradient(135deg,#FFC83D,#FFA800);color:#1a1200;font-weight:900;font-size:12px;padding:8px 14px;border-radius:10px;border:none;text-decoration:none;cursor:pointer;display:inline-block}
.header-box{background:linear-gradient(160deg,#16213f,#101830);border:1.5px solid var(--border);border-radius:18px;padding:18px 14px;text-align:center;margin-bottom:14px}
.header-box h1{color:#fff;font-size:20px;font-weight:900}
.header-box p{color:var(--ac);font-size:12px;font-weight:700;margin-top:4px}
.form-card{background:linear-gradient(160deg,#16213f,#101830);border:1.5px solid var(--border);border-radius:18px;padding:18px 14px}
.section-title{color:var(--ac);font-weight:900;font-size:13px;margin:16px 0 10px;padding-bottom:4px;border-bottom:1.5px dashed var(--border)}
.field-group{margin-bottom:11px}
label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:4px;font-weight:700}
input,select,textarea{width:100%;background:#0B1226;border:1.5px solid var(--border);color:var(--tx);padding:11px;border-radius:10px;font-size:13px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-submit{width:100%;background:linear-gradient(135deg,#22C55E,#16A34A);color:#04210f;font-weight:900;font-size:14px;padding:14px;border:none;border-radius:12px;cursor:pointer;margin-top:16px}
</style>
</head>
<body>
<div class="top-bar">
  <a class="btn-back" href="index.html">← Dashboard</a>
  <span style="font-size:11.5px;color:var(--ac);font-weight:800">CLOUD STAFF JOINING</span>
</div>
<div class="header-box">
  <h1 id="gymBrandTitle">GYM / FITNESS CLUB</h1>
  <p>Staff Joining Form (Cloud Synced)</p>
</div>
<div class="form-card">
  <form id="staffJoinForm" onsubmit="saveStaffCloud(event)">
    <div class="section-title">1. कर्मचारी विवरण (Staff Details)</div>
    <div class="field-group"><label>पूरा नाम (Full Name) *</label><input type="text" id="stfName" required placeholder="Full Name"></div>
    <div class="row-2">
      <div class="field-group"><label>मोबाइल (Mobile) *</label><input type="tel" id="stfPhone" maxlength="10" required placeholder="10-digit mobile"></div>
      <div class="field-group"><label>पद / श्रेणी (Role) *</label>
        <select id="stfRole" required>
          <option value="Trainer">Trainer / Coach</option>
          <option value="Receptionist">Reception / Desk</option>
          <option value="Support">Helper / Support</option>
          <option value="Manager">Manager</option>
        </select>
      </div>
    </div>
    <div class="row-2">
      <div class="field-group"><label>Branch ID *</label><input type="text" id="stfBranch" value="001" required></div>
      <div class="field-group"><label>Salary (₹) *</label><input type="number" id="stfSalary" value="12000" required></div>
    </div>
    <div class="field-group"><label>पता (Address)</label><textarea id="stfAddr" rows="2" placeholder="Address"></textarea></div>
    <button type="submit" class="btn-submit" id="btnSubmitStaff">Save Staff to Cloud &amp; App</button>
    <div id="saveMsg" style="margin-top:10px;font-size:12px;color:#4ade80;font-weight:700"></div>
  </form>
</div>
<script>
const CFG={apiKey:'AIzaSyAwuFgPJUavmRRzkHOz83FUP0EyfZETCU',authDomain:'orgdesk-fc207.firebaseapp.com',projectId:'orgdesk-fc207',storageBucket:'orgdesk-fc207.firebasestorage.app',messagingSenderId:'677150519977',appId:'1:677150519977:web:74de5f488494280d352fb8'};
let db=null;
try{if(window.firebase){if(!firebase.apps.length)firebase.initializeApp(CFG);db=firebase.firestore();}}catch(e){}

window.addEventListener("DOMContentLoaded", function(){
  try{
    var prof=JSON.parse(localStorage.getItem("om_active_gym_profile")||"{}");
    if(prof.gymName) document.getElementById("gymBrandTitle").textContent=prof.gymName.toUpperCase();
  }catch(e){}
});

async function saveStaffCloud(ev){
  ev.preventDefault();
  var id="STF-"+Date.now().toString().slice(-6);
  var rec={
    id:id,
    name:document.getElementById("stfName").value.trim(),
    phone:document.getElementById("stfPhone").value.trim(),
    role:document.getElementById("stfRole").value,
    branch:document.getElementById("stfBranch").value.trim()||"001",
    branchId:document.getElementById("stfBranch").value.trim()||"001",
    salary:Number(document.getElementById("stfSalary").value||0),
    address:document.getElementById("stfAddr").value.trim(),
    status:"Active",
    createdAt:new Date().toISOString()
  };
  try{
    var list=JSON.parse(localStorage.getItem("bfc_staff_list")||"[]")||[];
    list.unshift(rec);
    localStorage.setItem("bfc_staff_list",JSON.stringify(list));
    localStorage.setItem("om_staff_master_v2",JSON.stringify(list));
  }catch(e){}
  if(db){
    try{await db.collection("staff").doc(id).set(rec,{merge:true});}catch(e){}
  }
  document.getElementById("saveMsg").textContent="Saved! Staff ID: "+id+" (Cloud synced)";
  document.getElementById("staffJoinForm").reset();
}
</script>
</body>
</html>
